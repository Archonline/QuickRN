name: QuickRN question-bank validation

on:
  push:
    branches: [main]
    paths:
      - 'questions*.js'
      - 'questions-bank-*.js'
      - 'question-bank-rebuild/**'
      - 'js/quickrn-question-schema-v2.js'
      - 'js/quickrn-ngn-scoring.js'
      - 'js/shared-exam-renderer.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/question-bank-validation.yml'
  pull_request:
    paths:
      - 'questions*.js'
      - 'questions-bank-*.js'
      - 'question-bank-rebuild/**'
      - 'js/quickrn-question-schema-v2.js'
      - 'js/quickrn-ngn-scoring.js'
      - 'js/shared-exam-renderer.js'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    # Daily at 09:00 Asia/Manila (UTC+8).
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickrn-question-bank-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Legacy audit requires the retired 2,000+ question bank. The rebuild has dedicated fail-closed checks.
    if: github.event_name != 'pull_request' || github.head_ref != 'rebuild/validated-question-bank'
    name: Structural, clinical-content, scoring and exam-mode regression audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the single consolidated question-bank file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/build-consolidated-question-bank.js
          if ! git diff --quiet -- question-bank.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add question-bank.js
            git commit -m "Build consolidated QuickRN question bank"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check and load the canonical question bank
        run: |
          node --check data/question-bank.js
          node - <<'NODE'
          const bank = require('./data/question-bank.js');
          if (!Array.isArray(bank) || bank.length < 1) throw new Error('Canonical question bank is empty');
          const ids = bank.map(q => String(q && q.id || '')).filter(Boolean);
          if (ids.length !== bank.length || new Set(ids).size !== ids.length) throw new Error('Canonical bank contains missing or duplicate IDs');
          console.log('Canonical bank loaded:', bank.length, 'records;', ids.length, 'unique IDs.');
          NODE

      - name: Run question-bank, renderer, scoring and four-mode regression tests
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/case-study-sequencer.test.js
            tests/cat-engine.test.js
            tests/clinical-prompt-normalizer.test.js
            tests/clinical-schema-adapter.test.js
            tests/clinical-v3-bank.test.js
            tests/clinical-v3-rendering.test.js
            tests/curated-question-bank.test.js
            tests/exam-page-script-contract.test.js
            tests/exam-unified-interface-contract.test.js
            tests/ngn-scoring.test.js
            tests/ngn-workspace-contract.test.js
            tests/question-bank-renderer-contract.test.js
            tests/question-bank-quality-gate.test.js
            tests/question-id-normalizer.test.js
            tests/question-schema-v2.test.js
            tests/quickrn-ngn-compat.test.js
            tests/selfstudy-lifecycle.test.js
            tests/shared-renderer.test.js
          )
          failures=0
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            if node "${test_file}"; then
              echo "PASS: ${test_file}"
            else
              echo "FAIL: ${test_file}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "Failed test files: ${failures}"
          if (( failures > 0 )); then exit 1; fi

      - name: Audit loaded question bank and format mappings
        id: bank_audit
        continue-on-error: true
        run: node tests/question-bank-renderer-contract.test.js

      - name: Audit clinical content, distractors, rationales and case records
        id: content_audit
        continue-on-error: true
        run: node scripts/audit-question-quality.js

      - name: Audit canonical schema v2
        id: schema_audit
        continue-on-error: true
        run: node scripts/validate-question-schema-v2.js

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickrn-question-bank-audit-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/ngn-bank-validation.json
            reports/ngn-bank-validation.md
            reports/question-content-quality-audit.json
            reports/question-content-quality-audit.md
            reports/question-schema-v2-validation.json
            reports/question-schema-v2-validation.md
            reports/question-schema-v2-schema-issue-queue.json

      - name: Summarize audit status
        if: always()
        shell: bash
        run: |
          {
            echo "## QuickRN question-bank audit"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch/event: \`${GITHUB_REF_NAME}\` / \`${GITHUB_EVENT_NAME}\`"
            echo "- Focused regression tests: ${{ steps.regression.outcome }}"
            echo "- Bank audit exit: \`${{ steps.bank_audit.outcome }}\`"
            echo "- Content-quality audit exit: ${{ steps.content_audit.outcome }}"
            echo "- Schema audit exit: \`${{ steps.schema_audit.outcome }}\`"
            echo
            echo "Detailed reports are attached as workflow artifacts. Content-quality findings are reported separately from runtime scoring; this workflow does not modify question data or scoring behavior."
          } >> "$GITHUB_STEP_SUMMARY"
