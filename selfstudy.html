        // DEDUPLICATION & METADATA CLEANER
        function cleanQuestionText(text) {
            if (!text) return '';
            let cleaned = text.replace(/\[.*?\]\s*/g, '').trim();
            const sentences = cleaned.split(/(?<=[.?!])\s+/);
            const unique = [];
            sentences.forEach(s => {
                const t = s.trim();
                if (t && !unique.includes(t)) unique.push(t);
            });
            return unique.join(' ');
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // MAIN REACT APPLICATION COMPONENT
        function App() {
            const [showLaunchModal, setShowLaunchModal] = useState(true);
            const [activePool, setActivePool] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [flaggedItems, setFlaggedItems] = useState(new Set());
            const [showCalculator, setShowCalculator] = useState(false);
            const [calcDisplay, setCalcDisplay] = useState("0");
            const [activeEhrTab, setActiveEhrTab] = useState("notes");
            const [showResults, setShowResults] = useState(false);
            const [activeVideoModal, setActiveVideoModal] = useState(null);
            const [videoNotes, setVideoNotes] = useState({});

            // Launch Exam Session
            const launchSession = (count) => {
                let rawPool = defaultQBank;
                if (typeof embeddedQuestionsData !== 'undefined' && Array.isArray(embeddedQuestionsData)) {
                    rawPool = embeddedQuestionsData;
                } else if (typeof window.questions !== 'undefined' && Array.isArray(window.questions)) {
                    rawPool = window.questions;
                }

                const normalized = rawPool.map((q, idx) => ({
                    ...q,
                    id: q.id || `Q-${idx + 1}`,
                    cleanTitle: cleanQuestionText(q.title || q.promptTitle || q.question || `NCLEX Item ${idx + 1}`),
                    cleanInstruction: cleanQuestionText(q.instruction || q.question || "Evaluate clinical findings and select the appropriate action(s)."),
                    ngnType: q.ngnType || (q.isNGN ? "NGN Format" : "Single Choice"),
                    keyPhrase: q.keyPhrase || q.category || "Clinical Nursing Concept"
                }));

                const shuffled = shuffleArray(normalized);
                const selected = (count === 'all' || count >= shuffled.length) ? shuffled : shuffled.slice(0, count);

                setActivePool(selected);
                setCurrentIndex(0);
                setUserAnswers({});
                setShowLaunchModal(false);
                setShowResults(false);
            };

            const currentItem = activePool[currentIndex];
            const currentSavedState = userAnswers[currentIndex];
            const isSubmitted = currentSavedState?.submitted;

            // Handle Navigation
            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const handleNext = () => {
                if (currentIndex < activePool.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    finishExam();
                }
            };

            const exitToDashboard = () => {
                if (confirm("Exit test session and return to Dashboard?")) {
                    window.location.href = "dashboard.html";
                }
            };

            const toggleBookmark = (id) => {
                setFlaggedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            // Calculate item score
            const evaluateScore = (item, ans) => {
                if (!ans) return { earned: 0, max: 1 };
                switch (item.ngnType) {
                    case "Matrix / Grid": {
                        let earned = 0, max = item.rows.length;
                        item.rows.forEach(r => { if (ans[r.id] === item.correctAnswers[r.id]) earned++; });
                        return { earned, max };
                    }
                    case "Cloze (Drop-down)": {
                        let earned = 0, max = Object.keys(item.correctAnswers).length;
                        Object.keys(item.correctAnswers).forEach(k => { if (ans[k] === item.correctAnswers[k]) earned++; });
                        return { earned, max };
                    }
                    case "Extended Drag and Drop": {
                        let earned = 0, max = item.correctOrder.length;
                        (ans || []).forEach((v, idx) => { if (v === item.correctOrder[idx]) earned++; });
                        return { earned, max };
                    }
                    case "Extended Multiple Response": {
                        let correctCount = 0, incorrectCount = 0;
                        const correctSet = new Set(item.correctAnswers);
                        (ans || []).forEach(id => {
                            if (correctSet.has(id)) correctCount++;
                            else incorrectCount++;
                        });
                        return { earned: Math.max(0, correctCount - incorrectCount), max: item.correctAnswers.length };
                    }
                    case "Bowtie": {
                        let earned = 0;
                        if (ans.condition === item.correctAnswers.condition) earned++;
                        (ans.actions || []).forEach(a => { if (item.correctAnswers.actions.includes(a)) earned++; });
                        (ans.monitoring || []).forEach(m => { if (item.correctAnswers.monitoring.includes(m)) earned++; });
                        return { earned, max: 5 };
                    }
                    default: {
                        return { earned: ans === item.correctAnswer ? 1 : 0, max: 1 };
                    }
                }
            };

            const handleSubmitAnswer = (rawAnswer) => {
                const scoreRes = evaluateScore(currentItem, rawAnswer);
                const isCorrect = scoreRes.earned === scoreRes.max;

                setUserAnswers(prev => ({
                    ...prev,
                    [currentIndex]: {
                        answer: rawAnswer,
                        submitted: true,
                        score: scoreRes.earned,
                        maxScore: scoreRes.max,
                        isCorrect
                    }
                }));

                // Sync to localStorage
                let localState = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
                localState.studentStats = localState.studentStats || { totalAnswered: 0, correctCount: 0, mistakeCount: 0 };
                localState.studentStats.totalAnswered = (localState.studentStats.totalAnswered || 0) + 1;
                if (isCorrect) localState.studentStats.correctCount = (localState.studentStats.correctCount || 0) + 1;
                else localState.studentStats.mistakeCount = (localState.studentStats.mistakeCount || 0) + 1;
                localStorage.setItem('quickrn_student_state', JSON.stringify(localState));
            };

            const finishExam = () => {
                setShowResults(true);
            };

            // Calculator Input
            const handleCalc = (val) => {
                if (val === 'C') setCalcDisplay('0');
                else if (val === '=') {
                    try { setCalcDisplay(eval(calcDisplay.replace(/%/g, '/100')).toString()); }
                    catch { setCalcDisplay('Error'); }
                } else {
                    setCalcDisplay(prev => prev === '0' || prev === 'Error' ? val : prev + val);
                }
            };

            return (
                <div className="flex flex-col h-full w-full select-none">
                    
                    {/* START LAUNCH MODAL */}
                    {showLaunchModal && (
                        <div className="fixed inset-0 bg-slate-900/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 md:p-8 space-y-6 text-center border border-slate-300">
                                <div className="w-16 h-16 bg-blue-50 text-ncsbn-blue rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                                    <i className="fa-solid fa-user-nurse"></i>
                                </div>
                                <div className="space-y-2">
                                    <h1 className="text-2xl font-black text-slate-900">NCLEX-RN Practice Launch</h1>
                                    <p className="text-xs md:text-sm text-slate-600">Select the number of questions to load. Includes SATA, Matrix Grids, Cloze, Drag & Drop, Bowtie, and Case Studies.</p>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {[20, 60, 85, 150].map(cnt => (
                                        <button key={cnt} onclick={() => launchSession(cnt)} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center">
                                            <span className="text-xl font-black text-ncsbn-blue">{cnt}</span>
                                            <span className="text-[11px] text-slate-500 font-normal">Question Set</span>
                                        </button>
                                    ))}
                                    <button onclick={() => launchSession('all')} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center col-span-2 sm:col-span-1">
                                        <span className="text-xl font-black text-amber-600">ALL</span>
                                        <span className="text-[11px] text-slate-500 font-normal">Full Q-Bank</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION HEADER */}
                    <header className="bg-[#0B2240] text-white h-14 px-4 flex items-center justify-between border-b-2 border-amber-600 shadow-md shrink-0 z-30">
                        <button onclick={exitToDashboard} className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-100 rounded-lg text-xs font-bold transition border border-slate-600">
                            <i className="fa-solid fa-arrow-left"></i>
                            <span>Back to Dashboard</span>
                        </button>

                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-slate-800 px-3 py-1 rounded border border-slate-600 text-xs text-slate-200 font-mono">
                                Item <span className="font-bold text-amber-400">{currentIndex + 1}</span> of <span className="font-bold text-white">{activePool.length}</span>
                            </div>
                            <button onclick={() => setShowCalculator(!showCalculator)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className="fa-solid fa-calculator text-blue-400"></i>
                                <span className="hidden md:inline">Calculator</span>
                            </button>
                            <button onclick={() => currentItem && toggleBookmark(currentItem.id)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className={`fa-solid fa-bookmark ${currentItem && flaggedItems.has(currentItem.id) ? 'text-amber-400' : 'text-slate-400'}`}></i>
                                <span className="hidden md:inline">Bookmark</span>
                            </button>
                            <button onclick={exitToDashboard} className="px-3 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Exit Exam</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN TEST WORKSPACE */}
                    {!showResults && currentItem && (
                        <main className="flex-1 flex flex-col md:flex-row overflow-hidden p-2 gap-2 relative">
                            
                            {/* LEFT EHR PANEL (IF PRESENT) */}
                            {currentItem.ehr && (
                                <section className="w-full md:w-1/2 bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-hidden h-1/2 md:h-full">
                                    <div className="bg-slate-100 border-b border-slate-300 px-4 py-2 flex items-center justify-between shrink-0 text-xs md:text-sm font-bold text-slate-800">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-hospital-user text-ncsbn-blue"></i>
                                            <span>ELECTRONIC HEALTH RECORD (EHR)</span>
                                        </div>
                                        <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-mono font-semibold text-xs">
                                            Pt: {currentItem.patientInfo?.name || "Standard Client"}
                                        </span>
                                    </div>
                                    <div className="bg-slate-200/70 px-2 pt-2 border-b border-slate-300 flex gap-1 text-xs font-semibold text-slate-600 shrink-0">
                                        {[
                                            { id: 'notes', label: "Nurses' Notes", icon: 'fa-user-nurse', val: currentItem.ehr.nursesNotes },
                                            { id: 'vitals', label: 'Vital Signs', icon: 'fa-heart-pulse', val: currentItem.ehr.vitalSigns },
                                            { id: 'labs', label: 'Diagnostics', icon: 'fa-vial', val: currentItem.ehr.diagnosticResults },
                                            { id: 'hp', label: 'H&P', icon: 'fa-notes-medical', val: currentItem.ehr.historyPhysical }
                                        ].map(tab => tab.val && (
                                            <button key={tab.id} onclick={() => setActiveEhrTab(tab.id)} className={`px-3 py-1.5 rounded-t-lg transition flex items-center gap-1.5 ${activeEhrTab === tab.id ? 'bg-white text-ncsbn-blue border-t-2 border-ncsbn-blue font-bold shadow-xs' : 'text-slate-600 hover:bg-slate-300/50'}`}>
                                                <i className={`fa-solid ${tab.icon}`}></i> {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex-1 p-4 overflow-y-auto text-xs md:text-sm text-slate-800 leading-relaxed bg-white" dangerouslySetInnerHTML={{ __html: currentItem.ehr[activeEhrTab === 'notes' ? 'nursesNotes' : (activeEhrTab === 'vitals' ? 'vitalSigns' : (activeEhrTab === 'labs' ? 'diagnosticResults' : 'historyPhysical'))] }}></div>
                                </section>
                            )}

                            {/* RIGHT QUESTION & RATIONALE PANEL */}
                            <section className={`w-full ${currentItem.ehr ? 'md:w-1/2' : 'w-full'} bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-hidden h-full`}>
                                
                                {isSubmitted && (
                                    <div className="bg-emerald-100 border-b border-emerald-200 px-4 py-1.5 text-xs text-emerald-800 font-bold flex items-center justify-between shrink-0">
                                        <span><i className="fa-solid fa-check-circle mr-1 text-emerald-600"></i> Answer Submitted & Evaluated</span>
                                        <span className="font-mono text-emerald-900">Score: {currentSavedState.score}/{currentSavedState.maxScore}</span>
                                    </div>
                                )}

                                <div className="p-6 bg-slate-50/90 border-b border-slate-200 shrink-0 space-y-2">
                                    <h2 className="prompt-typography">{currentItem.cleanTitle}</h2>
                                    <p className="text-xs md:text-sm text-slate-600 italic font-medium">{currentItem.cleanInstruction}</p>
                                </div>

                                {/* QUESTION INTERACTIVE CONTENT */}
                                <div className="flex-1 p-6 overflow-y-auto bg-white text-slate-800 space-y-4">
                                    <QuestionRenderer 
                                        item={currentItem} 
                                        savedState={currentSavedState} 
                                        onSubmit={handleSubmitAnswer}
                                    />
                                </div>

                                {/* RATIONALE CARD */}
                                {isSubmitted && (
                                    <div className="border-t-2 border-blue-600 bg-blue-50/90 p-5 overflow-y-auto max-h-80 text-xs md:text-sm text-slate-800 space-y-4 shadow-inner shrink-0">
                                        <div className="space-y-2">
                                            <div className="font-bold text-ncsbn-navy text-sm flex items-center justify-between border-b border-blue-200 pb-2">
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-microscope text-blue-600"></i> Clinical Pathophysiology Rationale
                                                </span>
                                                <button onclick={() => setActiveVideoModal({ id: currentItem.youtubeId || "r5W1ns5C1ik", title: currentItem.keyPhrase })} className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-xs">
                                                    <i className="fa-brands fa-youtube"></i> Watch Video Lecture
                                                </button>
                                            </div>
                                            <div className="leading-relaxed bg-white p-4 rounded-xl border border-blue-200 shadow-xs">{currentItem.rationale}</div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                            <div className="bg-white p-4 rounded-xl border border-amber-300 shadow-xs space-y-1.5">
                                                <strong className="text-amber-900 font-bold block"><i className="fa-solid fa-lightbulb text-amber-500 mr-1"></i> NCLEX Strategy Rule:</strong>
                                                <span className="text-slate-700 leading-relaxed block">{currentItem.strategyRule || "Prioritize acute physiological risks using ABCs and Maslow's Hierarchy of Needs."}</span>
                                            </div>
                                            <div className="bg-indigo-50/90 p-4 rounded-xl border border-indigo-200 shadow-xs space-y-1.5">
                                                <strong className="text-indigo-950 font-bold block"><i className="fa-solid fa-robot text-indigo-600 mr-1"></i> Nurse AI Tutor Insight:</strong>
                                                <span className="text-slate-800 leading-relaxed block">{currentItem.aiTutorInsight || "Recognize early subtle cues of decompensation."}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </section>
                        </main>
                    )}

                    {/* RESULTS SUMMARY SCREEN */}
                    {showResults && (
                        <div className="flex-1 bg-slate-900 text-white p-6 overflow-y-auto">
                            <div className="max-w-5xl mx-auto space-y-6 py-6">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                        <i className="fa-solid fa-circle-check"></i> Session Completed
                                    </div>
                                    <h1 className="text-3xl font-extrabold">Exam Evaluation & Summary Report</h1>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Overall Score</span>
                                        <div className="text-5xl font-black text-blue-400 my-2">
                                            {Math.round((Object.values(userAnswers).reduce((acc, curr) => acc + (curr.score || 0), 0) / Math.max(1, Object.values(userAnswers).reduce((acc, curr) => acc + (curr.maxScore || 1), 0))) * 100)}%
                                        </div>
                                        <span className="text-xs text-slate-300">Total Points Earned</span>
                                    </div>
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Passing Probability</span>
                                        <div className="text-5xl font-black text-emerald-400 my-2">High</div>
                                        <span className="text-xs text-emerald-400 font-medium">Correlates with exam readiness</span>
                                    </div>
                                </div>
                                <div className="flex justify-center gap-4 pt-4">
                                    <button onclick={() => setShowLaunchModal(true)} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-sm flex items-center gap-2">
                                        <i className="fa-solid fa-rotate-right"></i> Start New Session
                                    </button>
                                    <button onclick={exitToDashboard} className="px-6 py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl text-sm flex items-center gap-2">
                                        <i className="fa-solid fa-house"></i> Return to Dashboard
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER CONTROL BAR */}
                    {!showResults && (
                        <footer className="bg-[#0B2240] text-white px-4 py-3 flex items-center justify-between border-t border-slate-700 shrink-0 select-none z-30">
                            <button onclick={handlePrev} disabled={currentIndex === 0} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition flex items-center gap-1.5 disabled:opacity-40">
                                <i className="fa-solid fa-chevron-left"></i> Previous
                            </button>
                            <button onclick={handleNext} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                                {currentIndex === activePool.length - 1 ? 'Finish Exam' : 'Next'} <i className="fa-solid fa-chevron-right"></i>
                            </button>
                        </footer>
                    )}

                    {/* CALCULATOR MODAL */}
                    {showCalculator && (
                        <div className="absolute top-16 right-6 bg-slate-800 text-white rounded-xl shadow-2xl border border-slate-600 w-64 z-40 overflow-hidden">
                            <div className="bg-slate-900 px-3 py-2 flex items-center justify-between text-xs font-bold border-b border-slate-700">
                                <span><i className="fa-solid fa-calculator text-blue-400 mr-1.5"></i> Calculator</span>
                                <button onclick={() => setShowCalculator(false)}><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            <div className="p-3">
                                <input type="text" readOnly value={calcDisplay} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-right text-xl font-mono text-emerald-400 mb-3 focus:outline-none"/>
                                <div className="grid grid-cols-4 gap-1 text-xs font-semibold">
                                    {['C','+/-','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='].map((btn, idx) => (
                                        <button key={idx} onclick={() => handleCalc(btn)} className={`p-2.5 rounded ${btn === '=' ? 'bg-emerald-600 text-white col-span-1' : (btn === '0' ? 'bg-slate-700 text-white col-span-2' : 'bg-slate-700 hover:bg-slate-600 text-white')}`}>
                                            {btn}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* YOUTUBE VIDEO & NOTES MODAL */}
                    {activeVideoModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden">
                                <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 flex items-center justify-between text-white shrink-0">
                                    <div className="flex items-center gap-2 font-bold text-sm">
                                        <i className="fa-brands fa-youtube text-red-500 text-lg"></i>
                                        <span>Clinical Video Lecture: {activeVideoModal.title}</span>
                                    </div>
                                    <button onclick={() => setActiveVideoModal(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                                    <div className="w-full md:w-2/3 bg-black">
                                        <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${activeVideoModal.id}?autoplay=1`} allow="autoplay; encrypted-media" allowfullscreen></iframe>
                                    </div>
                                    <div className="w-full md:w-1/3 bg-slate-900 p-4 border-l border-slate-700 flex flex-col space-y-3">
                                        <label className="text-xs font-bold text-amber-400 flex items-center gap-1.5"><i className="fa-solid fa-pen-to-square"></i> Clinical Notes & Key Takeaways</label>
                                        <textarea value={videoNotes[currentItem?.id] || ''} onChange={(e) => setVideoNotes(prev => ({ ...prev, [currentItem?.id]: e.target.value }))} className="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-400 focus:outline-none resize-none" placeholder="Type key clinical notes here..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // DYNAMIC QUESTION RENDERER COMPONENT
        function QuestionRenderer({ item, savedState, onSubmit }) {
            const isSubmitted = savedState?.submitted;
            const [selectedSATA, setSelectedSATA] = useState(savedState?.answer || []);
            const [selectedSingle, setSelectedSingle] = useState(savedState?.answer || null);
            const [matrixState, setMatrixState] = useState(savedState?.answer || {});
            const [clozeState, setClozeState] = useState(savedState?.answer || {});
            const [dragOrder, setDragOrder] = useState(savedState?.answer || item.availableItems || []);
            const [bowtieState, setBowtieState] = useState(savedState?.answer || { condition: "", actions: [], monitoring: [] });

            useEffect(() => {
                setSelectedSATA(savedState?.answer || []);
                setSelectedSingle(savedState?.answer || null);
                setMatrixState(savedState?.answer || {});
                setClozeState(savedState?.answer || {});
                setDragOrder(savedState?.answer || item.availableItems || []);
                setBowtieState(savedState?.answer || { condition: "", actions: [], monitoring: [] });
            }, [item, savedState]);

            // Render Single Choice
            if (item.ngnType === "Single Choice" || !item.isNGN) {
                return (
                    <div className="space-y-3">
                        {item.options.map((opt, idx) => {
                            const text = opt.text || opt;
                            const isChecked = selectedSingle === text;
                            const isRight = item.correctAnswer === text;

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight) style = "bg-emerald-100 border-emerald-500 ring-1 ring-emerald-500 font-bold text-emerald-950";
                                else if (isChecked && !isRight) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input type="radio" name="sba" checked={isChecked} disabled={isSubmitted} onChange={() => { setSelectedSingle(text); onSubmit(text); }} className="w-4 h-4 text-blue-600"/>
                                        <span className="text-xs md:text-sm font-medium">{text}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct Answer</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            // Render SATA
            if (item.ngnType === "Extended Multiple Response") {
                const handleToggle = (optId) => {
                    const next = selectedSATA.includes(optId) ? selectedSATA.filter(x => x !== optId) : [...selectedSATA, optId];
                    setSelectedSATA(next);
                    onSubmit(next);
                };
                return (
                    <div className="space-y-3">
                        {item.options.map((opt, idx) => {
                            const optId = opt.id || opt.text || opt;
                            const optText = opt.text || opt;
                            const isChecked = selectedSATA.includes(optId);
                            const isRight = item.correctAnswers.includes(optId);

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight && isChecked) style = "bg-emerald-100 border-emerald-500 ring-1 ring-emerald-500 font-bold text-emerald-950";
                                else if (isRight && !isChecked) style = "bg-emerald-50 border-emerald-400 font-semibold text-emerald-900";
                                else if (!isRight && isChecked) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => handleToggle(optId)} className="w-4 h-4 text-blue-600 rounded"/>
                                        <span className="text-xs md:text-sm font-medium">{optText}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            // Render Matrix Grid
            if (item.ngnType === "Matrix / Grid") {
                const handleMatrixChange = (rowId, colVal) => {
                    const next = { ...matrixState, [rowId]: colVal };
                    setMatrixState(next);
                    onSubmit(next);
                };
                return (
                    <table className="w-full border-collapse border border-slate-300 text-xs md:text-sm">
                        <thead className="bg-slate-100 border-b border-slate-300">
                            <tr>
                                <th className="p-3 text-left font-bold text-slate-700">Clinical Finding / Intervention</th>
                                {item.columns.map((col, idx) => <th key={idx} className="p-3 text-center font-bold text-slate-700 w-32">{col}</th>)}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 bg-white">
                            {item.rows.map(row => {
                                const rightCol = item.correctAnswers[row.id];
                                const userCol = matrixState[row.id];
                                return (
                                    <tr key={row.id}>
                                        <td className="p-3 font-medium text-slate-800">{row.text}</td>
                                        {item.columns.map((col, cIdx) => {
                                            const isChecked = userCol === col;
                                            const isRight = rightCol === col;
                                            let bgCell = isSubmitted ? (isRight ? "bg-emerald-100 font-bold" : (isChecked ? "bg-rose-100" : "")) : "";
                                            return (
                                                <td key={cIdx} className={`p-3 text-center ${bgCell}`}>
                                                    <input type="radio" name={`mat_${row.id}`} checked={isChecked} disabled={isSubmitted} onChange={() => handleMatrixChange(row.id, col)} className="w-4 h-4 text-blue-600"/>
                                                    {isSubmitted && isRight && <span className="block text-[10px] text-emerald-800 font-extrabold mt-0.5"><i className="fa-solid fa-check"></i> Correct</span>}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                );
            }

            return <div className="text-slate-500 text-sm">Interactive NGN Item Loaded.</div>;
        }

        // MOUNT APP
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
