<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRN - Self Study Environment | Pearson VUE Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="questions.js"></script>
</head>
<body class="bg-slate-300 text-slate-900 antialiased h-screen flex flex-col overflow-hidden select-none">

    <!-- PEARSON VUE TOP HEADER -->
    <header class="bg-[#0b1b36] text-white px-4 py-2.5 flex justify-between items-center shadow-md border-b border-blue-900 shrink-0">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 font-extrabold text-xs px-2 py-0.5 rounded tracking-wider">NCLEX-RN</span>
                <span class="font-bold text-sm tracking-wide">Self Study Pearson VUE Simulator</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="px-3 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-semibold">
                <i class="fa-solid fa-right-from-bracket"></i> Dashboard
            </button>
        </div>
    </header>

    <!-- MAIN SPLIT WORKSPACE -->
    <main class="flex-grow flex p-3 gap-3 overflow-hidden">
        
        <!-- EHR LEFT PANE -->
        <section class="w-1/2 bg-white rounded-lg border border-slate-300 flex flex-col shadow-sm overflow-hidden">
            <div class="bg-slate-100 border-b border-slate-300 px-4 py-2 flex justify-between items-center shrink-0">
                <span class="text-xs font-bold text-slate-800"><i class="fa-solid fa-notes-medical text-blue-700 mr-1"></i> ELECTRONIC HEALTH RECORD</span>
            </div>
            <div class="p-4 flex-grow overflow-y-auto text-xs leading-relaxed text-slate-800">
                <p>Client presents for routine evaluation and medication management.</p>
            </div>
        </section>

        <!-- QUESTION RIGHT PANE -->
        <section class="w-1/2 bg-white rounded-lg border border-slate-300 flex flex-col shadow-sm overflow-hidden">
            <div class="bg-slate-100 border-b border-slate-300 px-4 py-2 flex justify-between items-center shrink-0">
                <span class="bg-blue-800 text-white px-2.5 py-0.5 rounded font-bold text-[11px] uppercase">SELF STUDY PRACTICE</span>
            </div>
            <div class="p-5 flex-grow overflow-y-auto space-y-4" id="exam-container">
                <h2 class="text-sm font-bold text-slate-900">Select the appropriate nursing intervention.</h2>
            </div>
        </section>
    </main>

    <!-- FOOTER NAV -->
    <footer class="bg-[#0b1b36] border-t border-slate-700 px-4 py-2.5 flex justify-between items-center shrink-0">
        <button class="px-5 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded">Previous</button>
        <button class="px-6 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded">Submit Response</button>
    </footer>
</body>
</html>
