name: QuickRN free question-bank integrity bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # A workflow/worker update starts an immediate validation run. Bot commits to
  # question-bank files do not match these paths, so this cannot self-trigger.
  push:
    branches: [main]
    paths:
      - ".github/workflows/quickrn-ai-question-remediation.yml"
      - "scripts/ai-remediate-quarantine-batch.js"

concurrency:
  group: quickrn-ai-question-remediation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preflight effective question-bank coverage
        run: node scripts/ai-remediate-quarantine-batch.js --dry-run
      - name: Run free offline integrity audit and safe metadata cleanup
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ai-remediate-quarantine-batch.js
      - name: Commit audit results and safe fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "quickrn-remediation-bot"
          git config user.email "quickrn-remediation-bot@users.noreply.github.com"
          git add questions.js questions-bank-*.js reports/ai-remediation/
          git commit -m "AI remediation: webmaster review batch"
          git push origin HEAD:main
