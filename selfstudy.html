<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCLEX-RN Next Generation & Traditional Test Environment</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncsbn: {
                            navy: '#0B2240',
                            blue: '#005A9C',
                            lightBg: '#F1F5F9',
                            header: '#001E36',
                            border: '#CBD5E1',
                            accent: '#D97706'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; -webkit-user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .prompt-typography { 
            font-size: 1.25rem; 
            line-height: 1.6; 
            color: #0f172a; 
            font-weight: 700; 
            letter-spacing: -0.01em;
        }
        @media (max-width: 768px) {
            .prompt-typography { font-size: 1.1rem; line-height: 1.45; }
        }
    </style>

    <!-- External questions file -->
    <script src="questions.js" onerror="console.log('questions.js not found, fallback bank active.')"></script>
</head>
<body class="h-full bg-slate-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // FALLBACK Q-BANK IN CASE QUESTIONS.JS IS MISSING
        const fallbackQBank = [
            {
                id: "NGN-CS-001",
                isNGN: true,
                ngnType: "Matrix / Grid",
                category: "Cardiovascular & Hemodynamic Stability",
                keyPhrase: "Acute Decompensated Heart Failure Pulmonary Edema Management",
                title: "Acute Decompensated Heart Failure Clinical Intervention Evaluation",
                promptTitle: "Clinical Intervention Evaluation",
                instruction: "For each client finding or intervention below, specify whether the action is Indicated, Nonessential, or Contraindicated for a client in acute decompensated heart failure.",
                patientInfo: { name: "Johnson, Robert", age: "67-year-old male", code: "MRN-90218" },
                ehr: {
                    nursesNotes: "<strong>10:00 AM:</strong> Client admitted with severe orthopnea requiring 3 pillows. Dyspneic at rest. Bilateral coarse crackles audible throughout lower and middle lung zones. +3 pitting edema in lower extremities.",
                    vitalSigns: "BP: 168/94 mmHg | HR: 112 bpm | RR: 28 bpm | SpO2: 87% on Room Air | Weight: 94 kg (+4 kg in 3 days)",
                    diagnosticResults: "BNP: 1,450 pg/mL (Elevated) | K+: 4.8 mEq/L | Chest X-Ray: Bilateral pulmonary congestion and cardiomegaly.",
                    historyPhysical: "History of hypertension, CAD, and HFrEF (Ejection Fraction 30%). Home Meds: Lisinopril 20mg, Carvedilol 12.5mg, Furosemide 40mg."
                },
                rows: [
                    { id: "r1", text: "Administer Furosemide 80mg IV push as prescribed" },
                    { id: "r2", text: "Apply high-flow supplemental oxygen therapy" },
                    { id: "r3", text: "Place client in flat supine position with legs elevated" },
                    { id: "r4", text: "Obtain daily weights every morning at 0700" },
                    { id: "r5", text: "Encourage immediate oral fluid intake of 1,000 mL water" }
                ],
                columns: ["Indicated", "Nonessential", "Contraindicated"],
                correctAnswers: { "r1": "Indicated", "r2": "Indicated", "r3": "Contraindicated", "r4": "Indicated", "r5": "Contraindicated" },
                rationale: "Acute decompensated heart failure with acute pulmonary edema requires aggressive diuresis (IV Furosemide) to reduce preload and fluid volume overload, combined with oxygen therapy to treat hypoxemia and continuous daily weight monitoring.",
                learningObjectives: "Evaluate clinical findings of volume overload, prioritize immediate loop diuretic administration and position management.",
                strategyRule: "Prioritize Airway and Fluid Reductions (ABCs). Placing heart failure clients in High-Fowler's position reduces venous return.",
                aiTutorInsight: "Recognize acute pulmonary edema cues: crackles, tachypnea, low SpO2, and BNP > 400. Immediate IV diuretics are priority.",
                videos: [
                    { title: "Pathophysiology & Nursing Care of Acute Heart Failure", id: "r5W1ns5C1ik", provider: "RegisteredNurseRN" },
                    { title: "NCLEX High-Yield Board Review: Heart Failure & Diuretics", id: "0IqA11A1WnE", provider: "NCLEX High Yield" }
                ]
            }
        ];

        // UTILITY FUNCTIONS
        function cleanQuestionText(text) {
            if (!text) return '';
            let cleaned = text.replace(/\[.*?\]\s*/g, '').trim();
            const parts = cleaned.split(':');
            if (parts.length > 2) {
                cleaned = parts.slice(-2).join(':').trim();
            }
            const sentences = cleaned.split(/(?<=[.?!])\s+/);
            const unique = [];
            sentences.forEach(s => {
                const t = s.trim();
                if (t && !unique.includes(t)) unique.push(t);
            });
            return unique.join(' ');
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function detectNGNType(q) {
            const rawType = (q.ngnType || q.type || q.format || q.questionType || q.itemType || "").toString().toLowerCase();

            if (rawType.includes("matrix") || rawType.includes("grid") || (q.rows && q.columns) || q.matrixData) {
                return "Matrix / Grid";
            }
            if (rawType.includes("cloze") || rawType.includes("drop") || q.clozeTemplate || q.dropdowns || (q.options && !Array.isArray(q.options) && typeof q.options === 'object')) {
                return "Cloze (Drop-down)";
            }
            if (rawType.includes("drag") || rawType.includes("order") || q.availableItems || q.correctOrder) {
                return "Extended Drag and Drop";
            }
            if (rawType.includes("bowtie") || q.bowtieData) {
                return "Bowtie";
            }
            if (
                rawType.includes("sata") || 
                rawType.includes("multiple response") || 
                rawType.includes("select all") || 
                Array.isArray(q.correctAnswers) || 
                (Array.isArray(q.correctAnswer) && q.correctAnswer.length > 1) ||
                (Array.isArray(q.options) && q.options.length > 0 && typeof q.options[0] === 'object' && q.options[0].id)
            ) {
                return "Extended Multiple Response";
            }
            
            return "Single Choice";
        }

        // MAIN APP COMPONENT
        function App() {
            const [showLaunchModal, setShowLaunchModal] = useState(true);
            const [activePool, setActivePool] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [currentDraftAnswer, setCurrentDraftAnswer] = useState({});
            const [flaggedItems, setFlaggedItems] = useState(new Set());
            const [showCalculator, setShowCalculator] = useState(false);
            const [calcDisplay, setCalcDisplay] = useState("0");
            const [activeEhrTab, setActiveEhrTab] = useState("notes");
            const [showResults, setShowResults] = useState(false);
            const [activeVideoModal, setActiveVideoModal] = useState(null);
            const [showReportModal, setShowReportModal] = useState(false);
            const [videoNotes, setVideoNotes] = useState({});
            const [isRationaleCollapsed, setIsRationaleCollapsed] = useState(false);

            // Launch Session pulling from questions.js
            const launchSession = (count) => {
                let rawPool = fallbackQBank;
                if (typeof window.questions !== 'undefined' && Array.isArray(window.questions) && window.questions.length > 0) {
                    rawPool = window.questions;
                } else if (typeof embeddedQuestionsData !== 'undefined' && Array.isArray(embeddedQuestionsData) && embeddedQuestionsData.length > 0) {
                    rawPool = embeddedQuestionsData;
                }

                const normalized = rawPool.map((q, idx) => {
                    const detectedType = detectNGNType(q);
                    const isNGNItem = q.isNGN || detectedType !== "Single Choice";
                    return {
                        ...q,
                        id: q.id || `Q-${idx + 1}`,
                        isNGN: isNGNItem,
                        cleanTitle: cleanQuestionText(q.title || q.promptTitle || q.question || `NCLEX Item ${idx + 1}`),
                        cleanInstruction: cleanQuestionText(q.instruction || q.question || "Evaluate clinical findings and select the appropriate action(s)."),
                        ngnType: detectedType,
                        keyPhrase: q.keyPhrase || q.category || q.topic || "Clinical Nursing Concept"
                    };
                });

                // Load previously answered question IDs to avoid repeats
                let usedIds = JSON.parse(localStorage.getItem('quickrn_used_q_ids') || '[]');
                let available = normalized.filter(q => !usedIds.includes(q.id));

                if (available.length < 5) {
                    alert("You have exhausted all available questions in questions.js! Resetting history for a fresh attempt.");
                    localStorage.removeItem('quickrn_used_q_ids');
                    usedIds = [];
                    available = normalized;
                }

                const ngnItems = available.filter(q => q.isNGN);
                const tradItems = available.filter(q => !q.isNGN);

                let selected = [];
                const targetCount = (count === 'all' || count >= available.length) ? available.length : count;

                if (count === 'all') {
                    selected = shuffleArray(available);
                } else {
                    const minNGN = Math.min(ngnItems.length, Math.ceil(targetCount * 0.35));
                    const selectedNGN = shuffleArray(ngnItems).slice(0, minNGN);
                    const remainingNeeded = targetCount - selectedNGN.length;

                    const remainingPool = [...tradItems, ...ngnItems.filter(q => !selectedNGN.includes(q))];
                    const selectedOther = shuffleArray(remainingPool).slice(0, remainingNeeded);

                    selected = shuffleArray([...selectedNGN, ...selectedOther]);
                }

                setActivePool(selected);
                setCurrentIndex(0);
                setUserAnswers({});
                setCurrentDraftAnswer({});
                setShowLaunchModal(false);
                setShowResults(false);
            };

            const currentItem = activePool[currentIndex];
            const currentSavedState = userAnswers[currentIndex];
            const isSubmitted = currentSavedState?.submitted;

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const handleNext = () => {
                if (currentIndex < activePool.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    finishExam();
                }
            };

            // Exit buttons navigate directly to dashboard.html
            const exitToDashboard = () => {
                if (confirm("Exit session and return to dashboard?")) {
                    window.location.href = "dashboard.html";
                }
            };

            const toggleBookmark = (id) => {
                setFlaggedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const evaluateScore = (item, ans) => {
                if (!ans) return { earned: 0, max: 1 };
                switch (item.ngnType) {
                    case "Matrix / Grid": {
                        let earned = 0, max = (item.rows || []).length;
                        (item.rows || []).forEach(r => { if (ans[r.id] === (item.correctAnswers || {})[r.id]) earned++; });
                        return { earned, max: max || 1 };
                    }
                    case "Cloze (Drop-down)": {
                        const correctKeys = Object.keys(item.correctAnswers || {});
                        let earned = 0, max = correctKeys.length;
                        correctKeys.forEach(k => { if (ans[k] === item.correctAnswers[k]) earned++; });
                        return { earned, max: max || 1 };
                    }
                    case "Extended Drag and Drop": {
                        const correctSeq = item.correctOrder || [];
                        let earned = 0, max = correctSeq.length;
                        (ans || []).forEach((v, idx) => { if (v === correctSeq[idx]) earned++; });
                        return { earned, max: max || 1 };
                    }
                    case "Extended Multiple Response": {
                        let correctCount = 0, incorrectCount = 0;
                        const correctArray = item.correctAnswers || item.correctAnswer || [];
                        const correctSet = new Set(Array.isArray(correctArray) ? correctArray : [correctArray]);
                        (ans || []).forEach(id => {
                            if (correctSet.has(id)) correctCount++;
                            else incorrectCount++;
                        });
                        return { earned: Math.max(0, correctCount - incorrectCount), max: correctSet.size || 1 };
                    }
                    case "Bowtie": {
                        let earned = 0;
                        const correctObj = item.correctAnswers || {};
                        if (ans.condition === correctObj.condition) earned++;
                        (ans.actions || []).forEach(a => { if ((correctObj.actions || []).includes(a)) earned++; });
                        (ans.monitoring || []).forEach(m => { if ((correctObj.monitoring || []).includes(m)) earned++; });
                        return { earned, max: 5 };
                    }
                    default: {
                        const targetKey = item.correctAnswer || item.correctAnswerText;
                        return { earned: (ans === targetKey || ans === item.correctAnswer) ? 1 : 0, max: 1 };
                    }
                }
            };

            const handleSubmitAnswer = () => {
                const draft = currentDraftAnswer[currentIndex];
                if (!draft) {
                    alert("Please select or enter an answer before submitting.");
                    return;
                }

                const scoreRes = evaluateScore(currentItem, draft);
                const isCorrect = scoreRes.earned === scoreRes.max;

                setUserAnswers(prev => ({
                    ...prev,
                    [currentIndex]: {
                        answer: draft,
                        submitted: true,
                        score: scoreRes.earned,
                        maxScore: scoreRes.max,
                        isCorrect
                    }
                }));

                let usedIds = JSON.parse(localStorage.getItem('quickrn_used_q_ids') || '[]');
                if (!usedIds.includes(currentItem.id)) {
                    usedIds.push(currentItem.id);
                    localStorage.setItem('quickrn_used_q_ids', JSON.stringify(usedIds));
                }
            };

            const finishExam = () => {
                setShowResults(true);
            };

            const handleCalc = (val) => {
                if (val === 'C') setCalcDisplay('0');
                else if (val === '=') {
                    try { setCalcDisplay(eval(calcDisplay.replace(/%/g, '/100')).toString()); }
                    catch { setCalcDisplay('Error'); }
                } else {
                    setCalcDisplay(prev => prev === '0' || prev === 'Error' ? val : prev + val);
                }
            };

            const summaryStats = useMemo(() => {
                let totalEarned = 0;
                let totalMax = 0;
                activePool.forEach((q, idx) => {
                    const ansState = userAnswers[idx];
                    if (ansState && ansState.submitted) {
                        totalEarned += ansState.score || 0;
                        totalMax += ansState.maxScore || 1;
                    } else {
                        const defaultMax = q.rows ? q.rows.length : (q.correctOrder ? q.correctOrder.length : 1);
                        totalMax += defaultMax;
                    }
                });
                const percentage = totalMax > 0 ? Math.round((totalEarned / totalMax) * 100) : 0;
                const passed = percentage >= 75;
                return { totalEarned, totalMax, percentage, passed };
            }, [activePool, userAnswers]);

            const sortedQuestionsForReview = useMemo(() => {
                return activePool.map((q, idx) => ({
                    question: q,
                    index: idx,
                    savedState: userAnswers[idx]
                })).sort((a, b) => {
                    const aCorrect = a.savedState?.isCorrect ? 1 : 0;
                    const bCorrect = b.savedState?.isCorrect ? 1 : 0;
                    return aCorrect - bCorrect;
                });
            }, [activePool, userAnswers]);

            return (
                <div className="flex flex-col h-full w-full select-none">
                    
                    {/* LAUNCH / ITEM COUNT SELECTION MODAL */}
                    {showLaunchModal && (
                        <div className="fixed inset-0 bg-slate-900/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 md:p-8 space-y-6 text-center border border-slate-300 relative">
                                <button onClick={exitToDashboard} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                                <div className="w-16 h-16 bg-blue-50 text-ncsbn-blue rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                                    <i className="fa-solid fa-user-nurse"></i>
                                </div>
                                <div className="space-y-2">
                                    <h1 className="text-2xl font-black text-slate-900">QuickRN Self Study Mode</h1>
                                    <p className="text-xs md:text-sm text-slate-600">Select the number of questions to load from questions.js. Includes Matrix Grids, Cloze, Drag & Drop, Bowtie, SATA, and Single Choice.</p>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {[20, 60, 85, 150].map(cnt => (
                                        <button key={cnt} onClick={() => launchSession(cnt)} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center">
                                            <span className="text-xl font-black text-ncsbn-blue">{cnt}</span>
                                            <span className="text-[11px] text-slate-500 font-normal">Questions</span>
                                        </button>
                                    ))}
                                    <button onClick={() => launchSession('all')} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center col-span-2 sm:col-span-1">
                                        <span className="text-xl font-black text-amber-600">ALL</span>
                                        <span className="text-[11px] text-slate-500 font-normal">Full Q-Bank</span>
                                    </button>
                                </div>
                                <button onClick={exitToDashboard} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                                    Exit Simulator
                                </button>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION HEADER */}
                    <header className="bg-[#0B2240] text-white h-14 px-4 flex items-center justify-between border-b-2 border-amber-600 shadow-md shrink-0 z-30">
                        {/* QuickRN does nothing on click */}
                        <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 text-slate-100 rounded-lg text-xs font-bold border border-slate-600 cursor-default">
                            <i className="fa-solid fa-user-nurse text-amber-400"></i>
                            <span>QuickRN Self Study Mode</span>
                        </div>

                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-slate-800 px-3 py-1 rounded border border-slate-600 text-xs text-slate-200 font-mono">
                                Item <span className="font-bold text-amber-400">{currentIndex + 1}</span> of <span className="font-bold text-white">{activePool.length}</span>
                            </div>
                            <button onClick={() => setShowCalculator(!showCalculator)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className="fa-solid fa-calculator text-blue-400"></i>
                                <span className="hidden md:inline">Calculator</span>
                            </button>
                            <button onClick={() => currentItem && toggleBookmark(currentItem.id)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className={`fa-solid fa-bookmark ${currentItem && flaggedItems.has(currentItem.id) ? 'text-amber-400' : 'text-slate-400'}`}></i>
                                <span className="hidden md:inline">Bookmark</span>
                            </button>
                            <button onClick={() => setShowReportModal(true)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className="fa-solid fa-flag text-rose-400"></i>
                                <span className="hidden md:inline">Report Item</span>
                            </button>
                            <button onClick={exitToDashboard} className="px-3 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
                                <i className="fa-solid fa-right-from-bracket"></i>
                                <span>Exit</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN TEST WORKSPACE */}
                    {!showResults && currentItem && (
                        <main className="flex-1 flex flex-col md:flex-row overflow-hidden p-2 gap-2 relative">
                            
                            {currentItem.ehr && (
                                <section className="w-full md:w-1/2 bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-hidden h-1/2 md:h-full">
                                    <div className="bg-slate-100 border-b border-slate-300 px-4 py-2 flex items-center justify-between shrink-0 text-xs md:text-sm font-bold text-slate-800">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-hospital-user text-ncsbn-blue"></i>
                                            <span>ELECTRONIC HEALTH RECORD (EHR)</span>
                                        </div>
                                        <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-mono font-semibold text-xs">
                                            Pt: {currentItem.patientInfo?.name || "Standard Client"}
                                        </span>
                                    </div>
                                    <div className="bg-slate-200/70 px-2 pt-2 border-b border-slate-300 flex gap-1 text-xs font-semibold text-slate-600 shrink-0">
                                        {[
                                            { id: 'notes', label: "Nurses' Notes", icon: 'fa-user-nurse', val: currentItem.ehr.nursesNotes },
                                            { id: 'vitals', label: 'Vital Signs', icon: 'fa-heart-pulse', val: currentItem.ehr.vitalSigns },
                                            { id: 'labs', label: 'Diagnostics', icon: 'fa-vial', val: currentItem.ehr.diagnosticResults },
                                            { id: 'hp', label: 'H&P', icon: 'fa-notes-medical', val: currentItem.ehr.historyPhysical }
                                        ].map(tab => tab.val && (
                                            <button key={tab.id} onClick={() => setActiveEhrTab(tab.id)} className={`px-3 py-1.5 rounded-t-lg transition flex items-center gap-1.5 ${activeEhrTab === tab.id ? 'bg-white text-ncsbn-blue border-t-2 border-ncsbn-blue font-bold shadow-xs' : 'text-slate-600 hover:bg-slate-300/50'}`}>
                                                <i className={`fa-solid ${tab.icon}`}></i> {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex-1 p-4 overflow-y-auto text-xs md:text-sm text-slate-800 leading-relaxed bg-white" dangerouslySetInnerHTML={{ __html: currentItem.ehr[activeEhrTab === 'notes' ? 'nursesNotes' : (activeEhrTab === 'vitals' ? 'vitalSigns' : (activeEhrTab === 'labs' ? 'diagnosticResults' : 'historyPhysical'))] }}></div>
                                </section>
                            )}

                            <section className={`w-full ${currentItem.ehr ? 'md:w-1/2' : 'w-full'} bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-hidden h-full`}>
                                
                                {isSubmitted && (
                                    <div className="bg-emerald-100 border-b border-emerald-200 px-4 py-1.5 text-xs text-emerald-800 font-bold flex items-center justify-between shrink-0">
                                        <span><i className="fa-solid fa-check-circle mr-1 text-emerald-600"></i> Answer Evaluated</span>
                                        <span className="font-mono text-emerald-900">Score: {currentSavedState.score}/{currentSavedState.maxScore}</span>
                                    </div>
                                )}

                                <div className="p-4 md:p-6 bg-slate-50/90 border-b border-slate-200 shrink-0 space-y-2">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-black uppercase tracking-wider text-ncsbn-blue bg-blue-100/80 px-2 py-0.5 rounded">
                                            {currentItem.ngnType}
                                        </span>
                                    </div>
                                    <h2 className="prompt-typography">{currentItem.cleanTitle}</h2>
                                    <p className="text-xs md:text-sm text-slate-600 italic font-medium">{currentItem.cleanInstruction}</p>
                                </div>

        function DualVideoModal({ data, currentItem, notes, onUpdateNotes, onClose }) {
            const videoList = data.videos || [
                { title: `Video Lecture 1: ${data.title}`, id: data.id || "r5W1ns5C1ik", provider: "RegisteredNurseRN" },
                { title: `Video Lecture 2: High Yield ${data.title}`, id: "0IqA11A1WnE", provider: "NCLEX High Yield" }
            ];
            const [selectedVid, setSelectedVid] = useState(videoList[0]);

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden">
                        <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 flex items-center justify-between text-white shrink-0">

                        <div className="bg-slate-900/80 px-4 py-2 border-b border-slate-700 flex gap-2 shrink-0">
                            {videoList.slice(0, 2).map((vid, idx) => (
                                <button key={idx} onClick={() => setSelectedVid(vid)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 ${selectedVid.id === vid.id ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                    <i className="fa-solid fa-play"></i> Option {idx + 1}: {vid.provider || 'Lecture'}
                                </button>
                            ))}

                        <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                            <div className="w-full md:w-2/3 bg-black">
                                <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${selectedVid.id}?autoplay=1`} allow="autoplay; encrypted-media" allowFullScreen></iframe>
                            </div>
                            <div className="w-full md:w-1/3 bg-slate-900 p-4 border-l border-slate-700 flex flex-col space-y-3">

                                <textarea value={notes[currentItem?.id] || ''} onChange={(e) => onUpdateNotes(e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-400 focus:outline-none resize-none" placeholder="Record key notes here..."></textarea>

        function ReportQuestionModal({ item, onClose }) {
            const [reportReason, setReportReason] = useState("Typos / Grammatical Error");
            const [details, setDetails] = useState("");
            const [submitted, setSubmitted] = useState(false);

            const handleSendReport = (e) => {
                e.preventDefault();
                const newReport = {
                    id: `REP-${Date.now()}`,
                    itemId: item?.id || "Q-Unknown",
                    itemTitle: item?.cleanTitle || "Question",
                    reason: reportReason,
                    details: details,
                    timestamp: new Date().toISOString()
                };

                let existing = JSON.parse(localStorage.getItem('quickrn_question_reports') || '[]');
                existing.push(newReport);
                localStorage.setItem('quickrn_question_reports', JSON.stringify(existing));

                setSubmitted(true);
                setTimeout(() => {
                    onClose();
                }, 1200);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 text-slate-800">
                        <div className="flex items-center justify-between border-b pb-3">
                            <h3 className="font-bold text-slate-900 flex items-center gap-2">
                                <i className="fa-solid fa-flag text-rose-600"></i> Report Question Problem
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        {submitted ? (
                            <div className="py-8 text-center space-y-2">
                                <i className="fa-solid fa-circle-check text-4xl text-emerald-500"></i>
                                <p className="font-bold text-sm text-slate-800">Report Logged Successfully!</p>
                            </div>
                        ) : (
                            <form onSubmit={handleSendReport} className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-700">Problem Category</label>
                                    <select value={reportReason} onChange={(e) => setReportReason(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 focus:outline-none">
                                        <option>Typos / Grammatical Error</option>
                                        <option>Incorrect Answer Key</option>
                                        <option>Unclear Clinical Rationale</option>
                                        <option>Formatting / Display Issue</option>
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-700">Description of Issue</label>
                                    <textarea required value={details} onChange={(e) => setDetails(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-xs h-24 focus:outline-none" placeholder="Provide details..."></textarea>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold text-slate-600">Cancel</button>
                                    <button type="submit" className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold">Submit Report</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function QuestionRenderer({ item, draftAnswer, savedState, onUpdateDraft }) {
            const isSubmitted = savedState?.submitted;

            if (item.ngnType === "Single Choice" || !item.isNGN) {
                const optionsList = item.options || [];
                return (
                    <div className="space-y-3">
                        {optionsList.map((opt, idx) => {
                            const text = opt.text || opt;
                            const isChecked = draftAnswer === text || draftAnswer === String.fromCharCode(65 + idx);
                            const correctTarget = item.correctAnswerText || item.correctAnswer;
                            const isRight = correctTarget === text || item.correctAnswer === String.fromCharCode(65 + idx);

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight) style = "bg-emerald-100 border-emerald-500 font-bold text-emerald-950";
                                else if (isChecked && !isRight) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input type="radio" name="sba" checked={isChecked} disabled={isSubmitted} onChange={() => onUpdateDraft(text)} className="w-4 h-4 text-blue-600"/>
                                        <span className="text-xs md:text-sm font-medium">{text}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            if (item.ngnType === "Extended Multiple Response") {
                const currentSATA = Array.isArray(draftAnswer) ? draftAnswer : [];
                const optionsList = item.options || [];
                const correctList = item.correctAnswers || item.correctAnswer || [];
                const correctSet = new Set(Array.isArray(correctList) ? correctList : [correctList]);

                const handleToggle = (optId) => {
                    const next = currentSATA.includes(optId) ? currentSATA.filter(x => x !== optId) : [...currentSATA, optId];
                    onUpdateDraft(next);
                };

                return (
                    <div className="space-y-3">
                        {optionsList.map((opt, idx) => {
                            const optId = opt.id || opt.text || opt;
                            const optText = opt.text || opt;
                            const isChecked = currentSATA.includes(optId);
                            const isRight = correctSet.has(optId);

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight && isChecked) style = "bg-emerald-100 border-emerald-500 font-bold text-emerald-950";
                                else if (isRight && !isChecked) style = "bg-emerald-50 border-emerald-400 font-semibold text-emerald-900";
                                else if (!isRight && isChecked) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => handleToggle(optId)} className="w-4 h-4 text-blue-600 rounded"/>
                                        <span className="text-xs md:text-sm font-medium">{optText}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            if (item.ngnType === "Cloze (Drop-down)") {
                const draftObj = draftAnswer || {};
                const template = item.clozeTemplate || item.template || "";
                const optionsObj = item.options || {};
                const parts = template.split(/(\{.*?\})/g);

                const handleSelectChange = (key, val) => {
                    onUpdateDraft({ ...draftObj, [key]: val });
                };

                return (
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 leading-relaxed text-sm md:text-base space-y-4">
                        <div className="font-medium text-slate-800">
                            {parts.map((part, pIdx) => {
                                if (part.startsWith('{') && part.endsWith('}')) {
                                    const key = part.slice(1, -1).trim();
                                    const choices = optionsObj[key] || [];
                                    const userVal = draftObj[key] || "";
                                    const rightVal = (item.correctAnswers || {})[key];

                                    let borderStyle = "border-slate-300 bg-white";
                                    if (isSubmitted) {
                                        borderStyle = userVal === rightVal ? "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold" : "border-rose-500 bg-rose-50 text-rose-900 font-bold";
                                    }

                                    return (
                                        <span key={pIdx} className="inline-block mx-1">
                                            <select 
                                                value={userVal} 
                                                disabled={isSubmitted} 
                                                onChange={(e) => handleSelectChange(key, e.target.value)}
                                                className={`px-3 py-1 rounded-lg border text-xs md:text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 ${borderStyle}`}
                                            >
                                                <option value="">-- Select Option --</option>
                                                {choices.map((cOpt, cIdx) => (
                                                    <option key={cIdx} value={cOpt}>{cOpt}</option>
                                                ))}
                                            </select>
                                        </span>
                                    );
                                }
                                return <span key={pIdx}>{part}</span>;
                            })}
                        </div>
                    </div>
                );
            }

            if (item.ngnType === "Extended Drag and Drop") {
                const currentOrder = draftAnswer || item.availableItems || [];
                const correctOrder = item.correctOrder || [];

                const moveItem = (fromIdx, toIdx) => {
                    if (isSubmitted) return;
                    const updated = [...currentOrder];
                    const [moved] = updated.splice(fromIdx, 1);
                    updated.splice(toIdx, 0, moved);
                    onUpdateDraft(updated);
                };

                return (
                    <div className="space-y-3">
                        <p className="text-xs text-slate-500 font-bold uppercase tracking-wider">Reorder items into correct priority (Step 1 to Step {currentOrder.length}):</p>
                        {currentOrder.map((stepText, idx) => {
                            const isRight = correctOrder[idx] === stepText;
                            let cardStyle = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                cardStyle = isRight ? "bg-emerald-100 border-emerald-500 text-emerald-950 font-bold" : "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                            }

                            return (
                                <div key={idx} className={`p-3.5 rounded-xl border flex items-center justify-between transition ${cardStyle}`}>
                                    <div className="flex items-center gap-3">
                                        <span className="w-6 h-6 rounded-full bg-slate-800 text-white font-mono text-xs flex items-center justify-center shrink-0">
                                            {idx + 1}
                                        </span>
                                        <span className="text-xs md:text-sm font-medium">{stepText}</span>
                                    </div>
                                    {!isSubmitted && (
                                        <div className="flex items-center gap-1 shrink-0">
                                            <button disabled={idx === 0} onClick={() => moveItem(idx, idx - 1)} className="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs text-slate-700 disabled:opacity-30">
                                                <i className="fa-solid fa-arrow-up"></i>
                                            </button>
                                            <button disabled={idx === currentOrder.length - 1} onClick={() => moveItem(idx, idx + 1)} className="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs text-slate-700 disabled:opacity-30">
                                                <i className="fa-solid fa-arrow-down"></i>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                );
            }

            if (item.ngnType === "Bowtie") {
                const bowtieData = item.bowtieData || {};
                const currentDraft = draftAnswer || { condition: "", actions: [], monitoring: [] };
                const correctObj = item.correctAnswers || {};

                const setCondition = (val) => onUpdateDraft({ ...currentDraft, condition: val });

                const toggleAction = (act) => {
                    const current = currentDraft.actions || [];
                    const next = current.includes(act) ? current.filter(x => x !== act) : [...current, act].slice(0, 2);
                    onUpdateDraft({ ...currentDraft, actions: next });
                };

                const toggleMonitoring = (mon) => {
                    const current = currentDraft.monitoring || [];
                    const next = current.includes(mon) ? current.filter(x => x !== mon) : [...current, mon].slice(0, 2);
                    onUpdateDraft({ ...currentDraft, monitoring: next });
                };

                return (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs md:text-sm">
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                            <h3 className="font-bold text-ncsbn-blue uppercase tracking-wider text-center border-b pb-2">Actions to Take (Select 2)</h3>
                            {(bowtieData.actions || []).map((act, idx) => {
                                const isChecked = (currentDraft.actions || []).includes(act);
                                const isRight = (correctObj.actions || []).includes(act);
                                let itemStyle = isChecked ? "bg-blue-100 border-blue-500 font-semibold" : "bg-white border-slate-200";
                                if (isSubmitted) {
                                    if (isRight) itemStyle = "bg-emerald-100 border-emerald-500 font-bold text-emerald-950";
                                    else if (isChecked && !isRight) itemStyle = "bg-rose-100 border-rose-400 text-rose-950";
                                }
                                return (
                                    <label key={idx} className={`p-2.5 rounded-lg border flex items-center gap-2 cursor-pointer transition ${itemStyle}`}>
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => toggleAction(act)} className="w-4 h-4 text-blue-600 rounded"/>
                                        <span>{act}</span>
                                    </label>
                                );
                            })}
                        </div>

                        <div className="bg-blue-50/50 p-3 rounded-xl border-2 border-ncsbn-blue space-y-2">
                            <h3 className="font-bold text-ncsbn-navy uppercase tracking-wider text-center border-b border-blue-200 pb-2">Potential Condition</h3>
                            {(bowtieData.conditions || []).map((cond, idx) => {
                                const isChecked = currentDraft.condition === cond;
                                const isRight = correctObj.condition === cond;
                                let itemStyle = isChecked ? "bg-blue-200 border-blue-600 font-bold" : "bg-white border-slate-200";
                                if (isSubmitted) {
                                    if (isRight) itemStyle = "bg-emerald-100 border-emerald-500 font-bold text-emerald-950";
                                    else if (isChecked && !isRight) itemStyle = "bg-rose-100 border-rose-400 text-rose-950";
                                }
                                return (
                                    <label key={idx} className={`p-2.5 rounded-lg border flex items-center gap-2 cursor-pointer transition ${itemStyle}`}>
                                        <input type="radio" name="bowtie_cond" checked={isChecked} disabled={isSubmitted} onChange={() => setCondition(cond)} className="w-4 h-4 text-blue-600"/>
                                        <span>{cond}</span>
                                    </label>
                                );
                            })}
                        </div>

                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                            <h3 className="font-bold text-ncsbn-blue uppercase tracking-wider text-center border-b pb-2">Parameters to Monitor (Select 2)</h3>
                            {(bowtieData.monitoring || []).map((mon, idx) => {
                                const isChecked = (currentDraft.monitoring || []).includes(mon);
                                const isRight = (correctObj.monitoring || []).includes(mon);
                                let itemStyle = isChecked ? "bg-blue-100 border-blue-500 font-semibold" : "bg-white border-slate-200";
                                if (isSubmitted) {
                                    if (isRight) itemStyle = "bg-emerald-100 border-emerald-500 font-bold text-emerald-950";
                                    else if (isChecked && !isRight) itemStyle = "bg-rose-100 border-rose-400 text-rose-950";
                                }
                                return (
                                    <label key={idx} className={`p-2.5 rounded-lg border flex items-center gap-2 cursor-pointer transition ${itemStyle}`}>
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => toggleMonitoring(mon)} className="w-4 h-4 text-blue-600 rounded"/>
                                        <span>{mon}</span>
                                    </label>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            if (item.ngnType === "Matrix / Grid") {
                const matrixState = draftAnswer || {};
                const handleMatrixChange = (rowId, colVal) => {
                    onUpdateDraft({ ...matrixState, [rowId]: colVal });
                };
                return (
                    <table className="w-full border-collapse border border-slate-300 text-xs md:text-sm">
                        <thead className="bg-slate-100 border-b border-slate-300">
                            <tr>
                                <th className="p-3 text-left font-bold text-slate-700">Clinical Finding / Intervention</th>
                                {(item.columns || []).map((col, idx) => <th key={idx} className="p-3 text-center font-bold text-slate-700 w-32">{col}</th>)}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 bg-white">
                            {(item.rows || []).map(row => {
                                const rightCol = (item.correctAnswers || {})[row.id];
                                const userCol = matrixState[row.id];
                                return (
                                    <tr key={row.id}>
                                        <td className="p-3 font-medium text-slate-800">{row.text}</td>
                                        {(item.columns || []).map((col, cIdx) => {
                                            const isChecked = userCol === col;
                                            const isRight = rightCol === col;
                                            let bgCell = isSubmitted ? (isRight ? "bg-emerald-100 font-bold" : (isChecked ? "bg-rose-100" : "")) : "";
                                            return (
                                                <td key={cIdx} className={`p-3 text-center ${bgCell}`}>
                                                    <input type="radio" name={`mat_${row.id}`} checked={isChecked} disabled={isSubmitted} onChange={() => handleMatrixChange(row.id, col)} className="w-4 h-4 text-blue-600"/>
                                                    {isSubmitted && isRight && <span className="block text-[10px] text-emerald-800 font-extrabold mt-0.5"><i className="fa-solid fa-check"></i> Correct</span>}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                );
            }

            return <div className="text-slate-500 text-sm">Interactive NGN Item Loaded.</div>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
