<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCLEX Interactive Self-Study Hub</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--background);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .controls select {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 0.95rem;
            color: var(--text);
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tag {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .stem {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background: var(--background);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background: #f1f5f9;
            border-color: var(--primary);
        }

        .option-item input {
            margin-right: 12px;
            accent-color: var(--primary);
        }

        .option-item.correct {
            background: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        .option-item.incorrect {
            background: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .rationale-box {
            display: none;
            background: #f0fdf4;
            border-left: 4px solid var(--success);
            padding: 15px;
            border-radius: 0 6px 6px 0;
            margin-top: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .rationale-box.visible {
            display: block;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background: var(--primary-dark);
        }

        button.action-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            color: var(--text-light);
        }

        .complete-message {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NCLEX Review Hub</h1>
            <p>Interactive Study Dashboard Powered by Provided Question Banks</p>
        </header>

        <div class="stats-bar">
            <span id="progress-indicator">Question 1 of 0</span>
            <span id="score-indicator">Score: 0 / 0</span>
        </div>

        <div class="controls">
            <select id="category-filter" onchange="filterQuestions()">
                <option value="all">All Categories</option>
            </select>
        </div>

        <div id="quiz-container">
            <!-- Dynamic Question Card goes here -->
        </div>

        <div class="btn-container">
            <button id="submit-btn" class="action-btn" onclick="submitAnswer()">Submit Answer</button>
            <button id="next-btn" class="action-btn" onclick="nextQuestion()" style="display: none;">Next Question</button>
        </div>
    </div>

    <script>
        // Integrated Question Banks (Part 2 & Part 3 Combined)
        const qBank = [
            // From nclex_qbank_3000_part2.json[cite: 6]
            {
                "id": "NCLEX-3000-1001",
                "category": "Pharmacology & Parenteral Therapies",
                "sub_category": "Med-Surg / Pharm",
                "format": "SATA",
                "tag": "[SATA]",
                "stem": "The nurse is planning care for a client admitted with heart failure. Which interventions should the nurse include? (Select all that apply.)",
                "options": [
                    "A. Serum potassium level of 3.1 mEq/L",
                    "B. Blood pressure 118/74 mm Hg",
                    "C. Heart rate 76 bpm",
                    "D. Trace ankle edema",
                    "E. Daily weight protocol"
                ],
                "correct_answer": "A, B, and D",
                "rationale": "Options A, B, and D are evidence-based nursing interventions for heart failure."
            },
            {
                "id": "NCLEX-3000-1002",
                "category": "Management of Care",
                "sub_category": "Leadership & Delegation",
                "format": "NGN",
                "tag": "[NGN]",
                "stem": "Client Case File: 45-year-old presenting with symptoms of type 1 diabetes. Based on clinical indicators, which action should the nurse prioritize first?",
                "options": [
                    "A. Initiate IV access and administer regular insulin",
                    "B. Place client in high-Fowler position",
                    "C. Assess vital signs and oxygen saturation",
                    "D. Notify the health care provider"
                ],
                "correct_answer": "C. Assess vital signs and oxygen saturation",
                "rationale": "Assessment and clinical data gathering precede implementation according to the CJMM model."
            },
            {
                "id": "NCLEX-3000-1003",
                "category": "Reduction of Risk Potential",
                "sub_category": "Med-Surg / Lab Values",
                "format": "Traditional",
                "tag": "[Traditional]",
                "stem": "A client with COPD exacerbation is prescribed albuterol nebulizer. Which assessment finding requires immediate intervention?",
                "options": [
                    "A. Respiratory rate of 32/min and accessory muscle use",
                    "B. SpO2 91% on 2L NC",
                    "C. Productive cough",
                    "D. Wheezing bilaterally"
                ],
                "correct_answer": "A. Respiratory rate of 32/min and accessory muscle use",
                "rationale": "Immediate intervention is needed for Respiratory rate of 32/min and accessory muscle use because it indicates acute decompensation or toxicity."
            },
            // From nclex_qbank_3000_part3.json[cite: 5]
            {
                "id": "NCLEX-3000-2001",
                "category": "Pharmacology & Parenteral Therapies",
                "sub_category": "Med-Surg / Pharm",
                "format": "NGN",
                "tag": "[NGN]",
                "stem": "Client Case File: 45-year-old presenting with symptoms of heart failure. Based on clinical indicators, which action should the nurse prioritize first?",
                "options": [
                    "A. Initiate IV access and administer furosemide",
                    "B. Place client in high-Fowler position",
                    "C. Assess vital signs and oxygen saturation",
                    "D. Notify the health care provider"
                ],
                "correct_answer": "C. Assess vital signs and oxygen saturation",
                "rationale": "Assessment and clinical data gathering precede implementation according to the CJMM model."
            },
            {
                "id": "NCLEX-3000-2002",
                "category": "Management of Care",
                "sub_category": "Leadership & Delegation",
                "format": "Traditional",
                "tag": "[Traditional]",
                "stem": "A client with type 1 diabetes is prescribed regular insulin. Which assessment finding requires immediate intervention?",
                "options": [
                    "A. Diaphoresis and tremors",
                    "B. Blood glucose 140 mg/dL",
                    "C. Mild fatigue",
                    "D. Polydipsia"
                ],
                "correct_answer": "A. Diaphoresis and tremors",
                "rationale": "Immediate intervention is needed for Diaphoresis and tremors because it indicates acute decompensation or toxicity."
            },
            {
                "id": "NCLEX-3000-2003",
                "category": "Reduction of Risk Potential",
                "sub_category": "Med-Surg / Lab Values",
                "format": "SATA",
                "tag": "[SATA]",
                "stem": "The nurse is planning care for a client admitted with COPD exacerbation. Which interventions should the nurse include? (Select all that apply.)",
                "options": [
                    "A. Respiratory rate of 32/min and accessory muscle use",
                    "B. SpO2 91% on 2L NC",
                    "C. Productive cough",
                    "D. Wheezing bilaterally",
                    "E. Pursed-lip breathing"
                ],
                "correct_answer": "A, B, and D",
                "rationale": "Options A, B, and D are evidence-based nursing interventions for COPD exacerbation."
            }
        ];

        let activeQuestions = [...qBank];
        let currentIndex = 0;
        let score = 0;
        let answeredCurrent = false;

        function initApp() {
            populateCategories();
            loadQuestion();
        }

        function populateCategories() {
            const categories = [...new Set(qBank.map(q => q.category))];
            const select = document.getElementById('category-filter');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function filterQuestions() {
            const selectedCat = document.getElementById('category-filter').value;
            if (selectedCat === 'all') {
                activeQuestions = [...qBank];
            } else {
                activeQuestions = qBank.filter(q => q.category === selectedCat);
            }
            currentIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            const container = document.getElementById('quiz-container');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');

            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';

            if (activeQuestions.length === 0 || currentIndex >= activeQuestions.length) {
                container.innerHTML = `<div class="complete-message">Quiz Complete! Final Score: ${score} / ${activeQuestions.length}</div>`;
                document.getElementById('progress-indicator').textContent = "Complete";
                document.getElementById('score-indicator').textContent = `Score: ${score} / ${activeQuestions.length}`;
                submitBtn.style.display = 'none';
                return;
            }

            const q = activeQuestions[currentIndex];
            document.getElementById('progress-indicator').textContent = `Question ${currentIndex + 1} of ${activeQuestions.length}`;
            document.getElementById('score-indicator').textContent = `Score: ${score}`;

            let html = `
                <div class="question-card">
                    <div class="meta-info">
                        <span>${q.category}</span>
                        <span class="tag">${q.tag || q.format}</span>
                    </div>
                    <div class="stem">${q.stem}</div>
                    <ul class="options-list">
            `;

            q.options.forEach((opt, idx) => {
                const inputType = q.format === 'SATA' ? 'checkbox' : 'radio';
                html += `
                    <label class="option-item" id="opt-container-${idx}">
                        <input type="${inputType}" name="quiz-opt" value="${opt.charAt(0)}" data-index="${idx}">
                        <span>${opt}</span>
                    </label>
                `;
            });

            html += `
                    </ul>
                    <div id="rationale" class="rationale-box">
                        <strong>Rationale:</strong> ${q.rationale}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function submitAnswer() {
            if (answeredCurrent) return;

            const q = activeQuestions[currentIndex];
            const inputs = document.querySelectorAll('input[name="quiz-opt"]:checked');
            
            if (inputs.length === 0) {
                alert("Please select at least one option.");
                return;
            }

            answeredCurrent = true;
            
            // Extract selected option prefixes (e.g., 'A', 'B')
            let selectedVals = Array.from(inputs).map(input => input.value).sort().join(', ');
            
            // Clean correct answer string format match
            let correctFormatted = q.correct_answer.replace(/and/g, '').replace(/,/g, '').replace(/\s+/g, '').toUpperCase();
            let selectedFormatted = selectedVals.replace(/,/g, '').replace(/\s+/g, '').toUpperCase();

            // Simple evaluation logic mapping prefixes
            let isCorrect = false;
            if (q.format === 'SATA') {
                const cleanCorrect = q.correct_answer.match(/[A-E]/g).sort().join('');
                const cleanSelected = Array.from(inputs).map(i => i.value).sort().join('');
                isCorrect = (cleanCorrect === cleanSelected);
            } else {
                isCorrect = q.correct_answer.charAt(0).toUpperCase() === inputs[0].value.toUpperCase();
            }

            if (isCorrect) score++;

            // Highlight items
            q.options.forEach((opt, idx) => {
                const optPrefix = opt.charAt(0).toUpperCase();
                const containerEl = document.getElementById(`opt-container-${idx}`);
                if (q.correct_answer.toUpperCase().includes(optPrefix)) {
                    containerEl.classList.add('correct');
                } else {
                    const inputEl = containerEl.querySelector('input');
                    if (inputEl.checked) {
                        containerEl.classList.add('incorrect');
                    }
                }
            });

            document.getElementById('rationale').classList.add('visible');
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('score-indicator').textContent = `Score: ${score}`;
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        window.onload = initApp;
    </script>
</body>
</html>
