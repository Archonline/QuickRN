<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved & Bookmarked Questions | QuikRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncsbn: { navy: '#0F2C59', blue: '#1E40AF', light: '#EFF6FF', header: '#0B2240', accent: '#D97706', border: '#CBD5E1' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="questions.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">
    <header class="bg-[#0B2240] text-white px-6 py-3 flex justify-between items-center shadow border-b-2 border-amber-600">
        <div class="flex items-center gap-3">
            <div class="bg-blue-950 px-3 py-1.5 rounded border border-blue-800 flex items-center gap-2">
                <i class="fa-solid fa-bookmark text-amber-400"></i>
                <span class="font-extrabold text-base tracking-wider">QuikRN Saved Bank</span>
            </div>
            <span class="text-xs text-slate-300 hidden sm:inline">Compact View &bull; Unlimited Bookmarks & Notes</span>
        </div>
        <a href="dashboard.html" class="px-3.5 py-1.5 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full space-y-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-lg font-black text-slate-900">Bookmarked & Saved NCLEX Items</h1>
                <p class="text-xs text-slate-500">Compact view displaying maximum bookmarks per mastery domain with inline note-taking.</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="total-saved-badge" class="px-3 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold border border-amber-300">0 Bookmarked Items</span>
            </div>
        </div>

        <div id="mastery-categories-container" class="space-y-4">
            <!-- Dynamically populated per mastery category -->
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedQuestions();
        });

        function loadSavedQuestions() {
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            let favorites = state.studentStats && state.studentStats.favorites ? state.studentStats.favorites : [];
            let questionNotes = state.questionNotes || {};
            
            let allPool = [];
            if (typeof embeddedQuestionsData !== 'undefined') allPool = embeddedQuestionsData;
            else if (typeof questions !== 'undefined') allPool = questions;

            document.getElementById('total-saved-badge').innerText = `${favorites.length} Bookmarked Items`;

            const container = document.getElementById('mastery-categories-container');
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl border border-slate-200 p-12 text-center space-y-3">
                        <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl mx-auto"><i class="fa-regular fa-bookmark"></i></div>
                        <h3 class="font-bold text-base text-slate-900">No Bookmarked Questions Yet</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto">Click the bookmark icon on any question during practice to save items here.</p>
                        <a href="selfstudy.html" class="inline-block mt-2 px-6 py-2.5 bg-ncsbn-navy text-white text-xs font-bold rounded-lg hover:bg-blue-900">Start Practice Session</a>
                    </div>
                `;
                return;
            }

            let categorized = {};
            favorites.forEach(id => {
                let q = allPool.find(item => item.id === id);
                if (q) {
                    let cat = q.category || 'General Nursing';
                    if (!categorized[cat]) categorized[cat] = [];
                    categorized[cat].push(q);
                }
            });

            let html = '';
            for (let cat in categorized) {
                let items = categorized[cat];
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-900 text-xs md:text-sm flex items-center gap-2">
                                <i class="fa-solid fa-layer-group text-ncsbn-navy"></i> Domain: ${cat}
                            </h3>
                            <span class="text-[11px] font-semibold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">${items.length} Items</span>
                        </div>
                        <div class="divide-y divide-slate-100 px-4">
                `;

                items.forEach((q) => {
                    let qNote = questionNotes[q.id] || '';
                    html += `
                        <div py-3 space-y-2 class="py-3">
                            <div class="flex justify-between items-start gap-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-slate-100 text-slate-700 rounded">${q.id}</span>
                                    <span class="text-[10px] font-semibold text-slate-500">${q.topic || 'Clinical Topic'}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleCardDetail('${q.id}')" class="text-[11px] text-blue-700 hover:text-blue-900 font-semibold bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded transition">
                                        <i class="fa-solid fa-chevron-down" id="chevron-${q.id}"></i> Details & Notes
                                    </button>
                                    <button onclick="removeBookmark('${q.id}')" class="text-[11px] text-rose-600 hover:text-rose-800 font-semibold bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded transition">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <h4 class="text-xs font-bold text-slate-900">${q.question || q.questionText}</h4>
                            
                            <!-- Collapsible Details & Notes Pane -->
                            <div id="detail-${q.id}" class="hidden space-y-2 pt-2 border-t border-slate-100">
                                <div class="bg-blue-50/60 p-3 rounded-lg border border-blue-100 text-xs text-slate-800 space-y-1">
                                    <strong class="text-ncsbn-navy">Correct Answer:</strong> ${q.correctAnswerText || q.correctAnswer}<br>
                                    <strong class="text-ncsbn-navy">Rationale:</strong> ${q.rationale || 'N/A'}
                                </div>
                                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1">
                                    <label class="text-[10px] font-bold text-slate-700 uppercase flex items-center gap-1">
                                        <i class="fa-solid fa-pen text-amber-600"></i> Personal Note
                                    </label>
                                    <textarea id="note-${q.id}" oninput="saveQuestionNote('${q.id}')" rows="2" placeholder="Add clinical note or mnemonic..." class="w-full bg-white border border-slate-300 rounded p-2 text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-600">${qNote}</textarea>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        function toggleCardDetail(id) {
            const detailPane = document.getElementById(`detail-${id}`);
            if (detailPane) {
                detailPane.classList.toggle('hidden');
            }
        }

        function removeBookmark(id) {
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            if (state.studentStats && state.studentStats.favorites) {
                state.studentStats.favorites = state.studentStats.favorites.filter(item => item !== id);
                localStorage.setItem('quickrn_student_state', JSON.stringify(state));
                loadSavedQuestions();
            }
        }

        function saveQuestionNote(id) {
            let noteVal = document.getElementById(`note-${id}`).value;
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            state.questionNotes = state.questionNotes || {};
            state.questionNotes[id] = noteVal;
            localStorage.setItem('quickrn_student_state', JSON.stringify(state));
        }
    </script>
</body>
</html>
