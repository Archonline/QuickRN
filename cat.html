<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT Adaptive Exam | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: { 50: '#f0fdf4', 600: '#059669', 700: '#047857' },
                        clinical: { 600: '#0284c7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between">
    <header class="px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span class="font-extrabold text-base text-white">CAT Adaptive Exam (NCLEX Environment)</span>
            <span id="modal-timer" class="px-3 py-1 bg-slate-800 rounded-xl text-xs font-mono font-bold text-medical-400 border border-slate-700">05:00:00</span>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-rose-600 flex items-center justify-center text-white transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </header>

    <main class="p-6 max-w-7xl mx-auto w-full flex-grow flex items-center justify-center">
        <div id="exam-container" class="bg-slate-50 text-slate-900 p-8 rounded-3xl w-full max-w-4xl shadow-2xl space-y-6">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <!-- WARNING MODAL -->
    <div id="warning-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center text-slate-900">
            <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="space-y-1">
                <h3 class="font-bold text-base">Selection Required</h3>
                <p class="text-xs text-slate-600">Please choose an answer option before proceeding to the next item.</p>
            </div>
            <button onclick="document.getElementById('warning-modal').classList.add('hidden')" class="w-full py-2.5 bg-medical-600 text-white rounded-xl text-xs font-bold hover:bg-medical-700">OK</button>
        </div>
    </div>

    <script>
        let questions = [
            { id: 'c1', questionText: 'A client is receiving total parenteral nutrition (TPN) through a central line. What is the priority nursing intervention?', options: ['Monitor blood glucose every 6 hours', 'Change the IV tubing every 72 hours', 'Obtain daily serum potassium levels', 'Flush line with heparin daily'], correctAnswer: 'A', rationale: 'TPN has a high dextrose concentration, requiring strict blood glucose monitoring for hyperglycemia.' },
            { id: 'c2', questionText: 'A client with chronic kidney disease has a serum potassium level of 6.2 mEq/L. Which medication should the nurse anticipate administering first?', options: ['Regular insulin with 50% dextrose', 'Sodium polystyrene sulfonate', 'Oral furosemide', 'Calcium carbonate'], correctAnswer: 'A', rationale: 'IV regular insulin shifts potassium intracellularly rapidly for severe hyperkalemia.' },
            { id: 'c3', questionText: 'The nurse is caring for a client post-thyroidectomy. Which assessment finding requires immediate intervention?', options: ['Stridor and noisy respirations', 'Pain score of 4 out of 10 at incision site', 'Hoarseness when speaking', 'Serum calcium of 9.0 mg/dL'], correctAnswer: 'A', rationale: 'Stridor indicates acute laryngeal edema and airway obstruction post-thyroidectomy.' }
        ];
        let currentIndex = 0;
        let userAnswers = {};

        function renderQuestion() {
            if (currentIndex >= questions.length || currentIndex >= 150) {
                finishExam();
                return;
            }
            const q = questions[currentIndex];
            const sel = userAnswers[currentIndex];

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <div class="flex items-center justify-between bg-white px-6 py-3 rounded-2xl border border-slate-200">
                        <span class="px-3 py-1 bg-medical-50 text-medical-700 text-xs font-bold rounded-xl">Question ${currentIndex + 1} of 150 (CAT Stop Rules Active)</span>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <p class="text-base font-semibold text-slate-900">${q.questionText}</p>
                    </div>
                    <div class="space-y-3">
            `;

            q.options.forEach((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isSelected = sel === optLetter;
                html += `
                    <button onclick="selectOpt('${optLetter}')" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${isSelected ? 'bg-medical-50 border-medical-500 font-bold text-medical-900' : 'bg-white border-slate-200 hover:border-medical-500 text-slate-700'}">
                        <span class="text-sm"><strong>${optLetter}.</strong> ${opt}</span>
                    </button>
                `;
            });

            html += `
                    </div>
                    <div class="flex justify-end pt-4 border-t border-slate-200">
                        <button onclick="nextItem()" class="px-6 py-3 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl text-xs shadow-md">Next Item <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('exam-container').innerHTML = html;
        }

        function selectOpt(letter) {
            userAnswers[currentIndex] = letter;
            renderQuestion();
        }

        function nextItem() {
            if (userAnswers[currentIndex] === undefined) {
                document.getElementById('warning-modal').classList.remove('hidden');
                return;
            }

            if (currentIndex >= 1) {
                let correctCount = 0;
                let answeredCount = 0;
                for (let i = 0; i <= currentIndex; i++) {
                    if (userAnswers[i] !== undefined) {
                        answeredCount++;
                        if (userAnswers[i] === questions[i].correctAnswer) correctCount++;
                    }
                }
                const acc = correctCount / answeredCount;
                if (answeredCount >= 2 && (acc >= 0.85 || acc <= 0.40)) {
                    finishExam();
                    return;
                }
            }

            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            let correct = 0;
            let attempted = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] !== undefined) {
                    attempted++;
                    if (userAnswers[idx] === q.correctAnswer) correct++;
                }
            });
            const scorePercent = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { testsTaken: 0, totalAnswered: 0, correctCount: 0, mistakeCount: 0, passingProbability: 0, catHistory: [82], peerHistory: [80], examHistory: [], answeredQuestionIds: {}, favorites: [] };
            stateObj.studentStats.testsTaken++;
            stateObj.studentStats.totalAnswered += attempted;
            stateObj.studentStats.correctCount += correct;
            stateObj.studentStats.passingProbability = Math.min(98, Math.max(20, scorePercent + 3));
            stateObj.studentStats.examHistory.unshift({ date: new Date().toLocaleString(), mode: 'CAT Adaptive Exam', total: questions.length, attempted, scorePercent, questions, userAnswers });
            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));

            document.getElementById('exam-container').innerHTML = `
                <div class="text-center py-10 space-y-6 animate-fadeIn">
                    <div class="w-20 h-20 rounded-full bg-medical-100 text-medical-600 flex items-center justify-center text-4xl mx-auto"><i class="fa-solid fa-laptop-medical"></i></div>
                    <h3 class="text-2xl font-extrabold text-slate-900">CAT Simulator Completed!</h3>
                    <div class="flex justify-center gap-8 py-4 bg-white rounded-2xl border border-slate-200">
                        <div><span class="text-[10px] text-slate-400 block uppercase font-bold">Score</span><span class="text-3xl font-black text-medical-600">${scorePercent}%</span></div>
                    </div>
                    <button onclick="window.location.href='dashboard.html'" class="px-8 py-3 bg-slate-900 text-white font-extrabold rounded-2xl text-xs">Return to Dashboard</button>
                </div>
            `;
        }

        renderQuestion();
    </script>
</body>
</html>
