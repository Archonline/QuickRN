<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved & Bookmarked Questions | QuikRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncsbn: { navy: '#0F2C59', blue: '#1E40AF', light: '#EFF6FF', header: '#0B2240', accent: '#D97706', border: '#CBD5E1' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="questions.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">
    <header class="bg-[#0B2240] text-white px-6 py-4 flex justify-between items-center shadow border-b-2 border-amber-600">
        <div class="flex items-center gap-3">
            <div class="bg-blue-950 px-3 py-1.5 rounded border border-blue-800 flex items-center gap-2">
                <i class="fa-solid fa-bookmark text-amber-400"></i>
                <span class="font-extrabold text-lg tracking-wider">QuikRN Saved Bank</span>
            </div>
            <span class="text-xs text-slate-300 hidden sm:inline">Categorized per Mastery (30 Items Max per Mastery Category)</span>
        </div>
        <a href="dashboard.html" class="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Return to Dashboard
        </a>
    </header>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full space-y-6 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-slate-900">Bookmarked & Saved NCLEX Items</h1>
                <p class="text-xs text-slate-500 mt-1">Review your saved clinical questions organized by NCLEX Client Needs and Mastery categories (up to 30 items per category).</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="total-saved-badge" class="px-3 py-1.5 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold border border-amber-300">0 Bookmarked Items</span>
            </div>
        </div>

        <div id="mastery-categories-container" class="space-y-6">
            <!-- Dynamically populated per mastery category -->
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedQuestions();
        });

        function loadSavedQuestions() {
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            let favorites = state.studentStats && state.studentStats.favorites ? state.studentStats.favorites : [];
            
            let allPool = [];
            if (typeof embeddedQuestionsData !== 'undefined') allPool = embeddedQuestionsData;
            else if (typeof questions !== 'undefined') allPool = questions;

            document.getElementById('total-saved-badge').innerText = `${favorites.length} Bookmarked Items`;

            const container = document.getElementById('mastery-categories-container');
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl border border-slate-200 p-12 text-center space-y-3">
                        <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl mx-auto"><i class="fa-regular fa-bookmark"></i></div>
                        <h3 class="font-bold text-base text-slate-900">No Bookmarked Questions Yet</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto">Click the bookmark icon on any question during Self-Study, Timed Exams, CAT, or Readiness Assessments to save items here.</p>
                        <a href="selfstudy.html" class="inline-block mt-2 px-6 py-2.5 bg-ncsbn-navy text-white text-xs font-bold rounded-lg hover:bg-blue-900">Start Practice Session</a>
                    </div>
                `;
                return;
            }

            let categorized = {};
            favorites.forEach(id => {
                let q = allPool.find(item => item.id === id);
                if (q) {
                    let cat = q.category || 'General Nursing';
                    if (!categorized[cat]) categorized[cat] = [];
                    if (categorized[cat].length < 30) {
                        categorized[cat].push(q);
                    }
                }
            });

            let html = '';
            for (let cat in categorized) {
                let items = categorized[cat];
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-layer-group text-ncsbn-navy"></i> Mastery Category: ${cat}
                            </h3>
                            <span class="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-full">${items.length} / 30 Items</span>
                        </div>
                        <div class="divide-y divide-slate-100 p-6 space-y-4">
                `;

                items.forEach((q, idx) => {
                    html += `
                        <div class="pt-4 first:pt-0 space-y-2">
                            <div class="flex justify-between items-start gap-4">
                                <span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-slate-100 text-slate-700 rounded">${q.id} &bull; ${q.topic || 'Clinical Topic'}</span>
                                <button onclick="removeBookmark('${q.id}')" class="text-xs text-rose-600 hover:text-rose-800 font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Remove
                                </button>
                            </div>
                            <h4 class="text-xs md:text-sm font-bold text-slate-900">${q.question || q.questionText}</h4>
                            <div class="bg-blue-50/50 p-3 rounded-lg border border-blue-100 text-xs text-slate-700 space-y-1">
                                <strong class="text-ncsbn-navy">Correct Answer:</strong> ${q.correctAnswerText || q.correctAnswer}<br>
                                <strong class="text-ncsbn-navy">Rationale:</strong> ${q.rationale || 'N/A'}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        function removeBookmark(id) {
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            if (state.studentStats && state.studentStats.favorites) {
                state.studentStats.favorites = state.studentStats.favorites.filter(item => item !== id);
                localStorage.setItem('quickrn_student_state', JSON.stringify(state));
                loadSavedQuestions();
            }
        }
    </script>
</body>
</html>
