<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Bank Self-Study | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: { 50: '#f0fdf4', 600: '#059669', 700: '#047857' },
                        clinical: { 600: '#0284c7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between">
    <header class="px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span id="header-title" class="font-extrabold text-base text-white">Q-Bank Self-Study Mode</span>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-rose-600 flex items-center justify-center text-white transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </header>

    <main class="p-6 max-w-7xl mx-auto w-full flex-grow flex items-center justify-center">
        <div id="exam-container" class="bg-slate-50 text-slate-900 p-8 rounded-3xl w-full max-w-4xl shadow-2xl space-y-6">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'all';

        let questions = [
            { id: 's1', questionText: 'A client with heart failure is prescribed furosemide. Which laboratory value should the nurse monitor most closely?', options: ['Serum potassium', 'Blood glucose', 'Serum calcium', 'Platelet count'], correctAnswer: 'A', rationale: 'Furosemide is a loop diuretic that wastes potassium, risking hypokalemia.' },
            { id: 's2', questionText: 'NGN Case Study: A client in the ED presents with acute shortness of breath and wheezing. Select the priority nursing action.', options: ['Administer prescribed albuterol nebulizer treatment', 'Prepare for emergency intubation immediately', 'Draw arterial blood gases', 'Apply continuous pulse oximetry'], correctAnswer: 'A', rationale: 'Albuterol is a fast-acting bronchodilator for acute bronchospasm.' },
            { id: 's3', questionText: 'An adult client is admitted with severe dehydration secondary to gastroenteritis. Which IV fluid order is standard for initial resuscitation?', options: ['0.9% Sodium Chloride', '5% Dextrose in Water', '0.45% Sodium Chloride', '3% Sodium Chloride'], correctAnswer: 'A', rationale: '0.9% Normal Saline is an isotonic solution used for rapid intravascular volume expansion.' }
        ];

        if (mode === 'ngn') {
            document.getElementById('header-title').innerText = "Q-Bank Self-Study (NGN Case Studies Only)";
            questions = questions.filter((_, idx) => idx === 1);
        }

        let currentIndex = 0;
        let userAnswers = {};

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('exam-container').innerHTML = `
                    <div class="text-center py-10 space-y-6">
                        <h3 class="text-2xl font-extrabold text-slate-900">Self-Study Session Completed!</h3>
                        <button onclick="window.location.href='dashboard.html'" class="px-8 py-3 bg-slate-900 text-white font-extrabold rounded-2xl text-xs">Return to Dashboard</button>
                    </div>
                `;
                return;
            }

            const q = questions[currentIndex];
            const sel = userAnswers[currentIndex];
            const isAnswered = sel !== undefined;

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <div class="flex items-center justify-between bg-white px-6 py-3 rounded-2xl border border-slate-200">
                        <span class="px-3 py-1 bg-medical-50 text-medical-700 text-xs font-bold rounded-xl">Question ${currentIndex + 1} of ${questions.length}</span>
                        <button onclick="saveFavorite('${q.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 flex items-center gap-1"><i class="fa-solid fa-bookmark"></i> Save for Review</button>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <p class="text-base font-semibold text-slate-900">${q.questionText}</p>
                    </div>
                    <div class="space-y-3">
            `;

            q.options.forEach((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isSelected = sel === optLetter;
                let optStyle = "bg-white border-slate-200 text-slate-700";
                if (isAnswered) {
                    if (optLetter === q.correctAnswer) optStyle = "bg-emerald-50 border-emerald-500 font-bold text-emerald-900";
                    else if (isSelected) optStyle = "bg-rose-50 border-rose-500 font-bold text-rose-900";
                } else if (isSelected) {
                    optStyle = "bg-medical-50 border-medical-500 font-bold text-medical-900";
                }

                html += `
                    <button onclick="selectOpt('${optLetter}')" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${optStyle}">
                        <span class="text-sm"><strong>${optLetter}.</strong> ${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if (isAnswered) {
                html += `
                    <div class="p-6 bg-white rounded-2xl border border-slate-200 space-y-2 animate-fadeIn">
                        <h4 class="font-bold text-slate-900 text-xs uppercase"><i class="fa-solid fa-circle-info text-clinical-600 mr-1"></i> Rationale</h4>
                        <p class="text-xs text-slate-700 leading-relaxed">${q.rationale}</p>
                    </div>
                `;
            }

            html += `
                    <div class="flex justify-end pt-4 border-t border-slate-200">
                        <button onclick="nextItem()" class="px-6 py-3 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl text-xs shadow-md">Next Item <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('exam-container').innerHTML = html;
        }

        function selectOpt(letter) {
            userAnswers[currentIndex] = letter;
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { testsTaken: 0, totalAnswered: 0, correctCount: 0, mistakeCount: 0, passingProbability: 0, catHistory: [82], peerHistory: [80], examHistory: [], answeredQuestionIds: {}, favorites: [] };
            const q = questions[currentIndex];
            stateObj.studentStats.totalAnswered++;
            if (letter === q.correctAnswer) stateObj.studentStats.correctCount++;
            else stateObj.studentStats.mistakeCount++;
            stateObj.studentStats.answeredQuestionIds[q.id] = { correct: letter === q.correctAnswer };
            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
            renderQuestion();
        }

        function nextItem() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        function saveFavorite(qId) {
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { favorites: [] };
            stateObj.studentStats.favorites = stateObj.studentStats.favorites || [];
            if (!stateObj.studentStats.favorites.some(f => f.id === qId)) {
                stateObj.studentStats.favorites.push(questions[currentIndex]);
                localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
                alert("Question saved to favorites successfully!");
            } else {
                alert("Question is already in your saved reviews.");
            }
        }

        renderQuestion();
    </script>
</body>
</html>
