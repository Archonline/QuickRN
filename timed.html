<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed Exam | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: { 50: '#f0fdf4', 600: '#059669', 700: '#047857' },
                        clinical: { 600: '#0284c7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between">
    <header class="px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span id="header-title" class="font-extrabold text-base text-white">Timed Exam Session</span>
            <span id="modal-timer" class="px-3 py-1 bg-slate-800 rounded-xl text-xs font-mono font-bold text-medical-400 border border-slate-700">00:25:00</span>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-rose-600 flex items-center justify-center text-white transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </header>

    <main class="p-6 max-w-7xl mx-auto w-full flex-grow flex items-center justify-center">
        <div id="exam-container" class="bg-slate-50 text-slate-900 p-8 rounded-3xl w-full max-w-4xl shadow-2xl space-y-6">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <!-- WARNING MODAL -->
    <div id="warning-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center text-slate-900">
            <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="space-y-1">
                <h3 class="font-bold text-base">Selection Required</h3>
                <p class="text-xs text-slate-600">Please choose an answer option before proceeding to the next item.</p>
            </div>
            <button onclick="document.getElementById('warning-modal').classList.add('hidden')" class="w-full py-2.5 bg-medical-600 text-white rounded-xl text-xs font-bold hover:bg-medical-700">OK</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const count = parseInt(urlParams.get('count') || '15', 10);
        document.getElementById('header-title').innerText = `Timed Exam (${count} Items)`;

        // Questions mapped with precise NCLEX Client Needs domains
        let questions = [
            { id: 't1', domain: 'Pharmacological & Parenteral Therapies', questionText: 'A client with heart failure is prescribed furosemide. Which laboratory value should the nurse monitor most closely?', options: ['Serum potassium', 'Blood glucose', 'Serum calcium', 'Platelet count'], correctAnswer: 'A', rationale: 'Furosemide is a loop diuretic that wastes potassium, risking hypokalemia.' },
            { id: 't2', domain: 'Pharmacological & Parenteral Therapies', questionText: 'A client with chronic kidney disease has a serum potassium level of 6.2 mEq/L. Which medication should the nurse anticipate administering first?', options: ['Regular insulin with 50% dextrose', 'Sodium polystyrene sulfonate', 'Oral furosemide', 'Calcium carbonate'], correctAnswer: 'A', rationale: 'IV regular insulin shifts potassium intracellularly rapidly for severe hyperkalemia.' },
            { id: 't3', domain: 'Physiological Adaptation', questionText: 'The nurse is caring for a client post-thyroidectomy. Which assessment finding requires immediate intervention?', options: ['Stridor and noisy respirations', 'Pain score of 4 at incision site', 'Hoarseness when speaking', 'Serum calcium of 9.0 mg/dL'], correctAnswer: 'A', rationale: 'Stridor indicates acute laryngeal edema and airway obstruction post-thyroidectomy.' },
            { id: 't4', domain: 'Management of Care', questionText: 'A charge nurse is making assignments. Which client is appropriate to assign to an LPN?', options: ['A stable client with chronic COPD needing routine oral medications', 'A newly admitted client with acute chest pain', 'A client receiving blood transfusions experiencing a reaction', 'A client requiring initial post-operative stroke assessment'], correctAnswer: 'A', rationale: 'LPNs can care for stable clients with predictable outcomes.' },
            { id: 't5', domain: 'Safety & Infection Control', questionText: 'Which action should the nurse take first when entering the room of a client on contact precautions for Clostridium difficile?', options: ['Put on a clean gown and gloves before entry', 'Put on a surgical mask and eye shield', 'Perform hand hygiene with alcohol rub', 'Place client in negative pressure room'], correctAnswer: 'A', rationale: 'Contact precautions require gowns and gloves. Alcohol rub is ineffective against C. diff spores; handwashing with soap and water is required.' },
            { id: 't6', domain: 'Health Promotion & Maintenance', questionText: 'At what age should the nurse educate parents that an infant typically begins rolling from back to side?', options: ['4 to 5 months', '2 to 3 months', '6 to 7 months', '9 to 10 months'], correctAnswer: 'A', rationale: 'Infants usually achieve rolling capabilities around 4 to 5 months of age.' },
            { id: 't7', domain: 'Psychosocial Integrity', questionText: 'A client expressing feelings of hopelessness states, "I just want to end it all." What is the immediate priority action for the nurse?', options: ['Implement continuous suicide precautions and a one-on-one observer', 'Ask the client why they feel this way', 'Encourage the client to think about their family', 'Document the statement in the chart'], correctAnswer: 'A', rationale: 'Client safety is the primary priority when suicide ideation is expressed.' },
            { id: 't8', domain: 'Basic Care & Comfort', questionText: 'Which nursing intervention is most effective in preventing pressure injuries in a bedridden immobile client?', options: ['Repositioning the client every 2 hours', 'Massaging bony prominences regularly', 'Keeping the head of the bed elevated at 45 degrees continuously', 'Applying heavy-duty plastic sheets'], correctAnswer: 'A', rationale: 'Frequent repositioning relieves sustained pressure on tissue capillaries.' },
            { id: 't9', domain: 'Reduction of Risk Potential', questionText: 'A client is receiving a unit of packed red blood cells. Thirty minutes into the infusion, the client develops chills, lower back pain, and dark urine. What is the nurse\'s immediate action?', options: ['Stop the transfusion immediately and disconnect tubing with normal saline', 'Slow down the infusion rate and call the provider', 'Administer prescribed antihistamine and continue', 'Apply a warm blanket and monitor'], correctAnswer: 'A', rationale: 'These are classic signs of an acute hemolytic transfusion reaction; stopping the infusion prevents further harm.' },
            { id: 't10', domain: 'Physiological Adaptation', questionText: 'A client with diabetic ketoacidosis (DKA) is receiving regular insulin via continuous IV infusion. Which electrolyte shift should the nurse anticipate?', options: ['Potassium shifting from extracellular to intracellular space', 'Sodium remaining completely stable', 'Calcium levels spiking sharply', 'Magnesium levels increasing'], correctAnswer: 'A', rationale: 'Insulin drives potassium back into cells, which can quickly drop serum potassium levels.' },
            { id: 't11', domain: 'Management of Care', questionText: 'A nurse witnesses another staff member charting a procedure before it is actually performed. What is the appropriate ethical and professional response?', options: ['Report the incident privately to the nursing supervisor', 'Confront the nurse publicly in front of the patient', 'Ignore it since charting was completed eventually', 'Erase the entry'], correctAnswer: 'A', rationale: 'Pre-charting is falsification of medical records and should be escalated via chain of command.' },
            { id: 't12', domain: 'Safety & Infection Control', questionText: 'Which client requires placement in a negative-pressure airflow room (airborne precautions)?', options: ['A client with active pulmonary tuberculosis', 'A client with influenza', 'A client with bacterial pneumonia', 'A client with wound staph infection'], correctAnswer: 'A', rationale: 'Tuberculosis is airborne, requiring negative pressure rooms and N95 respirators.' },
            { id: 't13', domain: 'Pharmacological & Parenteral Therapies', questionText: 'Which assessment is vital prior to administering oral digoxin to an adult client?', options: ['Apical pulse for a full 60 seconds', 'Blood pressure reading', 'Respiratory rate', 'Serum sodium level'], correctAnswer: 'A', rationale: 'Digoxin slows heart rate; if apical pulse is under 60 bpm, hold the dose and notify provider.' },
            { id: 't14', domain: 'Health Promotion & Maintenance', questionText: 'A nurse is planning dietary education for a client diagnosed with iron-deficiency anemia. Which food choice should be emphasized?', options: ['Dark leafy green vegetables and lean red meats', 'Citrus fruits only', 'Dairy products like milk and cheese', 'White bread and pasta'], correctAnswer: 'A', rationale: 'Red meat and leafy greens are rich sources of bioavailable dietary iron.' },
            { id: 't15', domain: 'Psychosocial Integrity', questionText: 'A client recently diagnosed with terminal cancer says, "The lab results must be mixed up; I feel fine most days." Which defense mechanism is the client exhibiting?', options: ['Denial', 'Projection', 'Rationalization', 'Regression'], correctAnswer: 'A', rationale: 'Denial is a coping mechanism where individuals refuse to accept reality or facts.' }
        ];

        let currentIndex = 0;
        let userAnswers = {};

        function renderQuestion() {
            if (currentIndex >= Math.min(count, questions.length)) {
                finishExam();
                return;
            }

            const q = questions[currentIndex % questions.length];
            const sel = userAnswers[currentIndex];

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <div class="flex items-center justify-between bg-white px-6 py-3 rounded-2xl border border-slate-200">
                        <span class="px-3 py-1 bg-medical-50 text-medical-700 text-xs font-bold rounded-xl">Question ${currentIndex + 1} of ${count} (${q.domain})</span>
                        <button onclick="saveFavorite('${q.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 flex items-center gap-1"><i class="fa-solid fa-bookmark"></i> Save for Review</button>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <p class="text-base font-semibold text-slate-900">${q.questionText}</p>
                    </div>
                    <div class="space-y-3">
            `;

            q.options.forEach((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isSelected = sel === optLetter;
                html += `
                    <button onclick="selectOpt('${optLetter}')" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${isSelected ? 'bg-medical-50 border-medical-500 font-bold text-medical-900' : 'bg-white border-slate-200 hover:border-medical-500 text-slate-700'}">
                        <span class="text-sm"><strong>${optLetter}.</strong> ${opt}</span>
                    </button>
                `;
            });

            html += `
                    </div>
                    <div class="flex justify-end pt-4 border-t border-slate-200">
                        <button onclick="nextItem()" class="px-6 py-3 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl text-xs shadow-md">Next Item <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('exam-container').innerHTML = html;
        }

        function selectOpt(letter) {
            userAnswers[currentIndex] = letter;
            renderQuestion();
        }

        function nextItem() {
            if (userAnswers[currentIndex] === undefined) {
                document.getElementById('warning-modal').classList.add('hidden');
                setTimeout(() => document.getElementById('warning-modal').classList.remove('hidden'), 50);
                return;
            }

            if (currentIndex < Math.min(count, questions.length) - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            let correct = 0;
            let attempted = 0;
            const activeQuestions = questions.slice(0, Math.min(count, questions.length));

            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { testsTaken: 0, totalAnswered: 0, correctCount: 0, mistakeCount: 0, passingProbability: 0, catHistory: [82], peerHistory: [80], examHistory: [], answeredQuestionIds: {}, domainStats: {}, favorites: [] };
            
            stateObj.studentStats.testsTaken++;
            stateObj.studentStats.domainStats = stateObj.studentStats.domainStats || {};
            stateObj.studentStats.answeredQuestionIds = stateObj.studentStats.answeredQuestionIds || {};

            activeQuestions.forEach((q, idx) => {
                const ans = userAnswers[idx];
                if (ans !== undefined) {
                    attempted++;
                    stateObj.studentStats.answeredQuestionIds[q.id] = true;
                    stateObj.studentStats.totalAnswered++;

                    // Initialize domain tracking if missing
                    if (!stateObj.studentStats.domainStats[q.domain]) {
                        stateObj.studentStats.domainStats[q.domain] = { total: 0, correct: 0 };
                    }
                    stateObj.studentStats.domainStats[q.domain].total++;

                    const isCorrect = ans === q.correctAnswer;
                    if (isCorrect) {
                        correct++;
                        stateObj.studentStats.correctCount++;
                        stateObj.studentStats.domainStats[q.domain].correct++;
                    } else {
                        stateObj.studentStats.mistakeCount++;
                    }
                }
            });

            const scorePercent = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
            stateObj.studentStats.passingProbability = Math.min(95, Math.max(25, scorePercent + 4));
            stateObj.studentStats.examHistory.unshift({ date: new Date().toLocaleString(), mode: `Timed Test (${count} Items)`, total: count, attempted, scorePercent, questions: activeQuestions, userAnswers });
            
            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <div class="text-center space-y-3">
                        <div class="w-20 h-20 rounded-full bg-medical-100 text-medical-600 flex items-center justify-center text-4xl mx-auto"><i class="fa-solid fa-award"></i></div>
                        <h3 class="text-2xl font-extrabold text-slate-900">Exam Session Completed!</h3>
                        <p class="text-xs text-slate-500">Your NCLEX Client Needs Mastery categories have been updated.</p>
                    </div>
                    <div class="flex justify-center gap-8 py-4 bg-white rounded-2xl border border-slate-200">
                        <div><span class="text-[10px] text-slate-400 block uppercase font-bold">Score</span><span class="text-3xl font-black text-medical-600">${scorePercent}%</span></div>
                    </div>
                    <div class="space-y-4 max-h-[40vh] overflow-y-auto">
            `;

            activeQuestions.forEach((q, qIdx) => {
                const userAns = userAnswers[qIdx];
                const isCorrect = userAns === q.correctAnswer;
                html += `
                    <div class="bg-white p-5 rounded-2xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-rose-200 bg-rose-50/20'} space-y-2">
                        <div class="flex justify-between text-xs font-bold text-slate-700">
                            <span>Question ${qIdx + 1} (${q.domain})</span>
                            <span class="${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-900">${q.questionText}</p>
                        <div class="text-xs text-slate-600"><strong>Rationale:</strong> ${q.rationale}</div>
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="text-center pt-2">
                        <button onclick="window.location.href='dashboard.html'" class="px-8 py-3 bg-slate-900 text-white font-extrabold rounded-2xl text-xs">Return to Dashboard</button>
                    </div>
                </div>
            `;
            document.getElementById('exam-container').innerHTML = html;
        }

        function saveFavorite(qId) {
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { favorites: [] };
            stateObj.studentStats.favorites = stateObj.studentStats.favorites || [];
            const q = questions[currentIndex % questions.length];
            if (!stateObj.studentStats.favorites.some(f => f.id === q.id)) {
                stateObj.studentStats.favorites.push(q);
                localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
                alert("Question saved to favorites successfully!");
            } else {
                alert("Question is already in your saved reviews.");
            }
        }

        renderQuestion();
    </script>
</body>
</html>
