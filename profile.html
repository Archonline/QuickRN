<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Profile | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        ncsbn: { navy: '#0F2C59', blue: '#1E40AF', light: '#EFF6FF', header: '#0B2240', accent: '#D97706' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">
    <!-- Top Header Bar -->
    <header class="bg-ncsbn-header text-white px-6 py-4 flex justify-between items-center shadow border-b-2 border-ncsbn-accent">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-brand-500/30">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <span class="font-extrabold text-lg tracking-wider text-white">Quick<span class="text-amber-400">RN</span></span>
                <span class="block text-[10px] uppercase font-semibold text-slate-400">Candidate Profile & Settings</span>
            </div>
        </div>
        <a href="dashboard.html" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
            <i class="fa-solid fa-arrow-left"></i> Return to Dashboard
        </a>
    </header>

    <main class="flex-grow p-6 max-w-4xl mx-auto w-full space-y-6 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
            <div class="flex items-center gap-4 border-b border-slate-100 pb-6">
                <div class="w-16 h-16 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center text-3xl font-bold">
                    <i class="fa-solid fa-user-nurse"></i>
                </div>
                <div>
                    <h1 id="profile-title" class="text-2xl font-black text-slate-900">Candidate Profile</h1>
                    <p class="text-xs text-slate-500 mt-0.5">Manage your candidate details, NCLEX target test date, and exam predictor preferences.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-700 uppercase">Full Name</label>
                    <input type="text" id="input-name" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="Future RN">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-700 uppercase">Email Address</label>
                    <input type="email" id="input-email" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="candidate@quickrn.com">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-700 uppercase">Target NCLEX-RN Test Date</label>
                    <input type="date" id="input-test-date" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-600">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-700 uppercase">Nursing School / Institution</label>
                    <input type="text" id="input-school" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="School of Nursing">
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button onclick="saveProfile()" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-xl text-xs shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save Profile Settings
                </button>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            document.getElementById('input-name').value = state.userName || localStorage.getItem('quickrn_user_name') || 'Future RN';
            document.getElementById('input-email').value = state.userEmail || localStorage.getItem('quickrn_user_email') || 'candidate@quickrn.com';
            document.getElementById('input-test-date').value = state.targetDate || '';
            document.getElementById('input-school').value = state.nursingSchool || '';
        });

        function saveProfile() {
            let name = document.getElementById('input-name').value;
            let email = document.getElementById('input-email').value;
            let targetDate = document.getElementById('input-test-date').value;
            let school = document.getElementById('input-school').value;

            let state = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            state.userName = name;
            state.userEmail = email;
            state.targetDate = targetDate;
            state.nursingSchool = school;
            localStorage.setItem('quickrn_student_state', JSON.stringify(state));
            localStorage.setItem('quickrn_user_name', name);
            localStorage.setItem('quickrn_user_email', email);

            alert('Profile updated successfully!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
