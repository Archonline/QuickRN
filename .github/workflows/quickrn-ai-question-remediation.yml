name: QuickRN AI question remediation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # A workflow/worker update starts an immediate validation run. Bot commits to
  # question-bank files do not match these paths, so this cannot self-trigger.
  push:
    branches: [main]
    paths:
      - ".github/workflows/quickrn-ai-question-remediation.yml"
      - "scripts/ai-remediate-quarantine-batch.js"

concurrency:
  group: quickrn-ai-question-remediation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preflight effective question-bank coverage
        run: node scripts/ai-remediate-quarantine-batch.js --dry-run
      - name: Check whether the AI key is configured
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY repository secret is missing. No question content was changed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Remediate up to 25 effective quarantined items
        if: steps.keycheck.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.QUICKRN_REMEDIATION_MODEL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ai-remediate-quarantine-batch.js
      - name: Commit remediation updates
        if: steps.keycheck.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "quickrn-remediation-bot"
          git config user.email "quickrn-remediation-bot@users.noreply.github.com"
          git add questions.js questions-bank-*.js reports/ai-remediation/
          git commit -m "AI remediation: webmaster review batch"
          git push origin HEAD:main
