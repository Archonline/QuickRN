<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Bank Self-Study | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: { 50: '#f0fdf4', 600: '#059669', 700: '#047857' },
                        clinical: { 600: '#0284c7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } 
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; } 
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between">
    <header class="px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span id="header-title" class="font-extrabold text-base text-white">Q-Bank Self-Study Mode</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="flag-indicator" class="text-xs font-semibold text-amber-400 hidden"><i class="fa-solid fa-flag mr-1"></i> Flagged</span>
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-rose-600 flex items-center justify-center text-white transition-colors" title="Exit">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto w-full flex-grow flex items-center justify-center">
        <div id="exam-container" class="bg-slate-50 text-slate-900 p-8 rounded-3xl w-full max-w-5xl shadow-2xl space-y-6">
            <div class="text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p class="text-sm font-semibold">Loading questions from compiled dataset...</p>
            </div>
        </div>
    </main>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {}; // stores user selections
        let flaggedQuestions = {}; // stores flagged state per question index

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'all';

        // Fetch compiled JSON dataset
        async function loadQuestions() {
            try {
                const response = await fetch('compiled_nclex_qbank.json');
                if (!response.ok) throw new Error('Failed to load question bank data.');
                let data = await response.json();

                // If NGN mode is selected via URL parameter (?mode=ngn), filter questions strictly for NGN types/case studies
                if (mode === 'ngn') {
                    document.getElementById('header-title').innerText = "Q-Bank Self-Study (NGN Case Studies Mode)";
                    questions = data.filter(q => q.caseStudy || q.type || q.id.startsWith('NGN'));
                } else {
                    document.getElementById('header-title').innerText = "Q-Bank Self-Study (NCLEX Comprehensive Mode)";
                    questions = data;
                }

                if (questions.length === 0) {
                    document.getElementById('exam-container').innerHTML = `
                        <div class="text-center py-10 space-y-4">
                            <h3 class="text-xl font-bold text-slate-800">No questions found for this mode.</h3>
                            <button onclick="window.location.href='dashboard.html'" class="px-6 py-3 bg-slate-900 text-white rounded-xl text-xs font-bold">Return to Dashboard</button>
                        </div>
                    `;
                    return;
                }

                renderQuestion();
            } catch (error) {
                console.error(error);
                document.getElementById('exam-container').innerHTML = `
                    <div class="text-center py-10 space-y-4 text-rose-600">
                        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                        <h3 class="text-lg font-bold">Error Loading Question Bank</h3>
                        <p class="text-xs text-slate-600">Ensure 'compiled_nclex_qbank.json' is in the same directory and accessible via local server.</p>
                        <button onclick="window.location.href='dashboard.html'" class="px-6 py-3 bg-slate-900 text-white rounded-xl text-xs font-bold">Return to Dashboard</button>
                    </div>
                `;
            }
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('exam-container').innerHTML = `
                    <div class="text-center py-10 space-y-6 animate-fadeIn">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h3 class="text-2xl font-extrabold text-slate-900">Self-Study Session Completed!</h3>
                        <p class="text-xs text-slate-600 max-w-md mx-auto">You have successfully reviewed all items in this session. Your progress has been logged.</p>
                        <button onclick="window.location.href='dashboard.html'" class="px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white font-extrabold rounded-2xl text-xs transition-all shadow-lg">Return to Dashboard</button>
                    </div>
                `;
                document.getElementById('flag-indicator').classList.add('hidden');
                return;
            }

            const q = questions[currentIndex];
            const sel = userAnswers[currentIndex];
            const isAnswered = sel !== undefined;
            const isFlagged = flaggedQuestions[currentIndex] || false;

            // Update header flag indicator
            const flagIndicator = document.getElementById('flag-indicator');
            if (isFlagged) {
                flagIndicator.classList.remove('hidden');
            } else {
                flagIndicator.classList.add('hidden');
            }

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <!-- Top Navigation Bar inside container -->
                    <div class="flex items-center justify-between bg-white px-6 py-3 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 bg-medical-50 text-medical-700 text-xs font-bold rounded-xl">Item ${currentIndex + 1} of ${questions.length}</span>
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">${q.category || 'General'}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="toggleFlag()" class="text-xs font-bold ${isFlagged ? 'text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200' : 'text-slate-500 hover:text-amber-600'} transition-all flex items-center gap-1">
                                <i class="fa-solid fa-flag"></i> ${isFlagged ? 'Flagged' : 'Flag for Review'}
                            </button>
                            <button onclick="saveFavorite('${q.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 flex items-center gap-1 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-xl transition-all">
                                <i class="fa-solid fa-bookmark"></i> Save Review
                            </button>
                        </div>
                    </div>
            `;

            // NGN Case Study Panel if present
            if (q.caseStudy) {
                html += `
                    <div class="bg-slate-100 p-6 rounded-3xl border border-slate-300 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wide text-clinical-600"><i class="fa-solid fa-hospital-user mr-1"></i> NGN Clinical Case Window (${q.caseStudy.setting || 'Hospital Unit'})</span>
                            <span class="text-xs font-medium text-slate-600">Client: ${q.caseStudy.clientAge} yr old ${q.caseStudy.gender}</span>
                        </div>
                        <p class="text-xs text-slate-700 leading-relaxed bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <strong>Clinical History:</strong> ${q.caseStudy.clinicalHistory}
                        </p>
                    </div>
                `;
            }

            // Question prompt container
            html += `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <p class="text-base font-semibold text-slate-900 leading-relaxed">${q.question || q.questionText}</p>
                </div>
            `;

            // Render options based on format (Standard multiple choice options array vs NGN options/matrix/dropdowns)
            html += `<div class="space-y-3">`;
            
            if (q.options && Array.isArray(q.options)) {
                q.options.forEach((opt, idx) => {
                    const optLetter = String.fromCharCode(65 + idx);
                    const isSelected = sel === optLetter;
                    let optStyle = "bg-white border-slate-200 text-slate-700 hover:border-medical-600";
                    
                    if (isAnswered) {
                        // Check if correct answer matches letter or text string
                        const isCorrectOpt = (q.correctAnswer === optLetter) || (Array.isArray(q.correctAnswer) && q.correctAnswer.includes(opt));
                        if (isCorrectOpt) {
                            optStyle = "bg-emerald-50 border-emerald-500 font-bold text-emerald-900 shadow-sm";
                        } else if (isSelected) {
                            optStyle = "bg-rose-50 border-rose-500 font-bold text-rose-900 shadow-sm";
                        } else {
                            optStyle = "bg-white border-slate-200 text-slate-400 opacity-60";
                        }
                    } else if (isSelected) {
                        optStyle = "bg-medical-50 border-medical-500 font-bold text-medical-900 shadow-sm";
                    }

                    html += `
                        <button onclick="selectOpt('${optLetter}')" ${isAnswered ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${optStyle}">
                            <span class="text-sm"><strong>${optLetter}.</strong> ${opt}</span>
                            ${isAnswered && (q.correctAnswer === optLetter || (Array.isArray(q.correctAnswer) && q.correctAnswer.includes(opt))) ? '<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>' : ''}
                        </button>
                    `;
                });
            } else {
                // Fallback simulation for custom NGN formats if options aren't flat array
                html += `<div class="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl text-xs font-medium">Interactive NGN item format loaded. Please review rationale below after submission.</div>`;
            }

            html += `</div>`;

            // STRICT RULE: Rationale shown ONLY after choosing an option
            if (isAnswered) {
                html += `
                    <div class="p-6 bg-white rounded-3xl border border-slate-200 space-y-2 animate-fadeIn shadow-sm">
                        <h4 class="font-bold text-slate-900 text-xs uppercase tracking-wider flex items-center gap-1 text-clinical-600"><i class="fa-solid fa-circle-info"></i> Rationale & Clinical Judgment</h4>
                        <p class="text-xs text-slate-700 leading-relaxed">${q.rationale || 'No rationale provided for this item.'}</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="p-4 bg-slate-100 rounded-2xl border border-slate-200 text-center text-xs text-slate-500 font-medium">
                        <i class="fa-solid fa-lock mr-1"></i> Rationale will be unlocked immediately after selecting an answer.
                    </div>
                `;
            }

            // Bottom Navigation Controls
            html += `
                    <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                        <button onclick="prevItem()" ${currentIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-5 py-2.5 bg-slate-200 text-slate-600 font-bold rounded-xl text-xs"' : 'class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition-all"'}>
                            <i class="fa-solid fa-arrow-left mr-1"></i> Previous
                        </button>
                        <button onclick="nextItem()" class="px-6 py-3 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl text-xs shadow-md transition-all flex items-center gap-1">
                            ${currentIndex === questions.length - 1 ? 'Finish Session' : 'Next Item'} <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('exam-container').innerHTML = html;
        }

        function selectOpt(letter) {
            if (userAnswers[currentIndex] !== undefined) return; // Prevent changing answer once submitted in self-study
            userAnswers[currentIndex] = letter;

            const q = questions[currentIndex];
            let isCorrect = false;
            if (q.correctAnswer === letter) {
                isCorrect = true;
            } else if (Array.isArray(q.correctAnswer)) {
                // map letter to option text if needed
                const optIndex = letter.charCodeAt(0) - 65;
                const optText = q.options ? q.options[optIndex] : '';
                if (q.correctAnswer.includes(optText)) isCorrect = true;
            }

            // Update local student stats simulation
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { testsTaken: 0, totalAnswered: 0, correctCount: 0, mistakeCount: 0, passingProbability: 0, catHistory: [82], peerHistory: [80], examHistory: [], answeredQuestionIds: {}, favorites: [] };
            stateObj.studentStats.totalAnswered++;
            if (isCorrect) stateObj.studentStats.correctCount++;
            else stateObj.studentStats.mistakeCount++;
            stateObj.studentStats.answeredQuestionIds[q.id] = { correct: isCorrect };
            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));

            renderQuestion();
        }

        function toggleFlag() {
            flaggedQuestions[currentIndex] = !flaggedQuestions[currentIndex];
            renderQuestion();
        }

        function nextItem() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function saveFavorite(qId) {
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { favorites: [] };
            stateObj.studentStats.favorites = stateObj.studentStats.favorites || [];
            if (!stateObj.studentStats.favorites.some(f => f.id === qId)) {
                stateObj.studentStats.favorites.push(questions[currentIndex]);
                localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
                alert("Question saved to review favorites successfully!");
            } else {
                alert("Question is already in your saved reviews.");
            }
        }

        // Initialize loader on window load
        window.onload = loadQuestions;
    </script>
</body>
</html>
