<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Bank Self-Study | QuickRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' },
                        clinical: { 50: '#f0f9ff', 100: '#e0f2fe', 600: '#0284c7', 700: '#0369a1' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } 
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between">

    <!-- TOP NCLEX TOOLBAR -->
    <header class="px-6 py-3.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='dashboard.html'">
                <div class="w-7 h-7 rounded-lg bg-medical-600 flex items-center justify-center text-white font-extrabold text-sm">
                    <i class="fa-solid fa-stethoscope"></i>
                </div>
                <span class="font-black text-sm text-white tracking-wide">Quick<span class="text-medical-500">RN</span></span>
            </div>
            <span class="h-4 w-px bg-slate-700"></span>
            <span id="mode-badge" class="px-2.5 py-1 rounded-md bg-medical-500/20 text-medical-400 font-bold uppercase tracking-wider text-[10px] border border-medical-500/30">
                Self-Study Engine (8,000+ Q-Bank)
            </span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="openReportModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold transition-all flex items-center gap-1.5 text-[11px]" title="Report Question Error">
                <i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Report Issue
            </button>
            <button onclick="toggleSaveBookmark()" id="btn-save-bookmark" class="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 font-bold transition-all flex items-center gap-1.5 text-[11px] border border-amber-500/30">
                <i class="fa-solid fa-bookmark"></i> <span id="bookmark-text">Save for Review</span>
            </button>
            <button onclick="window.location.href='dashboard.html'" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-rose-600 text-white flex items-center justify-center transition-colors" title="Exit to Dashboard">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
    </header>

    <!-- MAIN EXAM AREA -->
    <main class="p-4 sm:p-6 max-w-7xl mx-auto w-full flex-grow flex flex-col justify-center">
        <div id="exam-container" class="bg-slate-50 text-slate-900 p-6 sm:p-8 rounded-3xl w-full shadow-2xl space-y-6">
            <div class="text-center py-20 space-y-3">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-medical-600"></i>
                <p class="text-sm font-bold text-slate-700">Shuffling & Loading 8,000+ High-Yield NCLEX Items...</p>
            </div>
        </div>
    </main>

    <!-- REPORT ISSUE MODAL -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 text-slate-900 space-y-4 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <h3 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-flag text-rose-600"></i> Report Question Issue
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">If you found a typo, incorrect answer key, or issue with this question, submit feedback below:</p>
            <div class="space-y-2 text-xs">
                <label class="font-bold text-slate-700">Issue Type:</label>
                <select id="report-type" class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 font-semibold text-slate-800">
                    <option value="typo">Typo or Grammatical Error</option>
                    <option value="key">Incorrect Answer Key</option>
                    <option value="rationale">Unclear Rationale</option>
                    <option value="other">Other Technical Issue</option>
                </select>
            </div>
            <div class="space-y-2 text-xs">
                <label class="font-bold text-slate-700">Comments:</label>
                <textarea id="report-comment" rows="3" placeholder="Describe the issue..." class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50 text-xs focus:ring-2 focus:ring-medical-500 outline-none"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold text-xs">Cancel</button>
                <button onclick="submitQuestionReport()" class="px-5 py-2 bg-rose-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-rose-700">Submit Report</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modeFilter = urlParams.get('mode') || 'all';

        let allQuestions = [];
        let questions = [];
        let currentIndex = 0;
        let selectedOptions = []; 
        let isSubmitted = false;

        // Static Mnemonic Fallback Dictionary
        const staticMnemonics = {
            "delegation": { title: "5 Rights of Delegation: EAT", mnemonic: "Don't delegate what you can EAT: Evaluate, Assess, Teach! RNs retain unstable clients, initial assessments, and teaching." },
            "digoxin": { title: "Digoxin Toxicity: DIG", mnemonic: "D - Dizziness/Halo vision, I - Impaired heart rate (Bradycardia <60), G - Gastrointestinal upset (Nausea/Vomiting early sign)." },
            "airborne": { title: "Airborne Precautions: My Chicken Hez TB", mnemonic: "M - Measles, C - Chickenpox (Varicella), H - Herpes Zoster (Disseminated), TB - Tuberculosis. (N95 Mask + Negative Pressure Room)." },
            "heart failure": { title: "Acute Pulmonary Edema: UNLOAD FAST", mnemonic: "U - Upright position, N - Nitrates, L - Lasix (Furosemide), O - Oxygen, A - ACE inhibitors, D - Digoxin." },
            "abg": { title: "Acid-Base Imbalance: ROME", mnemonic: "R - Respiratory O - Opposite (pH up, PaCO2 down = Alkalosis), M - Metabolic E - Equal (pH up, HCO3 up = Alkalosis)." }
        };

        // Fisher-Yates Randomization Function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Dynamic Keyword & Concept Mnemonic Generator
        function getDynamicMnemonic(text, category, topic) {
            const keywords = extractRationaleKeywords(text, category, topic);
            const primaryKey = (keywords[0] || '').toLowerCase();

            // Check if key matches static database
            for (let key in staticMnemonics) {
                if (primaryKey.includes(key) || (topic && topic.toLowerCase().includes(key))) {
                    return staticMnemonics[key];
                }
            }

            // Generate customized dynamic visual mnemonic hook based on extracted keyword
            const capitalizedKey = primaryKey ? primaryKey.toUpperCase() : "PRIORITY CARE";
            return {
                title: `Dynamic Concept Hook: ${capitalizedKey}`,
                mnemonic: `Focus on ${capitalizedKey}: Always prioritize immediate clinical safety, baseline assessment thresholds, and direct evidence-based interventions for optimal outcomes.`
            };
        }

        // Extraction helper for dynamic keyword parsing from rationale
        function extractRationaleKeywords(text, category, topic) {
            if (!text) return [topic || category || "NCLEX review"];
            
            const medicalTermsRegex = /\b(prioritization|delegation|advance directives|informed consent|organ donation|ethical dilemmas|interprofessional collaboration|insulin|heparin|digoxin|potassium|iv titration|medication calculation|adverse reaction|antidote|acute coronary syndrome|myocardial infarction|sepsis|septic shock|respiratory failure|mechanical ventilation|electrolyte imbalance|hyperkalemia|hypokalemia|hypocalcemia|airborne|droplet|contact precautions|ppe|needle safety|fall prevention|seizure precautions|abg interpretation|dvt|pulmonary embolism|atelectasis|vital signs|antepartum|postpartum|apgar|immunization|pediatric milestones|therapeutic communication|crisis intervention|de-escalation|withdrawal|ciwa|cows|tpn|tube feeding|palliative|pain management|pressure injury)\b/gi;

            const matches = text.match(medicalTermsRegex);
            if (matches && matches.length > 0) {
                return [...new Set(matches.map(m => m.toLowerCase()))];
            }

            const stopWords = new Set(["in", "management", "of", "care", "prioritizing", "immediate", "assessment", "and", "evidence-based", "clinical", "judgment", "related", "to", "ensures", "patient", "safety", "aligns", "with", "standards", "the", "that", "this", "from", "for"]);
            const words = text.replace(/[^\w\s]/gi, '').split(/\s+/);
            const candidates = words.filter(w => w.length > 4 && !stopWords.has(w.toLowerCase()));
            
            if (candidates.length > 0) {
                return [...new Set(candidates.slice(0, 3))];
            }

            return [topic || category || "NCLEX review"];
        }

        async function initEngine() {
            try {
                let response = await fetch('compiled_nclex_9000_comprehensive.json').catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch('compiled_nclex_8000_verified.json').catch(() => null);
                }
                if (!response || !response.ok) {
                    response = await fetch('compiled_nclex_qbank.json');
                }
                allQuestions = await response.json();

                if (modeFilter === 'ngn') {
                    questions = allQuestions.filter(q => q.type && (q.type.includes('NGN') || q.type.includes('Case Study') || q.caseStudy));
                    document.getElementById('mode-badge').innerText = "NGN Case Studies Mode";
                } else if (modeFilter === 'sata') {
                    questions = allQuestions.filter(q => q.type && q.type.includes('SATA'));
                    document.getElementById('mode-badge').innerText = "Select All That Apply (SATA)";
                } else {
                    questions = allQuestions;
                }

                // Randomize Array Order
                shuffleArray(questions);

                renderQuestion();
            } catch (err) {
                console.error("Error loading question bank:", err);
                document.getElementById('exam-container').innerHTML = `
                    <div class="text-center py-10 space-y-4 text-rose-600">
                        <i class="fa-solid fa-triangle-exclamation text-4xl"></i>
                        <h3 class="text-lg font-bold">Failed to Load Question Dataset</h3>
                        <p class="text-xs text-slate-600">Ensure question bank JSON file is in your local root folder.</p>
                        <button onclick="window.location.href='dashboard.html'" class="px-6 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs">Return to Dashboard</button>
                    </div>
                `;
            }
        }

        function renderQuestion() {
            if (!questions || questions.length === 0) return;

            const q = questions[currentIndex];
            selectedOptions = [];
            isSubmitted = false;

            updateBookmarkUI(q.id);

            const isNGN = q.caseStudy || (q.type && q.type.includes('NGN'));
            const isSATA = Array.isArray(q.correctAnswer) || (q.type && q.type.includes('SATA'));

            let html = `
                <div class="space-y-6 animate-fadeIn">
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white px-5 py-3 rounded-2xl border border-slate-200">
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 bg-medical-50 text-medical-700 text-xs font-black rounded-xl">Question ${currentIndex + 1} of ${questions.length}</span>
                            <span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-[10px] font-extrabold uppercase rounded-lg tracking-wider">${q.category || 'Management of Care'}</span>
                            ${q.highYieldTag === 'HIGH-YIELD' ? '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-[10px] font-black uppercase rounded-lg"><i class="fa-solid fa-bolt mr-1"></i> High Yield</span>' : ''}
                        </div>
                        <span class="text-xs font-bold text-slate-400">${isSATA ? 'Select All That Apply (SATA)' : (isNGN ? 'NGN Case Study' : 'Multiple Choice')}</span>
                    </div>
            `;

            if (isNGN) {
                const cs = q.caseStudy || {};
                html += `
                    <div class="grid lg:grid-cols-2 gap-6">
                        <div class="bg-slate-100 rounded-3xl p-5 border border-slate-300 space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                                <span class="text-xs font-black uppercase text-clinical-600 tracking-wider"><i class="fa-solid fa-notes-medical mr-1.5"></i> EHR Client Record</span>
                                <span class="text-xs font-bold text-slate-500">${cs.clientAge || '64'} y/o ${cs.gender || 'Female'} (${cs.setting || 'Med-Surg'})</span>
                            </div>
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 text-xs space-y-3 custom-scrollbar max-h-[350px] overflow-y-auto">
                                <p class="text-slate-700 leading-relaxed"><strong>Clinical History & Presentation:</strong> ${cs.clinicalHistory || q.question}</p>
                                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1 text-[11px]">
                                    <div class="font-bold text-slate-800">Vital Signs Thresholds:</div>
                                    <div class="text-slate-600">T: 38.4°C (101.1°F), HR: 112/min, RR: 24/min, BP: 94/58 mmHg, SpO2: 91% on RA</div>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                                <h3 class="text-sm sm:text-base font-bold text-slate-900 leading-relaxed">${q.question}</h3>
                            </div>
                            <div id="options-container" class="space-y-3"></div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">${q.question}</h3>
                    </div>
                    <div id="options-container" class="space-y-3"></div>
                `;
            }

            html += `<div id="remediation-container"></div>`;

            html += `
                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                    <button onclick="loadPreviousQuestion()" ${currentIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-5 py-3 bg-slate-200 text-slate-500 font-bold rounded-2xl text-xs"' : 'class="px-5 py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-2xl text-xs transition-all flex items-center gap-1.5"'}>
                        <i class="fa-solid fa-arrow-left"></i> Previous Item
                    </button>
                    <div class="flex items-center gap-3">
                        <button id="btn-submit-answer" onclick="submitAnswer()" class="px-7 py-3 bg-medical-600 hover:bg-medical-700 text-white font-extrabold rounded-2xl text-xs shadow-md transition-all">
                            Submit Answer
                        </button>
                        <button onclick="loadNextQuestion()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white font-extrabold rounded-2xl text-xs shadow-md transition-all flex items-center gap-1.5">
                            Next Item <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
            `;

            document.getElementById('exam-container').innerHTML = html;
            renderOptions();
        }

        function renderOptions() {
            const q = questions[currentIndex];
            const container = document.getElementById('options-container');
            if (!container || !q.options) return;

            const isSATA = Array.isArray(q.correctAnswer) || (q.type && q.type.includes('SATA'));

            let html = '';
            q.options.forEach((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isSelected = selectedOptions.includes(optLetter);

                let btnStyle = "bg-white border-slate-200 text-slate-700 hover:border-medical-500";
                if (isSelected) {
                    btnStyle = "bg-medical-50 border-medical-500 text-medical-900 font-bold shadow-sm";
                }

                html += `
                    <button onclick="handleOptionClick('${optLetter}')" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${btnStyle}">
                        <div class="flex items-center gap-3">
                            <span class="w-7 h-7 rounded-xl ${isSelected ? 'bg-medical-600 text-white' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-xs">${optLetter}</span>
                            <span class="text-xs sm:text-sm font-medium">${opt}</span>
                        </div>
                        ${isSATA ? `<input type="checkbox" ${isSelected ? 'checked' : ''} class="w-4 h-4 accent-medical-600 pointer-events-none">` : ''}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function handleOptionClick(letter) {
            if (isSubmitted) return;

            const q = questions[currentIndex];
            const isSATA = Array.isArray(q.correctAnswer) || (q.type && q.type.includes('SATA'));

            if (isSATA) {
                if (selectedOptions.includes(letter)) {
                    selectedOptions = selectedOptions.filter(l => l !== letter);
                } else {
                    selectedOptions.push(letter);
                }
            } else {
                selectedOptions = [letter];
            }

            renderOptions();
        }

        function submitAnswer() {
            if (selectedOptions.length === 0) {
                alert("Please select an option before submitting!");
                return;
            }

            isSubmitted = true;
            const q = questions[currentIndex];
            
            let isCorrect = false;
            if (Array.isArray(q.correctAnswer)) {
                const correctLetters = q.options.map((opt, i) => q.correctAnswer.includes(opt) ? String.fromCharCode(65 + i) : null).filter(Boolean);
                isCorrect = selectedOptions.sort().join('') === correctLetters.sort().join('');
            } else {
                const selectedText = q.options[selectedOptions[0].charCodeAt(0) - 65];
                isCorrect = (selectedOptions[0] === q.correctAnswer) || (selectedText === q.correctAnswer);
            }

            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { testsTaken: 0, totalAnswered: 0, correctCount: 0, mistakeCount: 0, passingProbability: 0, answeredQuestionIds: {}, favorites: [] };
            stateObj.studentStats.totalAnswered++;
            if (isCorrect) stateObj.studentStats.correctCount++;
            else stateObj.studentStats.mistakeCount++;
            
            const acc = Math.round((stateObj.studentStats.correctCount / stateObj.studentStats.totalAnswered) * 100);
            stateObj.studentStats.passingProbability = Math.min(99, Math.max(35, acc + 10));
            stateObj.studentStats.answeredQuestionIds[q.id] = { correct: isCorrect };

            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));

            renderSubmittedOptions(isCorrect);
            revealRemediationEcosystem(isCorrect);

            document.getElementById('btn-submit-answer').disabled = true;
            document.getElementById('btn-submit-answer').classList.add('opacity-50', 'cursor-not-allowed');
        }

        function renderSubmittedOptions(isCorrect) {
            const q = questions[currentIndex];
            const container = document.getElementById('options-container');
            if (!container) return;

            let html = '';
            q.options.forEach((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isSelected = selectedOptions.includes(optLetter);
                
                let isRightChoice = false;
                if (Array.isArray(q.correctAnswer)) {
                    isRightChoice = q.correctAnswer.includes(opt);
                } else {
                    isRightChoice = (q.correctAnswer === optLetter) || (q.correctAnswer === opt);
                }

                let btnStyle = "bg-white border-slate-200 text-slate-400 opacity-60";
                if (isRightChoice) {
                    btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold shadow-sm";
                } else if (isSelected && !isRightChoice) {
                    btnStyle = "bg-rose-50 border-rose-500 text-rose-900 font-bold shadow-sm";
                }

                html += `
                    <div class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${btnStyle}">
                        <div class="flex items-center gap-3">
                            <span class="w-7 h-7 rounded-xl ${isRightChoice ? 'bg-emerald-600 text-white' : (isSelected ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600')} flex items-center justify-center font-bold text-xs">${optLetter}</span>
                            <span class="text-xs sm:text-sm font-medium">${opt}</span>
                        </div>
                        ${isRightChoice ? '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>' : (isSelected ? '<i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>' : '')}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function revealRemediationEcosystem(isCorrect) {
            const q = questions[currentIndex];
            const container = document.getElementById('remediation-container');
            if (!container) return;

            const extractedKeywords = extractRationaleKeywords(q.rationale, q.category, q.topic);
            const mainQueryTerm = extractedKeywords.join(' ');

            // Dynamic Mnemonic generation based on extracted rationale terms
            const activeMnemonic = getDynamicMnemonic(q.rationale, q.category, q.topic);

            const dynamicVideoResources = [
                { 
                    name: `RegisteredNurseRN - ${extractedKeywords[0] || 'NCLEX'} Review`, 
                    url: `https://www.youtube.com/results?search_query=${encodeURIComponent('registerednursern ' + mainQueryTerm)}` 
                },
                { 
                    name: `LevelUpRN - ${extractedKeywords[0] || 'Pharmacology'} High Yield`, 
                    url: `https://www.youtube.com/results?search_query=${encodeURIComponent('leveluprn ' + mainQueryTerm)}` 
                },
                { 
                    name: `Nexus Nursing - ${extractedKeywords[0] || 'NGN'} Clinical Judgment`, 
                    url: `https://www.youtube.com/results?search_query=${encodeURIComponent('nexus nursing ' + mainQueryTerm)}` 
                }
            ];

            let html = `
                <div class="space-y-4 pt-4 border-t border-slate-200 animate-fadeIn">
                    <div class="p-4 rounded-2xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} flex items-center gap-3">
                        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600 text-2xl' : 'fa-circle-xmark text-rose-600 text-2xl'}"></i>
                        <div>
                            <div class="font-black text-xs uppercase tracking-wider">${isCorrect ? 'Correct Clinical Judgment!' : 'Incorrect Choice'}</div>
                            <div class="text-xs font-medium">${isCorrect ? 'Great job prioritizing evidence-based patient safety.' : 'Review rationale and visual memory hooks below.'}</div>
                        </div>
                    </div>

                    <div class="p-6 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-2">
                        <h4 class="font-extrabold text-xs uppercase text-clinical-600 flex items-center gap-1.5"><i class="fa-solid fa-book-medical"></i> Detailed NCLEX Rationale</h4>
                        <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${q.rationale || 'Prioritizing patient safety and immediate physical assessments is standard nursing care.'}</p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <!-- Dynamic Visual Mnemonic -->
                        <div class="bg-amber-50 p-5 rounded-2xl border border-amber-200 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-extrabold text-xs text-amber-900 uppercase flex items-center gap-1.5">
                                    <i class="fa-solid fa-brain text-amber-600"></i> Sticky Visual Mnemonic
                                </h4>
                                <span class="px-2 py-0.5 bg-amber-100 text-amber-800 font-extrabold text-[9px] rounded-md uppercase">
                                    Dynamic Hook
                                </span>
                            </div>
                            <div class="font-bold text-xs text-amber-900">${activeMnemonic.title}</div>
                            <p class="text-xs text-amber-800 leading-relaxed">${activeMnemonic.mnemonic}</p>
                        </div>

                        <!-- Dynamic Video Remediation Tutorials -->
                        <div class="bg-clinical-50 p-5 rounded-2xl border border-clinical-200 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-extrabold text-xs text-clinical-900 uppercase flex items-center gap-1.5">
                                    <i class="fa-solid fa-video text-clinical-600"></i> Video Remediation Tutorials
                                </h4>
                                <span class="px-2 py-0.5 bg-clinical-100 text-clinical-700 font-extrabold text-[9px] rounded-md uppercase">
                                    Key: ${extractedKeywords[0] || 'Topic'}
                                </span>
                            </div>
                            <div class="space-y-1.5">
            `;

            dynamicVideoResources.forEach(vid => {
                html += `
                    <a href="${vid.url}" target="_blank" class="block p-2 rounded-xl bg-white border border-clinical-200 hover:bg-clinical-100 text-[11px] font-bold text-clinical-700 transition-colors flex items-center justify-between">
                        <span><i class="fa-brands fa-youtube text-rose-600 mr-1.5"></i> ${vid.name}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                `;
            });

            html += `
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-slate-100 rounded-xl text-[10px] text-slate-500 flex items-center justify-between font-semibold">
                        <span><i class="fa-solid fa-building-columns mr-1"></i> Reference: ${q.reference || 'NCBI Bookshelf / CDC Infection Control Guidelines / AHA Protocols'}</span>
                        <span class="text-slate-400">Verified 2026/2027 Standards</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function loadNextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert("You have completed this review session!");
                window.location.href = 'dashboard.html';
            }
        }

        function loadPreviousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function updateBookmarkUI(qId) {
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            const favs = stateObj.studentStats?.favorites || [];
            const isSaved = favs.some(f => f.id === qId);

            const btn = document.getElementById('btn-save-bookmark');
            const txt = document.getElementById('bookmark-text');
            if (!btn || !txt) return;

            if (isSaved) {
                btn.className = "px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold transition-all flex items-center gap-1.5 text-[11px] border border-emerald-500/30";
                txt.innerText = "Saved";
            } else {
                btn.className = "px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 font-bold transition-all flex items-center gap-1.5 text-[11px] border border-amber-500/30";
                txt.innerText = "Save for Review";
            }
        }

        function toggleSaveBookmark() {
            const q = questions[currentIndex];
            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.studentStats = stateObj.studentStats || { favorites: [] };
            stateObj.studentStats.favorites = stateObj.studentStats.favorites || [];

            const idx = stateObj.studentStats.favorites.findIndex(f => f.id === q.id);
            if (idx > -1) {
                stateObj.studentStats.favorites.splice(idx, 1);
            } else {
                stateObj.studentStats.favorites.push(q);
            }

            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
            updateBookmarkUI(q.id);
        }

        function openReportModal() {
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
        }

        function submitQuestionReport() {
            const q = questions[currentIndex];
            const type = document.getElementById('report-type').value;
            const comment = document.getElementById('report-comment').value;

            let stateObj = JSON.parse(localStorage.getItem('quickrn_student_state') || '{}');
            stateObj.questionReports = stateObj.questionReports || [];
            stateObj.questionReports.push({ questionId: q.id, type, comment, date: new Date().toISOString() });

            localStorage.setItem('quickrn_student_state', JSON.stringify(stateObj));
            alert("Question issue reported successfully. Thank you for making QuickRN better!");
            closeReportModal();
        }

        window.onload = initEngine;
    </script>
</body>
</html>
