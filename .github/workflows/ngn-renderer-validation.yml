name: NGN renderer validation
on:
  push:
    branches: ["main", "feat/shared-ngn-renderer-highlight-trend", "beta-exam-ui-repair"]
  pull_request:
    branches: ["main"]
jobs:
  renderer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check shared renderer and test scripts
        run: |
          node --check js/quickrn-platform-hardening.js
          node --check tests/platform-hardening.test.js
          node --check tests/brand-system-contract.test.js
          node --check js/quickrn-cat-engine.js
          node --check js/quickrn-question-metrics.js
          node --check tests/cat-engine.test.js
          node --check js/shared-exam-renderer.js
          node --check tests/clinical-schema-adapter.test.js
          node --check js/quickrn-exam-app.js
          node --check js/quickrn-ngn-compat.js
          node --check tests/quickrn-ngn-compat.test.js
          node --check questions-ngn-supplement.js
          node --check questions-bank-v3-clinical.js
          node --check tests/clinical-v3-bank.test.js
          node --check tests/clinical-v3-rendering.test.js
          node --check js/quickrn-ngn-compat.js
          node --check tests/shared-renderer.test.js
          node --check tests/clinical-prompt-normalizer.test.js
          node --check tests/question-id-normalizer.test.js
          node --check tests/question-bank-renderer-contract.test.js
          node --check tests/help-content-contract.test.js
          node --check tests/calendar-feature-contract.test.js
          node --check tests/reporting-backup-contract.test.js
          node --check tests/feedback-inbox.test.js
          node --check js/quickrn-question-reporting.js
          node --check js/quickrn-data-backup.js
          node --check js/quickrn-question-id-normalizer.js
          node --check js/quickrn-question-schema-v2.js
          node --check scripts/validate-question-schema-v2.js
          node --check tests/question-schema-v2.test.js
          node --check js/quickrn-question-bank-normalizer.js
          node --check js/quickrn-case-study-sequencer.js
          node --check tests/case-study-sequencer.test.js
          node --check tests/selfstudy-lifecycle.test.js
          node --check tests/exam-unified-interface-contract.test.js
          node --check tests/exam-page-script-contract.test.js
          node --check js/quickrn-ngn-scoring.js
          node --check tests/ngn-scoring.test.js
          node --check tests/ngn-workspace-contract.test.js
          node --check tests/dashboard-question-routing.test.js
          node --check scripts/validate-question-bank.js
          node --check tests/curated-question-bank.test.js
      - name: Render new clinical schema and keep scenario in left pane
        run: node tests/clinical-schema-adapter.test.js
      - name: Test canonical Question Schema v2 and lossless legacy normalization
        run: node tests/question-schema-v2.test.js
      - name: Enforce complete Question Schema v2 production bank
        run: node scripts/validate-question-schema-v2.js
      - name: Verify shared QuickRN brand system across pages
        run: node tests/brand-system-contract.test.js
      - name: Test shared platform safeguards
        run: node tests/platform-hardening.test.js
      - name: Test linked case sequencing and no-repeat exhaustion
        run: node tests/case-study-sequencer.test.js
      - name: Verify Self-Study finish, analytics reset, and no-repeat contracts
        run: node tests/selfstudy-lifecycle.test.js
      - name: Validate curated NCLEX and NGN replacement questions
        run: node tests/curated-question-bank.test.js
      - name: Validate clinical v3 bank and all 13 formats across exam modes
        if: always()
        run: node tests/clinical-v3-bank.test.js
      - name: Render every clinical v3 question through shared renderer
        if: always()
        run: node tests/clinical-v3-rendering.test.js
      - name: Verify shared exam interface, rationale, branding, and session lengths
        run: node tests/exam-unified-interface-contract.test.js
      - name: Verify exam page script dependencies
        run: node tests/exam-page-script-contract.test.js
      - name: Verify dashboard routing and normalized question bank loading
        run: node tests/dashboard-question-routing.test.js
      - name: Test NGN partial-credit scoring
        if: always()
        run: node tests/ngn-scoring.test.js
      - name: Verify rebuilt NGN exam workspaces
        if: always()
        run: node tests/ngn-workspace-contract.test.js
      - name: Verify Help Center and release notes
        run: node tests/help-content-contract.test.js
      - name: Verify calendar test-date and shortcut features
        run: node tests/calendar-feature-contract.test.js
      - name: Verify question reporting and data backup
        run: node tests/reporting-backup-contract.test.js
          node tests/feedback-inbox.test.js
      - name: Test CAT adaptive decision engine
        if: always()
        run: node tests/cat-engine.test.js
      - name: Test all supported question renderers
        if: always()
        run: |
          node tests/shared-renderer.test.js
          node tests/clinical-prompt-normalizer.test.js
          node tests/quickrn-ngn-compat.test.js
      - name: Test question ID collision normalization
        if: always()
        run: node tests/question-id-normalizer.test.js
      - name: Verify production bank against shared renderer
        if: always()
        run: node tests/question-bank-renderer-contract.test.js
      - name: Validate production question bank
        if: always()
        run: node scripts/validate-question-bank.js questions.js
      - name: Upload real-bank validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickrn-real-bank-validation
          path: |
            reports/ngn-bank-validation.*
            reports/question-schema-v2-validation.*
          if-no-files-found: warn
