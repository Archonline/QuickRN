<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCLEX-RN Pearson VUE Simulator | CAT Adaptive Exam</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pv: {
                            navy: '#0b1d3a',
                            header: '#0a172c',
                            blue: '#02529c',
                            lightBg: '#edf2f7',
                            border: '#cbd5e1',
                            btnBlue: '#0055a5',
                            tabActive: '#ffffff',
                            tabInactive: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="questions.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-300 text-slate-900 antialiased h-screen flex flex-col overflow-hidden select-none">

    <!-- PEARSON VUE TOP HEADER -->
    <header class="bg-[#0b1b36] text-white px-4 py-2.5 flex justify-between items-center shadow-md border-b border-blue-900 shrink-0">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 font-extrabold text-xs px-2 py-0.5 rounded tracking-wider">NCLEX-RN</span>
                <span class="font-bold text-sm tracking-wide">Pearson VUE Simulator</span>
            </div>
            <div class="hidden md:flex items-center gap-2 text-xs text-slate-300 border-l border-slate-700 pl-4">
                <span>Candidate ID: <strong class="text-white font-mono-custom" id="candidate-id">RN-2026-8892</strong></span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-[#050f24] px-3 py-1 rounded border border-slate-700 text-xs font-mono-custom font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-regular fa-clock"></i>
                <span id="timer-display">05:00:00</span>
                <button onclick="toggleTimerVisibility()" class="text-slate-400 hover:text-white ml-1"><i id="timer-eye-icon" class="fa-solid fa-eye"></i></button>
            </div>
            <button onclick="toggleCalculator()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-semibold flex items-center gap-1.5 border border-slate-600 transition">
                <i class="fa-solid fa-calculator text-amber-400"></i> Calculator
            </button>
            <button onclick="toggleBookmarkCurrent()" id="flag-btn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded text-xs font-semibold flex items-center gap-1.5 border border-slate-600 transition">
                <i id="flag-icon" class="fa-regular fa-bookmark"></i> Flag for Review
            </button>
        </div>
    </header>

    <!-- MAIN TWO-PANE NGN WORKSPACE -->
    <main class="flex-grow flex p-3 gap-3 overflow-hidden">
        
        <!-- LEFT PANE: ELECTRONIC HEALTH RECORD (EHR) -->
        <section class="w-1/2 bg-white rounded-lg border border-slate-300 flex flex-col shadow-sm overflow-hidden">
            <div class="bg-slate-100 border-b border-slate-300 px-4 py-2 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-800">
                    <i class="fa-solid fa-notes-medical text-blue-700"></i>
                    <span>ELECTRONIC HEALTH RECORD (EHR)</span>
                </div>
                <div class="text-[11px] font-mono-custom bg-slate-200 px-2 py-0.5 rounded text-slate-700" id="patient-info">
                    Pt: Martinez, Leo | 7-year-old male | ID: MRN-78310
                </div>
            </div>

            <!-- EHR Navigation Tabs -->
            <div class="flex border-b border-slate-300 bg-slate-100 px-2 pt-2 gap-1 shrink-0 text-xs font-semibold">
                <button onclick="switchTab('nurses-notes')" id="tab-nurses-notes" class="px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-white text-blue-800 shadow-xs">
                    <i class="fa-solid fa-user-nurse mr-1"></i> Nurses' Notes
                </button>
                <button onclick="switchTab('vital-signs')" id="tab-vital-signs" class="px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-slate-200 text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-heart-pulse mr-1"></i> Vital Signs
                </button>
                <button onclick="switchTab('labs')" id="tab-labs" class="px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-slate-200 text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-vial mr-1"></i> Diagnostics / Labs
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-slate-200 text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-file-medical mr-1"></i> History & Physical
                </button>
            </div>

            <!-- EHR Tab Content -->
            <div class="p-4 flex-grow overflow-y-auto text-xs leading-relaxed text-slate-800 bg-white" id="ehr-content">
                <div id="tab-content-container">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

        <!-- RIGHT PANE: NGN QUESTION & RESPONSE WORKSPACE -->
        <section class="w-1/2 bg-white rounded-lg border border-slate-300 flex flex-col shadow-sm overflow-hidden">
            <!-- Item Header & NCJMM Focus -->
            <div class="bg-slate-100 border-b border-slate-300 px-4 py-2 flex justify-between items-center shrink-0">
                <span id="ngn-badge" class="bg-blue-800 text-white px-2.5 py-0.5 rounded font-extrabold text-[11px] uppercase tracking-wider">
                    EXTENDED MULTIPLE RESPONSE
                </span>
                <span id="ncjmm-focus" class="text-xs text-slate-600 font-medium">
                    NCJMM Focus: Recognize Cues
                </span>
            </div>

            <div class="p-5 flex-grow overflow-y-auto flex flex-col justify-between" id="question-workspace">
                <div id="question-container" class="space-y-4">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- PEARSON VUE BOTTOM FOOTER BAR -->
    <footer class="bg-[#0b1b36] border-t border-slate-700 px-4 py-2.5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <button id="btn-prev" onclick="previousQuestion()" class="px-5 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded transition border border-slate-500 flex items-center gap-1">
                <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="px-5 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded transition border border-slate-500 flex items-center gap-1">
                Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>

        <div class="flex items-center gap-3">
            <button id="btn-submit" onclick="submitAnswer()" class="px-6 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded text-xs shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-check"></i> Submit Response
            </button>
            <button onclick="window.location.href='dashboard.html'" class="px-4 py-1.5 bg-rose-700 hover:bg-rose-600 text-white text-xs font-bold rounded transition border border-rose-500">
                End Exam
            </button>
        </div>
    </footer>

    <!-- CALCULATOR MODAL -->
    <div id="calc-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 text-white rounded-xl p-4 max-w-xs w-full shadow-2xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-amber-400"><i class="fa-solid fa-calculator"></i> Calculator</span>
                <button onclick="toggleCalculator()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="calc-display" readonly value="0" class="w-full bg-slate-950 text-right px-3 py-2 rounded text-lg font-mono-custom text-emerald-400 border border-slate-800 focus:outline-none">
            <div class="grid grid-cols-4 gap-2 text-xs font-bold">
                <button onclick="calcInput('C')" class="col-span-2 p-2.5 bg-rose-700 hover:bg-rose-600 rounded">C</button>
                <button onclick="calcInput('/')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded">÷</button>
                <button onclick="calcInput('*')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded">×</button>
                <button onclick="calcInput('7')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">7</button>
                <button onclick="calcInput('8')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">8</button>
                <button onclick="calcInput('9')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">9</button>
                <button onclick="calcInput('-')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded">-</button>
                <button onclick="calcInput('4')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">4</button>
                <button onclick="calcInput('5')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">5</button>
                <button onclick="calcInput('6')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">6</button>
                <button onclick="calcInput('+')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded">+</button>
                <button onclick="calcInput('1')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">1</button>
                <button onclick="calcInput('2')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">2</button>
                <button onclick="calcInput('3')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">3</button>
                <button onclick="calcEquals()" class="row-span-2 p-2.5 bg-emerald-600 hover:bg-emerald-500 rounded flex items-center justify-center">=</button>
                <button onclick="calcInput('0')" class="col-span-2 p-2.5 bg-slate-800 hover:bg-slate-700 rounded">0</button>
                <button onclick="calcInput('.')" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded">.</button>
            </div>
        </div>
    </div>

    <script>
        let timerSeconds = 5 * 60 * 60;
        let timerVisible = true;
        let activeTab = 'nurses-notes';
        let rawQuestionPool = [];
        let catHistory = [];
        let currentQuestion = null;
        let selectedAnswers = new Set();
        let isSubmitted = false;

        function startTimer() {
            setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    if (timerVisible) {
                        const h = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
                        const m = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
                        const s = String(timerSeconds % 60).padStart(2, '0');
                        document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
                    }
                }
            }, 1000);
        }

        function toggleTimerVisibility() {
            timerVisible = !timerVisible;
            document.getElementById('timer-display').innerText = timerVisible ? "05:00:00" : "--:--:--";
            document.getElementById('timer-eye-icon').className = timerVisible ? "fa-solid fa-eye" : "fa-solid fa-eye-slash";
        }

        function switchTab(tabId) {
            activeTab = tabId;
            ['nurses-notes', 'vital-signs', 'labs', 'history'].forEach(id => {
                const btn = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    btn.className = "px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-white text-blue-800 shadow-xs font-bold";
                } else {
                    btn.className = "px-3 py-1.5 rounded-t border-t border-x border-slate-300 bg-slate-200 text-slate-600 hover:bg-slate-100 font-semibold";
                }
            });
            renderEHRContent();
        }

        function renderEHRContent() {
            const container = document.getElementById('tab-content-container');
            if (activeTab === 'nurses-notes') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="p-2 bg-slate-100 rounded border border-slate-200 font-semibold">Emergency Department Admission Note</div>
                        <p>7-year-old male brought in by parents for acute shortness of breath, audible wheezing, and tight non-productive cough. Parents report history of mild persistent asthma managed with albuterol MDI as needed.</p>
                        <p>Upon physical assessment: Intercostal retractions noted, prolonged expiratory phase, oxygen saturation dropping on room air. Speaks in single-word utterances.</p>
                    </div>
                `;
            } else if (activeTab === 'vital-signs') {
                container.innerHTML = `
                    <table class="w-full text-left border-collapse border border-slate-200">
                        <tr class="bg-slate-100"><th class="p-2 border border-slate-200">Parameter</th><th class="p-2 border border-slate-200">Value</th></tr>
                        <tr><td class="p-2 border border-slate-200">Heart Rate</td><td class="p-2 border border-slate-200">132 bpm</td></tr>
                        <tr><td class="p-2 border border-slate-200">Respiratory Rate</td><td class="p-2 border border-slate-200">34 breaths/min</td></tr>
                        <tr><td class="p-2 border border-slate-200">Blood Pressure</td><td class="p-2 border border-slate-200">104/68 mmHg</td></tr>
                        <tr><td class="p-2 border border-slate-200">SpO2</td><td class="p-2 border border-slate-200">89% on Room Air</td></tr>
                    </table>
                `;
            } else if (activeTab === 'labs') {
                container.innerHTML = `
                    <div class="space-y-2">
                        <p><strong>Arterial Blood Gas (ABG):</strong> pH 7.31, PaCO2 48 mmHg, PaO2 62 mmHg, HCO3 24 mEq/L</p>
                        <p><strong>WBC Count:</strong> 8,500 /mcL</p>
                    </div>
                `;
            } else if (activeTab === 'history') {
                container.innerHTML = `<p>Diagnosed with mild persistent asthma at age 5. No known drug allergies (NKDA). Immunizations up to date.</p>`;
            }
        }

        function loadPool() {
            let pool = (typeof embeddedQuestionsData !== 'undefined' && embeddedQuestionsData) || (typeof questions !== 'undefined' && questions) || [];
            rawQuestionPool = pool.length ? pool : [
                {
                    id: 'ngn-1',
                    questionText: 'Select All Cues Indicating Severe Airway Obstruction',
                    prompt: 'The nurse assesses a 7-year-old child in the Emergency Department. Which of the following assessment findings require immediate emergency intervention? Select all that apply.',
                    options: [
                        'Intercostal and suprasternal retractions during inhalation',
                        'Inability to speak full sentences (single-word utterances)',
                        'Silent chest with absence of audible breath sounds bilaterally',
                        'Dry hacking cough with mild clear rhinorrhea',
                        'Inspiratory stridor and tracheal tugging',
                        'Oxygen saturation 89% on room air'
                    ],
                    correctAnswers: ['Intercostal and suprasternal retractions during inhalation', 'Inability to speak full sentences (single-word utterances)', 'Silent chest with absence of audible breath sounds bilaterally', 'Inspiratory stridor and tracheal tugging', 'Oxygen saturation 89% on room air']
                }
            ];
            currentQuestion = rawQuestionPool[0];
            renderQuestion();
            startTimer();
            switchTab('nurses-notes');
        }

        function renderQuestion() {
            if (!currentQuestion) return;
            selectedAnswers.clear();
            isSubmitted = false;

            let html = `
                <div class="space-y-3">
                    <h2 class="text-sm font-bold text-slate-900 leading-snug">${currentQuestion.questionText}</h2>
                    <p class="text-xs text-slate-600 italic">${currentQuestion.prompt || 'Select all that apply.'}</p>
                    <div class="space-y-2 pt-2">
            `;

            currentQuestion.options.forEach((opt, idx) => {
                html += `
                    <label class="flex items-start gap-3 p-3 rounded border border-slate-200 bg-slate-50 hover:bg-blue-50/50 cursor-pointer transition">
                        <input type="checkbox" onchange="toggleSelect('${opt}')" class="mt-0.5 rounded border-slate-400 text-blue-700 focus:ring-blue-500 w-4 h-4">
                        <span class="text-xs text-slate-800 leading-snug">${opt}</span>
                    </label>
                `;
            });

            html += `</div></div>`;
            document.getElementById('question-container').innerHTML = html;
        }

        function toggleSelect(val) {
            if (selectedAnswers.has(val)) selectedAnswers.delete(val);
            else selectedAnswers.add(val);
        }

        function submitAnswer() {
            if (selectedAnswers.size === 0) {
                alert("Please select at least one option before submitting.");
                return;
            }
            alert("Response submitted successfully!");
        }

        function toggleCalculator() { document.getElementById('calc-modal').classList.toggle('hidden'); }
        function calcInput(v) { const d = document.getElementById('calc-display'); d.value = d.value === '0' ? v : d.value + v; }
        function calcEquals() { const d = document.getElementById('calc-display'); try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; } }
        function toggleBookmarkCurrent() { document.getElementById('flag-icon').classList.toggle('fa-solid'); }

        window.onload = loadPool;
    </script>
</body>
</html>
