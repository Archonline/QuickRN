        // UTILITY FUNCTIONS
        function cleanQuestionText(text, q = {}) {
            if (!text) return '';
            let cleaned = String(text).replace(/^\s*\[[^\]]+\]\s*/, '').replace(/^\s*(?:NGN|STANDARD|CATEGORY\s*:[^:]+)\s*[-:|]\s*/i, '').trim();
            for (const prefix of [q.category, q.topic, q.ngnType, q.type]) { if (prefix && cleaned.toLowerCase().startsWith(String(prefix).toLowerCase())) { const rest=cleaned.slice(String(prefix).length); if (/^\s*[-:|]\s*/.test(rest)) cleaned=rest.replace(/^\s*[-:|]\s*/, ''); } }
            const sentences = cleaned.split(/(?<=[.?!])\s+/);
            const unique = [];
            sentences.forEach(sentence => { const t=sentence.trim(); if(t&&!unique.includes(t))unique.push(t); });
            return unique.join(' ');
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // Detect correct NGN type from item properties if not explicitly specified
        function detectNGNType(q) {
            // Keep Self Study aligned with CAT, Timed, and Predictor item classification.
            // The shared renderer owns the canonical NGN format contract.
            if (window.QuickRNSharedRenderer && typeof window.QuickRNSharedRenderer.detect === "function") {
                return window.QuickRNSharedRenderer.detect(q || {});
            }
            return "Single Choice";
        }

        function getStrategyRule(item) {
            if (item.strategyRule) return item.strategyRule;
            const text = `${item.category || ""} ${item.title || ""} ${item.keyPhrase || ""}`.toLowerCase();
            if (/airway|respiratory|asthma|stridor|oxygen|copd/.test(text)) return "Strategy: prioritize airway patency and breathing first. Assess work of breathing, oxygen saturation, mental status, and signs of exhaustion; a silent chest or worsening hypoxemia is an emergency.";
            if (/cardiac|heart failure|chest pain|pulmonary embol|digoxin|shock|hemodynamic/.test(text)) return "Strategy: assess circulation and perfusion. Look for hypotension, altered mentation, chest pain, dysrhythmias, and poor oxygenation. Stabilize ABCs, verify orders and contraindications, then reassess response.";
            if (/diabetes|ketoacidosis|glucose|insulin|hypoglyc|hyperglyc/.test(text)) return "Strategy: check glucose and potassium before insulin decisions. In DKA, restore circulating volume first, assess potassium, then administer insulin per protocol and add dextrose as glucose falls while continuing to correct acidosis.";
            if (/maternal|pregnan|placenta|labor|fetal|cord/.test(text)) return "Strategy: prioritize maternal stabilization and fetal oxygenation. For suspected cord prolapse, relieve pressure on the cord, call for emergency assistance, and prepare for urgent birth; do not leave the client alone.";
            if (/electrolyte|thyroid|adrenal|addison|cushing|calcium|potassium/.test(text)) return "Strategy: connect the symptoms to the specific electrolyte or hormone imbalance, identify immediate threats (airway, cardiac rhythm, neurologic status), and verify critical laboratory values before giving high-risk medications.";
            if (/infection|isolation|diphtheria|pertussis|sepsis/.test(text)) return "Strategy: recognize instability early, initiate the appropriate transmission-based precautions, obtain ordered cultures when this will not delay urgent treatment, and monitor for sepsis or respiratory compromise.";
            if (/medication|pharmacology|digoxin|heparin|drug/.test(text)) return "Strategy: apply medication safety checks—right patient, drug, dose, route, time, allergies, relevant labs, vital signs, and contraindications. Hold and escalate when findings suggest toxicity or an unsafe parameter.";
            return "Strategy: identify the most concerning cue, determine whether the problem is acute or life-threatening, prioritize ABCs and safety, choose the action that addresses the cause, and reassess whether the intervention worked.";
        }
        function getTutorInsight(item) {
            if (window.QuickRNCoach) {
                const insight = window.QuickRNCoach.buildTutorInsight(item);
                return insight.guidance + ' ' + insight.outcome;
            }
            if (item.aiTutorInsight) return `${item.aiTutorInsight} Apply clinical judgment by connecting the cue to its physiologic cause, deciding which complication is most dangerous if untreated, and choosing the intervention that changes the risk fastest. Recheck the relevant vital sign, assessment finding, or laboratory value after the intervention. For distractors, ask whether the option delays urgent care, treats a less important problem first, or could worsen the client’s condition.`;
            const topic = item.keyPhrase || item.title || item.category || "this clinical concept";
            return `Clinical reasoning focus for ${topic}: separate expected findings from red flags, then link each abnormal cue to the underlying physiology. Ask what can deteriorate first, which intervention prevents the greatest harm, and what parameter will show improvement or worsening. Eliminate options that delay stabilization, treat only a symptom while ignoring the cause, or introduce a contraindicated risk. After choosing, reassess the client and anticipate the next nursing action.`;
        }

        // MAIN REACT APPLICATION COMPONENT
        function App() {
            const [showLaunchModal, setShowLaunchModal] = useState(true);
            const [activePool, setActivePool] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [currentDraftAnswer, setCurrentDraftAnswer] = useState({});
            const [flaggedItems, setFlaggedItems] = useState(new Set());
            const [showCalculator, setShowCalculator] = useState(false);
            const [calcDisplay, setCalcDisplay] = useState("0");
            const [activeEhrTab, setActiveEhrTab] = useState("notes");
            const [showResults, setShowResults] = useState(false);
            const [activeVideoModal, setActiveVideoModal] = useState(null);
            const [showReportModal, setShowReportModal] = useState(false);
            const [videoNotes, setVideoNotes] = useState({});

            // Launch Exam Session
            const launchSession = (count) => {
                let rawPool = defaultQBank;
                if (typeof window.questions !== 'undefined' && Array.isArray(window.questions) && window.questions.length > 0) {
                    rawPool = window.questions;
                } else if (typeof embeddedQuestionsData !== 'undefined' && Array.isArray(embeddedQuestionsData) && embeddedQuestionsData.length > 0) {
                    rawPool = embeddedQuestionsData;
                }

                const normalized = rawPool.map((q, idx) => {
                    const detectedType = detectNGNType(q);
                    const isNGNItem = q.isNGN || detectedType !== "Single Choice";
                    return {
                        ...q,
                        id: q.id || `Q-${idx + 1}`,
                        isNGN: isNGNItem,
                        cleanTitle: cleanQuestionText(q.title || q.promptTitle || q.question || `NCLEX Item ${idx + 1}`, q),
                        cleanInstruction: cleanQuestionText(q.instruction || q.question || "Evaluate clinical findings and select the appropriate action(s).", q),
                        ngnType: detectedType,
                        keyPhrase: q.keyPhrase || q.category || q.topic || "Clinical Nursing Concept"
                    };
                });

                // Load previously answered question IDs to avoid repeats
                let usedIds = JSON.parse(localStorage.getItem('quickrn_used_q_ids') || '[]');
                let available = normalized.filter(q => !usedIds.includes(q.id));

                if (available.length === 0) {
                    alert("You have exhausted all questions in this bank. Your question history has been reset for a new review cycle.");
                    localStorage.removeItem('quickrn_used_q_ids');
                    usedIds = [];
                    available = normalized;
                }

                // Balance pool to ensure NGN items are present
                const ngnItems = available.filter(q => q.isNGN);
                const tradItems = available.filter(q => !q.isNGN);

                let selected = [];
                const targetCount = (count === 'all' || count >= available.length) ? available.length : count;

                if (count === 'all') {
                    selected = shuffleArray(available);
                } else {
                    const minNGN = Math.min(ngnItems.length, Math.ceil(targetCount * 0.35));
                    const selectedNGN = shuffleArray(ngnItems).slice(0, minNGN);
                    const remainingNeeded = targetCount - selectedNGN.length;

                    const remainingPool = [...tradItems, ...ngnItems.filter(q => !selectedNGN.includes(q))];
                    const selectedOther = shuffleArray(remainingPool).slice(0, remainingNeeded);

                    selected = shuffleArray([...selectedNGN, ...selectedOther]);
                }

                setActivePool(selected);
                setCurrentIndex(0);
                setUserAnswers({});
                setCurrentDraftAnswer({});
                setShowLaunchModal(false);
                setShowResults(false);
            };

            const currentItem = activePool[currentIndex];
            const currentSavedState = userAnswers[currentIndex];
            const isSubmitted = currentSavedState?.submitted;

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const handleNext = () => {
                if (currentIndex < activePool.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    finishExam();
                }
            };

            const exitToDashboard = () => {
                window.location.href = 'dashboard.html';
            };

            const toggleBookmark = (id) => {
                setFlaggedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const evaluateScore = (item, ans) => {
                const draft = window.QuickRNSharedRenderer?.toDraft
                    ? window.QuickRNSharedRenderer.toDraft(item, ans)
                    : ans;
                const result = window.QuickRNNgnScoring.grade(item, draft);
                return { earned: result.earned, max: result.max, isCorrect: result.isCorrect };
            };

            const handleSubmitAnswer = () => {
                const draft = currentDraftAnswer[currentIndex];
                if (!draft) {
                    alert("Please select or enter an answer before submitting.");
                    return;
                }

                if (userAnswers[currentIndex]?.submitted) return;
                const scoreRes = evaluateScore(currentItem, draft);
                const isCorrect = scoreRes.earned === scoreRes.max;
                if (window.QuickRNQuestionMetrics) window.QuickRNQuestionMetrics.record(currentItem,isCorrect,'Self Study');
                if (window.QuickRNCoach) window.QuickRNCoach.recordClientNeedAttempt(currentItem, isCorrect);

                setUserAnswers(prev => ({
                    ...prev,
                    [currentIndex]: {
                        answer: draft,
                        submitted: true,
                        score: scoreRes.earned,
                        maxScore: scoreRes.max,
                        isCorrect
                    }
                }));

                // Record used question ID
                let usedIds = JSON.parse(localStorage.getItem('quickrn_used_q_ids') || '[]');
                if (!usedIds.includes(currentItem.id)) {
                    usedIds.push(currentItem.id);
                    localStorage.setItem('quickrn_used_q_ids', JSON.stringify(usedIds));
                }
            };

            const finishExam = () => {
                setShowResults(true);
            };

            const handleCalc = (val) => {
                if (val === 'C') setCalcDisplay('0');
                else if (val === '=') {
                    try { setCalcDisplay(window.QuickRNCoach.safeCalculate(calcDisplay.replace(/%/g, '/100')).toString()); }
                    catch { setCalcDisplay('Error'); }
                } else if (val === '+/-') {
                    setCalcDisplay(prev => prev === '0' ? '0' : (prev.startsWith('-') ? prev.slice(1) : '-' + prev));
                } else {
                    setCalcDisplay(prev => prev === '0' || prev === 'Error' ? val : prev + val);
                }
            };

            // Summary Evaluation Data
            const summaryStats = useMemo(() => {
                let totalEarned = 0;
                let totalMax = 0;
                activePool.forEach((q, idx) => {
                    const ansState = userAnswers[idx];
                    if (ansState && ansState.submitted) {
                        totalEarned += ansState.score || 0;
                        totalMax += ansState.maxScore || 1;
                    }
                });
                const percentage = totalMax > 0 ? Math.round((totalEarned / totalMax) * 100) : 0;
                const submitted = Object.values(userAnswers).filter(x=>x && x.submitted);
                const correctCount = submitted.filter(x=>x.isCorrect).length;
                const wrongCount = submitted.length-correctCount;
                const passed = percentage >= 75;
                return { totalEarned, totalMax, percentage, passed, answeredCount:submitted.length, correctCount, wrongCount };
            }, [activePool, userAnswers]);

            // Sorted list of questions for review (incorrect/unanswered first)
            const sortedQuestionsForReview = useMemo(() => {
                return activePool.map((q, idx) => ({
                    question: q,
                    index: idx,
                    savedState: userAnswers[idx]
                })).sort((a, b) => {
                    const aCorrect = a.savedState?.isCorrect ? 1 : 0;
                    const bCorrect = b.savedState?.isCorrect ? 1 : 0;
                    return aCorrect - bCorrect;
                });
            }, [activePool, userAnswers]);

            return (
                <div className="flex flex-col h-full w-full select-none">
                    
                    {/* LAUNCH / ITEM COUNT SELECTION MODAL */}
                    {showLaunchModal && (
                        <div className="fixed inset-0 bg-slate-900/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 md:p-8 space-y-6 text-center border border-slate-300 relative">
                                <div className="w-16 h-16 bg-blue-50 text-ncsbn-blue rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                                    <i className="fa-solid fa-user-nurse"></i>
                                </div>
                                <div className="space-y-2">
                                    <h1 className="text-2xl font-black text-slate-900">QuickRN Self Study Mode</h1>
                                    <p className="text-xs md:text-sm text-slate-600">Select the number of questions to load. Includes Matrix Grids, Cloze, Drag & Drop, Bowtie, SATA, and Single Choice.</p>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {[20, 60, 85, 150].map(cnt => (
                                        <button key={cnt} onClick={() => launchSession(cnt)} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center">
                                            <span className="text-xl font-black text-ncsbn-blue">{cnt}</span>
                                            <span className="text-[11px] text-slate-500 font-normal">Questions</span>
                                        </button>
                                    ))}
                                    <button onClick={() => launchSession('all')} className="p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 rounded-xl font-bold text-slate-800 text-sm transition shadow-xs flex flex-col items-center col-span-2 sm:col-span-1">
                                        <span className="text-xl font-black text-amber-600">ALL</span>
                                        <span className="text-[11px] text-slate-500 font-normal">Full Q-Bank</span>
                                    </button>
                                </div>
                                <button onClick={exitToDashboard} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                                    Exit to Dashboard
                                </button>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION HEADER */}
                    <header className="bg-[#0B2240] text-white h-14 px-4 flex items-center justify-between border-b-2 border-amber-600 shadow-md shrink-0 z-30">
                        <button onClick={exitToDashboard} className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-100 rounded-lg text-xs font-bold transition border border-slate-600">
                            <i className="fa-solid fa-user-nurse text-amber-400"></i>
                            <span className="text-sm font-semibold tracking-wide">QuickRN Self Study Mode</span>
                        </button>

                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-slate-800 px-3 py-1 rounded border border-slate-600 text-xs text-slate-200 font-mono">
                                Item <span className="font-bold text-amber-400">{currentIndex + 1}</span> of <span className="font-bold text-white">{activePool.length}</span>
                            </div>
                            <button onClick={() => setShowCalculator(!showCalculator)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className="fa-solid fa-calculator text-blue-400"></i>
                                <span className="hidden md:inline">Calculator</span>
                            </button>
                            <button onClick={() => currentItem && toggleBookmark(currentItem.id)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className={`fa-solid fa-bookmark ${currentItem && flaggedItems.has(currentItem.id) ? 'text-amber-400' : 'text-slate-400'}`}></i>
                                <span className="hidden md:inline">Bookmark</span>
                            </button>
                            <button onClick={() => setShowReportModal(true)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 text-xs text-slate-200 transition flex items-center gap-1.5">
                                <i className="fa-solid fa-flag text-rose-400"></i>
                                <span className="hidden md:inline">Report Item</span>
                            </button>
                            <button onClick={exitToDashboard} className="px-3 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
                                <i className="fa-solid fa-right-from-bracket"></i>
                                <span>Exit</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN TEST WORKSPACE */}
                    {!showResults && currentItem && (
                        <main className="nclex-workspace flex-1 flex flex-col md:flex-row overflow-hidden p-2 gap-2 relative">
                            
                            {/* LEFT EHR PANEL (IF PRESENT) */}
                            {currentItem.ehr && (
                                <section className="w-full md:w-[40%] bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-hidden min-h-[280px] md:min-h-0 md:h-full">
                                    <div className="bg-slate-100 border-b border-slate-300 px-4 py-2 flex items-center justify-between shrink-0 text-xs md:text-sm font-bold text-slate-800">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-hospital-user text-ncsbn-blue"></i>
                                            <span>ELECTRONIC HEALTH RECORD (EHR)</span>
                                        </div>
                                        <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-mono font-semibold text-xs">
                                            Pt: {currentItem.patientInfo?.name || "Standard Client"}
                                        </span>
                                    </div>
                                    <div className="bg-slate-200/70 px-2 pt-2 border-b border-slate-300 flex gap-1 text-xs font-semibold text-slate-600 shrink-0">
                                        {[
                                            { id: 'notes', label: "Nurses' Notes", icon: 'fa-user-nurse', val: currentItem.ehr.nursesNotes },
                                            { id: 'vitals', label: 'Vital Signs', icon: 'fa-heart-pulse', val: currentItem.ehr.vitalSigns },
                                            { id: 'labs', label: 'Diagnostics', icon: 'fa-vial', val: currentItem.ehr.diagnosticResults },
                                            { id: 'hp', label: 'H&P', icon: 'fa-notes-medical', val: currentItem.ehr.historyPhysical }
                                        ].map(tab => tab.val && (
                                            <button key={tab.id} onClick={() => setActiveEhrTab(tab.id)} className={`px-3 py-1.5 rounded-t-lg transition flex items-center gap-1.5 ${activeEhrTab === tab.id ? 'bg-white text-ncsbn-blue border-t-2 border-ncsbn-blue font-bold shadow-xs' : 'text-slate-600 hover:bg-slate-300/50'}`}>
                                                <i className={`fa-solid ${tab.icon}`}></i> {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="ehr-readable flex-1 p-4 overflow-y-auto text-base text-slate-800 leading-relaxed bg-white" dangerouslySetInnerHTML={{ __html: currentItem.ehr[activeEhrTab === 'notes' ? 'nursesNotes' : (activeEhrTab === 'vitals' ? 'vitalSigns' : (activeEhrTab === 'labs' ? 'diagnosticResults' : 'historyPhysical'))] }}></div>
                                </section>
                            )}

                            {/* RIGHT QUESTION & RATIONALE PANEL */}
                            <section className={`nclex-question-panel w-full ${currentItem.ehr ? 'md:w-[60%]' : 'w-full'} bg-white rounded-lg shadow-sm border border-slate-300 flex flex-col overflow-visible md:overflow-y-auto min-h-0`}>
                                
                                {isSubmitted && (
                                    <div className="bg-emerald-100 border-b border-emerald-200 px-4 py-1.5 text-xs text-emerald-800 font-bold flex items-center justify-between shrink-0">
                                        <span><i className="fa-solid fa-check-circle mr-1 text-emerald-600"></i> Answer Evaluated</span>
                                        <span className="font-mono text-emerald-900">Score: {currentSavedState.score}/{currentSavedState.maxScore}</span>
                                    </div>
                                )}

                                <div className="p-4 md:p-6 bg-slate-50/90 border-b border-slate-200 shrink-0 space-y-2">
                                    <h2 className="prompt-typography">{currentItem.cleanTitle}</h2>
                                    <p className="text-xs md:text-sm text-slate-600 italic font-medium">{currentItem.cleanInstruction}</p>
                                </div>

                                {/* QUESTION INTERACTIVE CONTENT AREA */}
                                <div className="nclex-question-content flex-1 p-4 md:p-6 overflow-visible bg-white text-slate-800 space-y-4">
                                    <QuestionRenderer 
                                        item={currentItem} 
                                        draftAnswer={currentDraftAnswer[currentIndex]}
                                        savedState={currentSavedState} 
                                        onUpdateDraft={(ans) => setCurrentDraftAnswer(prev => ({ ...prev, [currentIndex]: ans }))}
                                    />

                                    {/* SUBMIT BUTTON */}
                                    {!isSubmitted && (
                                        <div className="pt-4 border-t border-slate-200 flex justify-end">
                                            <button onClick={handleSubmitAnswer} className="px-6 py-2.5 bg-ncsbn-blue hover:bg-blue-700 text-white rounded-xl text-xs md:text-sm font-bold shadow-md transition flex items-center gap-2">
                                                <i className="fa-solid fa-paper-plane"></i> Submit Answer
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* COMPACT COLLAPSIBLE RATIONALE PANEL */}
                                {isSubmitted && (
                                    <div className="nclex-rationale border-t-2 border-blue-600 bg-blue-50/90 p-4 shrink-0 shadow-inner">
                                        <div className="flex items-center justify-between border-b border-blue-200 pb-2 mb-3">
                                            <span className="font-bold text-ncsbn-navy text-xs md:text-sm flex items-center gap-2">
                                                <i className="fa-solid fa-microscope text-blue-600"></i> Clinical Rationale & Learning Objectives
                                            </span>
                                            <div className="flex items-center gap-2">

                                                <button onClick={() => setActiveVideoModal({ videos: window.QuickRNYoutube.getTwoVideos(currentItem), title: window.QuickRNYoutube.getDisplayTopic(currentItem) })} className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold transition flex items-center gap-1 shadow-xs">
                                                    <i className="fa-brands fa-youtube"></i> Video Lectures
                                                </button>
                                            </div>
                                        </div>
                                            <div className="space-y-3 text-sm md:text-base">
                                                <div className="leading-relaxed bg-white p-3 rounded-lg border border-blue-200 text-slate-800">
                                                    <strong>Pathophysiology Rationale:</strong> {currentItem.rationale}
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                                                    <div className="bg-white p-3 rounded-lg border border-amber-300 space-y-1">
                                                        <strong className="text-amber-900 font-bold block"><i className="fa-solid fa-lightbulb text-amber-500 mr-1"></i> Strategy Rule:</strong>
                                                        <span className="text-slate-800 leading-relaxed">{getStrategyRule(currentItem)}</span>
                                                    </div>
                                                    <div className="bg-indigo-50 p-3 rounded-lg border border-indigo-200 space-y-1">
                                                        <strong className="text-indigo-950 font-bold block"><i className="fa-solid fa-robot text-indigo-600 mr-1"></i> Clinical Study Coach:</strong>
                                                        <span className="text-slate-800 leading-relaxed">{getTutorInsight(currentItem)}</span>
                                                    </div>
                                                </div>
                                            </div>

                                    </div>
                                )}
                            </section>
                        </main>
                    )}

                    {/* RESULTS SUMMARY SCREEN */}
                    {showResults && (
                        <div className="flex-1 bg-slate-900 text-white p-4 md:p-6 overflow-y-auto">
                            <div className="max-w-5xl mx-auto space-y-6 py-4">
                                <div className="text-center space-y-2">
                                    <div className={`inline-flex items-center gap-2 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${summaryStats.passed ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                                        <i className={`fa-solid ${summaryStats.passed ? 'fa-circle-check' : 'fa-circle-xmark'}`}></i> 
                                        {summaryStats.passed ? 'EXAM PASSED (Strict 75% Cutoff)' : 'EXAM FAILED (Below 75% Cutoff)'}
                                    </div>
                                    <h1 className="text-2xl md:text-3xl font-extrabold">Evaluation & Summary Report</h1>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Questions Correct</span>
                                        <div className="text-4xl font-black my-2 text-emerald-400">{summaryStats.correctCount}</div>
                                        <span className="text-xs text-slate-300">Submitted answers</span>
                                    </div>
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Questions Wrong</span>
                                        <div className="text-4xl font-black my-2 text-rose-400">{summaryStats.wrongCount}</div>
                                        <span className="text-xs text-slate-300">Submitted answers</span>
                                    </div>
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Overall Performance</span>
                                        <div className={`text-4xl md:text-5xl font-black my-2 ${summaryStats.passed ? 'text-emerald-400' : 'text-rose-400'}`}>
                                            {summaryStats.percentage}%
                                        </div>
                                        <span className="text-xs text-slate-300">Earned {summaryStats.totalEarned} / {summaryStats.totalMax} Points</span>
                                    </div>
                                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Passing Benchmark Status</span>
                                        <div className={`text-4xl md:text-5xl font-black my-2 ${summaryStats.passed ? 'text-emerald-400' : 'text-rose-400'}`}>
                                            {summaryStats.passed ? 'PASS' : 'FAIL'}
                                        </div>
                                        <span className="text-xs text-slate-400">Passing standard requires 75% mastery</span>
                                    </div>
                                </div>

                                {/* FULL DETAILED QUESTION REVIEW LIST */}
                                <div className="space-y-4 pt-4">
                                    <h2 className="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center justify-between">
                                        <span>Full Question Review</span>
                                        <span className="text-xs text-slate-400 font-normal">Review missed items below</span>
                                    </h2>

                                    {sortedQuestionsForReview.map(({ question, index, savedState }) => {
                                        const isCorrect = savedState?.isCorrect;
                                        const qMetrics = window.QuickRNQuestionMetrics ? window.QuickRNQuestionMetrics.get(question.id) : {correct:0,wrong:0,attempts:0};
                                        return (
                                            <div key={question.id} className={`p-5 rounded-xl border ${isCorrect ? 'bg-slate-800/80 border-emerald-500/40' : 'bg-slate-800/90 border-rose-500/50'} space-y-3`}>
                                                <div className="flex items-start justify-between gap-4">
                                                    <div className="space-y-1">
                                                        <div className="flex items-center gap-2">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase ${isCorrect ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                                                                {isCorrect ? 'Correct' : 'Incorrect / Unanswered'}
                                                            </span>
                                                            <span className="text-xs text-slate-400 font-mono">Item #{index + 1}</span>
                                                        </div>
                                                        <h3 className="text-sm font-bold text-slate-100">{question.cleanTitle}</h3>
                                                        <p className="text-[10px] text-slate-400 mt-1">Tracked attempts in this browser: <strong className="text-emerald-400">{qMetrics.correct} correct</strong> · <strong className="text-rose-400">{qMetrics.wrong} incorrect</strong></p>
                                                        <p className="text-xs text-slate-400 italic">{question.cleanInstruction}</p>
                                                    </div>
                                                    <button onClick={() => toggleBookmark(question.id)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded text-slate-300">
                                                        <i className={`fa-solid fa-bookmark ${flaggedItems.has(question.id) ? 'text-amber-400' : ''}`}></i>
                                                    </button>
                                                </div>

                                                <div className="bg-slate-900/60 p-3 rounded-lg text-xs space-y-1.5 border border-slate-700">
                                                    <div>
                                                        <strong className="text-slate-400 block">Correct Answer Key:</strong>
                                                        <span className="text-emerald-400 font-semibold">{JSON.stringify(question.correctAnswer || question.correctAnswerText || question.correctAnswers || question.correctOrder)}</span>
                                                    </div>
                                                    <div>
                                                        <strong className="text-slate-400 block">Pathophysiology Rationale:</strong>
                                                        <p className="text-slate-300 leading-relaxed">{question.rationale}</p>
                                                    </div>
                                                </div>

                                                <div className="flex justify-end">
                                                    <button onClick={() => setActiveVideoModal({ videos: window.QuickRNYoutube.getTwoVideos(question), title: window.QuickRNYoutube.getDisplayTopic(question) })} className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold transition flex items-center gap-1.5">
                                                        <i className="fa-brands fa-youtube"></i> Watch Video Lecture
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex justify-center gap-4 pt-6">
                                    <button onClick={() => setShowLaunchModal(true)} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-sm flex items-center gap-2">
                                        <i className="fa-solid fa-rotate-right"></i> Start New Session
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER NAVIGATION */}
                    {!showResults && (
                        <footer className="bg-[#0B2240] text-white px-4 py-3 flex items-center justify-between border-t border-slate-700 shrink-0 select-none z-30">
                            <button onClick={handlePrev} disabled={currentIndex === 0} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition flex items-center gap-1.5 disabled:opacity-40">
                                <i className="fa-solid fa-chevron-left"></i> Previous
                            </button>
                            <button onClick={handleNext} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                                {currentIndex === activePool.length - 1 ? 'Finish Exam' : 'Next'} <i className="fa-solid fa-chevron-right"></i>
                            </button>
                        </footer>
                    )}

                    {/* CALCULATOR MODAL */}
                    {showCalculator && (
                        <div className="absolute top-16 right-6 bg-slate-800 text-white rounded-xl shadow-2xl border border-slate-600 w-64 z-40 overflow-hidden">
                            <div className="bg-slate-900 px-3 py-2 flex items-center justify-between text-xs font-bold border-b border-slate-700">
                                <span><i className="fa-solid fa-calculator text-blue-400 mr-1.5"></i> Calculator</span>
                                <button onClick={() => setShowCalculator(false)}><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            <div className="p-3">
                                <input type="text" readOnly value={calcDisplay} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-right text-xl font-mono text-emerald-400 mb-3 focus:outline-none"/>
                                <div className="grid grid-cols-4 gap-1 text-xs font-semibold">
                                    {['C','+/-','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='].map((btn, idx) => (
                                        <button key={idx} onClick={() => handleCalc(btn)} className={`p-2.5 rounded ${btn === '=' ? 'bg-emerald-600 text-white col-span-1' : (btn === '0' ? 'bg-slate-700 text-white col-span-2' : 'bg-slate-700 hover:bg-slate-600 text-white')}`}>
                                            {btn}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DUAL VIDEO LECTURES MODAL */}
                    {activeVideoModal && (
                        <DualVideoModal 
                            data={activeVideoModal} 
                            currentItem={currentItem} 
                            notes={videoNotes} 
                            onUpdateNotes={(val) => setVideoNotes(prev => ({ ...prev, [currentItem?.id]: val }))} 
                            onClose={() => setActiveVideoModal(null)} 
                        />
                    )}

                    {/* REPORT QUESTION PROBLEM MODAL */}
                    {showReportModal && (
                        <ReportQuestionModal 
                            item={currentItem} 
                            draftAnswer={currentDraftAnswer[currentIndex]}
                            onClose={() => setShowReportModal(false)} 
                        />
                    )}

                </div>
            );
        }

        // QUESTION-AWARE YOUTUBE RECOMMENDATIONS MODAL
        function DualVideoModal({ data, currentItem, notes, onUpdateNotes, onClose }) {
            const videoList = (data.videos || []).slice(0, 2);
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-5xl max-h-[85vh] flex flex-col overflow-hidden">
                        <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 flex items-center justify-between text-white shrink-0">
                            <div className="flex items-center gap-2 font-bold text-xs md:text-sm min-w-0">
                                <i className="fa-brands fa-youtube text-red-500 text-lg"></i>
                                <span className="truncate">YouTube study results: {data.title}</span>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white ml-3" aria-label="Close video recommendations"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="flex-1 min-h-0 flex flex-col md:flex-row overflow-y-auto">
                            <div className="w-full md:w-2/3 p-4 space-y-3">
                                <p className="text-xs text-slate-300">These searches are built from this question's topic, stem, and learning points. Choose a relevant lecture from the results.</p>
                                {videoList.map((vid, idx) => (
                                    <div key={idx} className="rounded-xl border border-slate-600 bg-slate-700 overflow-hidden">
                                        <div className="px-3 py-2">
                                            <span className="block text-[10px] uppercase tracking-wide font-bold text-red-300 mb-1">{vid.channel}</span>
                                            <span className="block text-sm font-bold text-white">{vid.title}</span>
                                        </div>
                                        {vid.embedUrl ? (
                                            <div className="aspect-video bg-black">
                                                <iframe className="w-full h-full" src={vid.embedUrl} title={vid.title} loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen></iframe>
                                            </div>
                                        ) : (
                                            <div className="p-3 border-t border-slate-600">
                                                <p className="text-[11px] text-slate-300 mb-3">No verified video ID is attached to this question yet. Open the topic-matched YouTube results to choose a lecture.</p>
                                                <a href={vid.url} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs font-bold text-white bg-red-600 rounded-lg px-3 py-2"><i className="fa-brands fa-youtube"></i> Find a matching lecture</a>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="w-full md:w-1/3 bg-slate-900 p-4 border-t md:border-t-0 md:border-l border-slate-700 flex flex-col space-y-3 min-h-56">
                                <label className="text-xs font-bold text-amber-400 flex items-center gap-1.5"><i className="fa-solid fa-pen-to-square"></i> Clinical Study Notes</label>
                                <textarea value={notes[currentItem?.id] || ''} onChange={(e) => onUpdateNotes(e.target.value)} className="flex-1 min-h-40 bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-400 focus:outline-none resize-none" placeholder="Record key notes here..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // QUESTION REPORTING MODAL
        function ReportQuestionModal({ item, draftAnswer, onClose }) {
            const [reportReason, setReportReason] = useState("Typos / Grammatical Error");
            const [details, setDetails] = useState("");
            const [submitted, setSubmitted] = useState(false);

            const handleSendReport = (e) => {
                e.preventDefault();
                const newReport = {
                    id: `REP-${Date.now()}`,
                    itemId: item.id,
                    itemTitle: item.cleanTitle,
                    questionSnapshot: item,
                    userAnswer: draftAnswer || null,
                    mode: 'Self Study',
                    reason: reportReason,
                    details: details,
                    timestamp: new Date().toISOString()
                };

                let existing = JSON.parse(localStorage.getItem('quickrn_question_reports') || '[]');
                existing.push(newReport);
                localStorage.setItem('quickrn_question_reports', JSON.stringify(existing));

                setSubmitted(true);
                setTimeout(() => {
                    onClose();
                }, 1200);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 text-slate-800">
                        <div className="flex items-center justify-between border-b pb-3">
                            <h3 className="font-bold text-slate-900 flex items-center gap-2">
                                <i className="fa-solid fa-flag text-rose-600"></i> Report Question Problem
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        {submitted ? (
                            <div className="py-8 text-center space-y-2">
                                <i className="fa-solid fa-circle-check text-4xl text-emerald-500"></i>
                                <p className="font-bold text-sm text-slate-800">Report saved on this device</p>
                                <a href="saved.html" className="inline-block text-xs font-bold text-blue-700 underline">View in Saved Items</a>
                            </div>
                        ) : (
                            <form onSubmit={handleSendReport} className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-700">Problem Category</label>
                                    <select value={reportReason} onChange={(e) => setReportReason(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 focus:outline-none">
                                        <option>Typos / Grammatical Error</option>
                                        <option>Incorrect Answer Key</option>
                                        <option>Unclear Clinical Rationale</option>
                                        <option>Formatting / Display Issue</option>
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-700">Description of Issue</label>
                                    <textarea required value={details} onChange={(e) => setDetails(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-xs h-24 focus:outline-none" placeholder="Provide details..."></textarea>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold text-slate-600">Cancel</button>
                                    <button type="submit" className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold">Submit Report</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        // DYNAMIC QUESTION RENDERER COMPONENT
        function QuestionRenderer({ item, draftAnswer, savedState, onUpdateDraft }) {
            const html = window.QuickRNSharedRenderer.renderReact(
                item,
                draftAnswer,
                onUpdateDraft,
                !!savedState?.submitted
            );
            return <div className="quickrn-shared-question" dangerouslySetInnerHTML={{ __html: html }} />;
        }

        // MOUNT APP
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<script>
(function(){
 if(!window.QuickRNNgnScoring)return;
 window.quickRNGrade=function(q,d){return window.QuickRNNgnScoring.grade(q,d).isCorrect;};
 if(window.QuickRNSharedRenderer)window.QuickRNSharedRenderer.grade=window.quickRNGrade;
})();
</script>
</body>
</html>
