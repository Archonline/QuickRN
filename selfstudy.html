        // UTILITY FUNCTIONS
        function cleanQuestionText(text) {
            if (!text) return '';
            let cleaned = text.replace(/\[.*?\]\s*/g, '').trim();
            const sentences = cleaned.split(/(?<=[.?!])\s+/);
            const unique = [];
            sentences.forEach(s => {
                const t = s.trim();
                if (t && !unique.includes(t)) unique.push(t);
            });
            return unique.join(' ');
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // DYNAMIC GEMINI AI API CALL FUNCTION WITH EXPONENTIAL BACKOFF
        async function fetchGeminiTutorResponse(prompt, systemInstruction = "") {
            const apiKey = ""; // Canvas runtime environment automatically supplies API key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: {
                    parts: [{
                        text: systemInstruction || "You are an expert NCLEX-RN Nurse Educator and Clinical Tutor. Provide concise, clear, evidence-based, encouraging advice tailored for nursing students."
                    }]
                }
            };

            let delay = 1000;
            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (reply) return reply;
                    }
                } catch (e) {
                    // Retry silently
                }
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
            return "I am currently analyzing your clinical scenario. Remember to focus on ABCs (Airway, Breathing, Circulation), safety priorities, and acute vs. chronic physiological changes!";
        }

            const launchSession = (count) => {
                let rawPool = defaultQBank;
                if (typeof embeddedQuestionsData !== 'undefined' && Array.isArray(embeddedQuestionsData) && embeddedQuestionsData.length > 0) {
                    rawPool = embeddedQuestionsData;
                } else if (typeof window.questions !== 'undefined' && Array.isArray(window.questions) && window.questions.length > 0) {
                    rawPool = window.questions;
                }

                const normalized = rawPool.map((q, idx) => ({
                    ...q,
                    id: q.id || `Q-${idx + 1}`,
                    cleanTitle: cleanQuestionText(q.title || q.promptTitle || q.question || `NCLEX Item ${idx + 1}`),
                    cleanInstruction: cleanQuestionText(q.instruction || q.question || "Evaluate clinical findings and select the appropriate action(s)."),
                    ngnType: q.ngnType || (q.isNGN ? "NGN Format" : "Single Choice"),
                    keyPhrase: q.keyPhrase || q.category || "Clinical Nursing Concept"
                }));

                // Load previously answered question IDs to avoid repeats
                let usedIds = JSON.parse(localStorage.getItem('quickrn_used_q_ids') || '[]');
                let uncompleted = normalized.filter(q => !usedIds.includes(q.id));

                // If pool is fully exhausted or remaining items aren't enough for the requested count, reset pool
                if (uncompleted.length === 0 || (count !== 'all' && uncompleted.length < count)) {
                    alert(usedIds.length > 0 
                        ? `You have completed all ${usedIds.length} questions in the question bank! Re-shuffling and resetting the question pool.`
                        : "Preparing fresh question set."
                    );
                    localStorage.setItem('quickrn_used_q_ids', JSON.stringify([]));
                    uncompleted = normalized;
                }

                // Partition uncompleted pool into NGN and Traditional
                const uncompletedNGN = shuffleArray(uncompleted.filter(q => q.isNGN));
                const uncompletedTrad = shuffleArray(uncompleted.filter(q => !q.isNGN));

                let selected = [];

                if (count === 'all') {
                    selected = shuffleArray(uncompleted);
                } else {
                    // Guarantee at least 30% NGN items or all available NGN items in small sets
                    const targetNGNCount = Math.max(1, Math.min(uncompletedNGN.length, Math.round(count * 0.35)));
                    const ngnSelected = uncompletedNGN.slice(0, targetNGNCount);
                    
                    const remainingNeeded = count - ngnSelected.length;
                    const remainingPool = shuffleArray([
                        ...uncompletedNGN.slice(targetNGNCount),
                        ...uncompletedTrad
                    ]);
                    
                    const tradSelected = remainingPool.slice(0, remainingNeeded);
                    selected = shuffleArray([...ngnSelected, ...tradSelected]);
                }

                // Record newly selected question IDs into used history
                const newlyUsedIds = selected.map(q => q.id);
                const updatedUsedIds = Array.from(new Set([...usedIds, ...newlyUsedIds]));
                localStorage.setItem('quickrn_used_q_ids', JSON.stringify(updatedUsedIds));

                setActivePool(selected);
                setCurrentIndex(0);
                setUserAnswers({});
                setShowLaunchModal(false);
                setShowResults(false);
            };

            const currentItem = activePool[currentIndex];
            const currentSavedState = userAnswers[currentIndex];
            const isSubmitted = currentSavedState?.submitted;

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const handleNext = () => {
                if (currentIndex < activePool.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    finishExam();
                }
            };

            const exitToDashboard = () => {
                if (confirm("Exit test session and return to Dashboard?")) {
                    window.location.href = "dashboard.html";
                }
            };

            const toggleBookmark = (id) => {
                setFlaggedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            // Calculate item score
            const evaluateScore = (item, ans) => {
                if (!ans) return { earned: 0, max: 1 };
                switch (item.ngnType) {
                    case "Matrix / Grid": {
                        let earned = 0, max = item.rows.length;
                        item.rows.forEach(r => { if (ans[r.id] === item.correctAnswers[r.id]) earned++; });
                        return { earned, max };
                    }
                    case "Cloze (Drop-down)": {
                        let earned = 0, max = Object.keys(item.correctAnswers).length;
                        Object.keys(item.correctAnswers).forEach(k => { if (ans[k] === item.correctAnswers[k]) earned++; });
                        return { earned, max };
                    }
                    case "Extended Drag and Drop": {
                        let earned = 0, max = item.correctOrder.length;
                        (ans || []).forEach((v, idx) => { if (v === item.correctOrder[idx]) earned++; });
                        return { earned, max };
                    }
                    case "Extended Multiple Response": {
                        let correctCount = 0, incorrectCount = 0;
                        const correctSet = new Set(item.correctAnswers);
                        (ans || []).forEach(id => {
                            if (correctSet.has(id)) correctCount++;
                            else incorrectCount++;
                        });
                        return { earned: Math.max(0, correctCount - incorrectCount), max: item.correctAnswers.length };
                    }
                    case "Bowtie": {
                        let earned = 0;
                        if (ans.condition === item.correctAnswers.condition) earned++;
                        (ans.actions || []).forEach(a => { if (item.correctAnswers.actions.includes(a)) earned++; });

                            </div>

        // RATIONALE CARD WITH COMBINED SECTIONS & INTEGRATED REAL GEMINI AI TUTOR
        function RationaleCard({ item, onOpenVideoModal }) {
            const [aiResponse, setAiResponse] = useState("");
            const [aiLoading, setAiLoading] = useState(false);
            const [customQuestion, setCustomQuestion] = useState("");
            const [chatHistory, setChatHistory] = useState([]);

            const richKeyphrase = useMemo(() => {
                const parts = [
                    item.category || "",
                    item.cleanTitle || "",
                    item.keyPhrase || "",
                    (item.rationale || "").slice(0, 100)
                ].filter(Boolean).join(" ");
                return parts.replace(/[^\w\s]/gi, '').slice(0, 120);
            }, [item]);

            const combinedRationaleParagraph = useMemo(() => {
                const rat = item.rationale ? item.rationale.trim() : "Understanding the clinical rationale relies on identifying primary physiological risk factors.";
                const obj = item.learningObjectives ? item.learningObjectives.trim() : "Focus on prioritizing acute safety and evidence-based interventions.";
                return `${rat} Consequently, the primary learning objective is to ${obj.charAt(0).toLowerCase() + obj.slice(1)}`;
            }, [item]);

            const combinedStrategyParagraph = useMemo(() => {
                const strat = item.strategyRule ? item.strategyRule.trim() : "Apply standard NCLEX prioritizations using ABCs and Maslow's hierarchy of needs.";
                const insight = item.aiTutorInsight ? item.aiTutorInsight.trim() : "Recognize early cues of physiological instability.";
                return `To master this clinical concept on the NCLEX-RN, ${strat.charAt(0).toLowerCase() + strat.slice(1)} Furthermore, from a clinical decision-making standpoint: ${insight}`;
            }, [item]);

            const handleAskAi = async (userPromptText) => {
                setAiLoading(true);
                const queryText = userPromptText || customQuestion || `Explain the core pathophysiology and critical nursing priorities for ${item.keyPhrase || item.cleanTitle}.`;
                
                const prompt = `Clinical Case Category: ${item.category}\nQuestion: ${item.cleanTitle}\nRationale Context: ${item.rationale}\nUser Query: ${queryText}`;
                const systemPrompt = "You are a friendly, highly knowledgeable NCLEX-RN Nurse Educator. Answer the student's question clearly in 2-3 structured, actionable clinical bullet points or a concise paragraph. Focus on high-yield exam takeaways.";

                const response = await fetchGeminiTutorResponse(prompt, systemPrompt);
                
                setAiResponse(response);
                setChatHistory(prev => [...prev, { q: queryText, a: response }]);
                setCustomQuestion("");
                setAiLoading(false);
            };

            const videoOptions = item.videos || [
                { title: `Clinical Video 1: ${item.keyPhrase}`, id: item.youtubeId || "r5W1ns5C1ik", provider: "RegisteredNurseRN" },
                { title: `Clinical Video 2: ${item.keyPhrase} Review`, id: "0IqA11A1WnE", provider: "Simple Nursing" }
            ];

            return (
                <div className="border-t-2 border-blue-600 bg-blue-50/90 p-5 overflow-y-auto max-h-96 text-xs md:text-sm text-slate-800 space-y-4 shadow-inner shrink-0">
                    
                    {/* COMBINED RATIONALE & LEARNING OBJECTIVES */}
                    <div className="space-y-2">
                        <div className="font-bold text-ncsbn-navy text-sm flex items-center gap-2 border-b border-blue-200 pb-2">
                            <i className="fa-solid fa-book-open-reader text-blue-600"></i>
                            <span>Clinical Rationale & Core Learning Objectives</span>
                        </div>
                        <p className="leading-relaxed bg-white p-4 rounded-xl border border-blue-200 shadow-xs text-slate-800 font-medium">
                            {combinedRationaleParagraph}
                        </p>
                    </div>

                    {/* COMBINED AI TUTOR INSIGHT & TEST TAKING STRATEGIES */}
                    <div className="bg-gradient-to-r from-amber-50 to-indigo-50/80 p-4 rounded-xl border border-amber-300 shadow-xs space-y-2">
                        <div className="font-bold text-slate-900 flex items-center gap-2">
                            <i className="fa-solid fa-lightbulb text-amber-500"></i>
                            <span>NCLEX Test-Taking Strategy & Clinical Insights</span>
                        </div>
                        <p className="text-slate-800 leading-relaxed font-medium">
                            {combinedStrategyParagraph}
                        </p>
                    </div>

                    {/* REAL INTERACTIVE GEMINI AI TUTOR SECTION */}
                    <div className="bg-indigo-950 text-white p-4 rounded-xl shadow-md space-y-3">
                        <div className="flex items-center justify-between border-b border-indigo-800 pb-2">
                            <div className="flex items-center gap-2 font-bold text-xs md:text-sm text-indigo-200">
                                <i className="fa-solid fa-robot text-indigo-400"></i>
                                <span>Real-Time Gemini AI Nurse Tutor</span>
                            </div>
                            <span className="text-[10px] bg-indigo-800 text-indigo-200 px-2 py-0.5 rounded font-mono">Powered by Gemini AI</span>
                        </div>

                        {chatHistory.length > 0 && (
                            <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                {chatHistory.map((chat, idx) => (
                                    <div key={idx} className="bg-indigo-900/80 p-3 rounded-lg space-y-1 text-xs border border-indigo-800">
                                        <p className="font-semibold text-amber-300">Q: {chat.q}</p>
                                        <p className="text-indigo-100 whitespace-pre-line leading-relaxed">{chat.a}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={customQuestion} 
                                onChange={(e) => setCustomQuestion(e.target.value)} 
                                onKeyDown={(e) => e.key === 'Enter' && handleAskAi()} 
                                placeholder="Ask AI Tutor: E.g., 'Why is option 3 contraindicated?'" 
                                className="flex-1 bg-indigo-900 border border-indigo-700 rounded-lg px-3 py-2 text-xs text-white placeholder-indigo-400 focus:outline-none focus:border-indigo-400"
                            />
                            <button 
                                onClick={() => handleAskAi()} 
                                disabled={aiLoading} 
                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold text-xs transition flex items-center gap-1.5 shrink-0 disabled:opacity-50"
                            >
                                {aiLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                                <span>Ask AI</span>
                            </button>
                        </div>
                    </div>

                    {/* BOTTOM VIDEO SELECTION BUTTON */}
                    <div className="pt-2 flex justify-end">
                        <button 
                            onClick={() => onOpenVideoModal(videoOptions)} 
                            className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-2"
                        >
                            <i className="fa-brands fa-youtube text-base"></i>
                            <span>Watch Clinical Video Lectures (2 Options Available)</span>
                        </button>
                    </div>
                </div>
            );
        }

        // REPORT QUESTION MODAL COMPONENT
        function ReportQuestionModal({ item, onClose }) {
            const [issueType, setIssueType] = useState("Typos or Formatting");
            const [reportDetails, setReportDetails] = useState("");
            const [submitted, setSubmitted] = useState(false);

            const handleSubmitReport = (e) => {
                e.preventDefault();
                if (!reportDetails.trim()) return;

                const newReport = {
                    id: `REP-${Date.now()}`,
                    questionId: item.id,
                    questionTitle: item.cleanTitle || item.title,
                    issueType,
                    details: reportDetails,
                    timestamp: new Date().toLocaleString(),
                    status: "Pending Review"
                };

                const existingReports = JSON.parse(localStorage.getItem('quickrn_question_reports') || '[]');
                existingReports.push(newReport);
                localStorage.setItem('quickrn_question_reports', JSON.stringify(existingReports));

                setSubmitted(true);
                setTimeout(() => {
                    onClose();
                }, 1500);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl border border-slate-300 w-full max-w-md overflow-hidden">
                        <div className="bg-slate-900 px-5 py-3 border-b border-slate-800 flex items-center justify-between text-white">
                            <div className="flex items-center gap-2 font-bold text-sm">
                                <i className="fa-solid fa-triangle-exclamation text-amber-400"></i>
                                <span>Report Item Issue</span>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        {submitted ? (
                            <div className="p-6 text-center space-y-3">
                                <i className="fa-solid fa-circle-check text-4xl text-emerald-500"></i>
                                <h3 className="font-bold text-slate-800 text-lg">Report Submitted!</h3>
                                <p className="text-xs text-slate-600">Thank you for helping improve our Q-bank. Report saved to report.html dataset.</p>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmitReport} className="p-5 space-y-4 text-xs text-slate-800">
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">Question ID & Title</label>
                                    <input type="text" readOnly value={`[${item.id}] ${item.cleanTitle}`} className="w-full bg-slate-100 border border-slate-300 rounded-lg p-2 text-xs font-mono text-slate-700" />
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">Type of Problem</label>
                                    <select value={issueType} onChange={(e) => setIssueType(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
                                        <option value="Typos or Formatting">Typos or Formatting Error</option>
                                        <option value="Incorrect Answer Key">Incorrect Answer Key / Rationales</option>
                                        <option value="Unclear EHR or Clinical Data">Unclear EHR / Clinical Data</option>
                                        <option value="Other Technical Issue">Other Technical Issue</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">Detailed Description</label>
                                    <textarea required rows="4" value={reportDetails} onChange={(e) => setReportDetails(e.target.value)} placeholder="Please explain the issue or suggested correction..." className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-slate-700 transition">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition flex items-center gap-1.5">
                                        <i className="fa-solid fa-paper-plane"></i>
                                        <span>Submit Report</span>
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        // DYNAMIC QUESTION RENDERER COMPONENT SUPPORTING ALL ITEM TYPES
        function QuestionRenderer({ item, savedState, draftAnswer, onDraftChange, onSubmit }) {
            const isSubmitted = savedState?.submitted;
            const currentVal = isSubmitted ? savedState.answer : (draftAnswer !== undefined ? draftAnswer : null);

            // Single Choice (SBA)
            if (item.ngnType === "Single Choice" || !item.isNGN) {
                const selectedSingle = currentVal || null;
                return (
                    <div className="space-y-3">
                        {item.options.map((opt, idx) => {
                            const text = opt.text || opt;
                            const isChecked = selectedSingle === text;
                            const isRight = item.correctAnswer === text;

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight) style = "bg-emerald-100 border-emerald-500 ring-1 ring-emerald-500 font-bold text-emerald-950";
                                else if (isChecked && !isRight) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input 
                                            type="radio" 
                                            name="sba" 
                                            checked={isChecked} 
                                            disabled={isSubmitted} 
                                            onChange={() => onDraftChange(text)} 
                                            className="w-4 h-4 text-blue-600"
                                        />
                                        <span className="text-xs md:text-sm font-medium">{text}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            // Extended Multiple Response (SATA)
            if (item.ngnType === "Extended Multiple Response") {
                const selectedSATA = currentVal || [];
                const handleToggle = (optId) => {
                    if (isSubmitted) return;
                    const next = selectedSATA.includes(optId) ? selectedSATA.filter(x => x !== optId) : [...selectedSATA, optId];
                    onDraftChange(next);
                };
                return (
                    <div className="space-y-3">
                        {item.options.map((opt, idx) => {
                            const optId = opt.id || opt.text || opt;
                            const optText = opt.text || opt;
                            const isChecked = selectedSATA.includes(optId);
                            const isRight = item.correctAnswers.includes(optId);

                            let style = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            if (isSubmitted) {
                                if (isRight && isChecked) style = "bg-emerald-100 border-emerald-500 ring-1 ring-emerald-500 font-bold text-emerald-950";
                                else if (isRight && !isChecked) style = "bg-emerald-50 border-emerald-400 font-semibold text-emerald-900";
                                else if (!isRight && isChecked) style = "bg-rose-100 border-rose-400 text-rose-950 font-semibold";
                                else style = "bg-slate-50 border-slate-200 opacity-60";
                            } else if (isChecked) style = "bg-blue-50 border-blue-500 shadow-xs";

                            return (
                                <label key={idx} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => handleToggle(optId)} className="w-4 h-4 text-blue-600 rounded"/>
                                        <span className="text-xs md:text-sm font-medium">{optText}</span>
                                    </div>
                                    {isSubmitted && isRight && <span className="text-xs font-extrabold text-emerald-800 px-2 py-0.5 bg-emerald-200 rounded"><i className="fa-solid fa-check"></i> Correct Option</span>}
                                </label>
                            );
                        })}
                    </div>
                );
            }

            // Matrix / Grid
            if (item.ngnType === "Matrix / Grid") {
                const matrixState = currentVal || {};
                const handleMatrixChange = (rowId, colVal) => {
                    if (isSubmitted) return;
                    const next = { ...matrixState, [rowId]: colVal };
                    onDraftChange(next);
                };
                return (
                    <div className="overflow-x-auto border border-slate-300 rounded-xl">
                        <table className="w-full border-collapse text-xs md:text-sm">
                            <thead className="bg-slate-100 border-b border-slate-300">
                                <tr>
                                    <th className="p-3 text-left font-bold text-slate-700">Clinical Action / Finding</th>
                                    {item.columns.map((col, idx) => <th key={idx} className="p-3 text-center font-bold text-slate-700 w-32">{col}</th>)}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 bg-white">
                                {item.rows.map(row => {
                                    const rightCol = item.correctAnswers[row.id];
                                    const userCol = matrixState[row.id];
                                    return (
                                        <tr key={row.id}>
                                            <td className="p-3 font-medium text-slate-800">{row.text}</td>
                                            {item.columns.map((col, cIdx) => {
                                                const isChecked = userCol === col;
                                                const isRight = rightCol === col;
                                                let bgCell = isSubmitted ? (isRight ? "bg-emerald-100 font-bold" : (isChecked ? "bg-rose-100" : "")) : "";
                                                return (
                                                    <td key={cIdx} className={`p-3 text-center ${bgCell}`}>
                                                        <input type="radio" name={`mat_${row.id}`} checked={isChecked} disabled={isSubmitted} onChange={() => handleMatrixChange(row.id, col)} className="w-4 h-4 text-blue-600"/>
                                                        {isSubmitted && isRight && <span className="block text-[10px] text-emerald-800 font-extrabold mt-0.5"><i className="fa-solid fa-check"></i> Correct</span>}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                );
            }

            // Cloze (Drop-down)
            if (item.ngnType === "Cloze (Drop-down)") {
                const clozeState = currentVal || {};
                const parts = item.clozeTemplate.split(/(\{drop\d+\})/g);
                const handleSelectChange = (key, val) => {
                    if (isSubmitted) return;
                    const next = { ...clozeState, [key]: val };
                    onDraftChange(next);
                };

                return (
                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-300 leading-loose text-xs md:text-base text-slate-900 font-medium space-y-4">
                        <div className="flex flex-wrap items-center gap-2">
                            {parts.map((part, idx) => {
                                const match = part.match(/\{drop(\d+)\}/);
                                if (match) {
                                    const dropKey = `drop${match[1]}`;
                                    const opts = item.options[dropKey] || [];
                                    const userVal = clozeState[dropKey] || "";
                                    const rightVal = item.correctAnswers[dropKey];

                                    let borderStyle = "border-slate-300 bg-white text-slate-800";
                                    if (isSubmitted) {
                                        if (userVal === rightVal) borderStyle = "border-emerald-500 bg-emerald-100 text-emerald-950 font-bold";
                                        else borderStyle = "border-rose-400 bg-rose-100 text-rose-950 font-bold";
                                    }

                                    return (
                                        <div key={idx} className="inline-block my-1">
                                            <select 
                                                value={userVal} 
                                                disabled={isSubmitted} 
                                                onChange={(e) => handleSelectChange(dropKey, e.target.value)} 
                                                className={`px-3 py-1.5 rounded-lg border-2 text-xs md:text-sm focus:outline-none focus:border-blue-500 font-bold ${borderStyle}`}
                                            >
                                                <option value="">-- Select Option --</option>
                                                {opts.map((o, oIdx) => <option key={oIdx} value={o}>{o}</option>)}
                                            </select>
                                            {isSubmitted && userVal !== rightVal && (
                                                <span className="block text-[10px] text-emerald-700 font-bold mt-0.5">Correct: {rightVal}</span>
                                            )}
                                        </div>
                                    );
                                }
                                return <span key={idx}>{part}</span>;
                            })}
                        </div>
                    </div>
                );
            }

            // Extended Drag and Drop (Ordering)
            if (item.ngnType === "Extended Drag and Drop") {
                const dragOrder = currentVal || item.availableItems || [];
                const moveItem = (fromIdx, toIdx) => {
                    if (isSubmitted) return;
                    const next = [...dragOrder];
                    const [itemMoved] = next.splice(fromIdx, 1);
                    next.splice(toIdx, 0, itemMoved);
                    onDraftChange(next);
                };

                return (
                    <div className="space-y-3">
                        <p className="text-xs font-bold text-slate-600 uppercase tracking-wider">Use arrows to sequence steps from Highest Priority (1) to Lowest (4):</p>
                        {dragOrder.map((txt, idx) => {
                            const isRight = isSubmitted && item.correctOrder[idx] === txt;
                            let style = "bg-slate-50 border-slate-300";
                            if (isSubmitted) {
                                style = isRight ? "bg-emerald-100 border-emerald-500 font-bold text-emerald-950" : "bg-rose-100 border-rose-400 text-rose-950 font-bold";
                            }

                            return (
                                <div key={idx} className={`p-3 rounded-xl border flex items-center justify-between gap-3 shadow-xs transition ${style}`}>
                                    <div className="flex items-center gap-3">
                                        <span className="w-7 h-7 bg-slate-800 text-white rounded-lg flex items-center justify-center font-bold text-xs shrink-0">{idx + 1}</span>
                                        <span className="text-xs md:text-sm font-medium">{txt}</span>
                                    </div>
                                    {!isSubmitted && (
                                        <div className="flex gap-1 shrink-0">
                                            <button onClick={() => idx > 0 && moveItem(idx, idx - 1)} disabled={idx === 0} className="w-8 h-8 bg-slate-200 hover:bg-slate-300 rounded-lg text-slate-700 disabled:opacity-30"><i className="fa-solid fa-arrow-up text-xs"></i></button>
                                            <button onClick={() => idx < dragOrder.length - 1 && moveItem(idx, idx + 1)} disabled={idx === dragOrder.length - 1} className="w-8 h-8 bg-slate-200 hover:bg-slate-300 rounded-lg text-slate-700 disabled:opacity-30"><i className="fa-solid fa-arrow-down text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                );
            }

            // Bowtie Diagram
            if (item.ngnType === "Bowtie") {
                const bowtieState = currentVal || { condition: "", actions: [], monitoring: [] };
                const bData = item.bowtieData;
                const handleBowtieChange = (category, val) => {
                    if (isSubmitted) return;
                    let next = { ...bowtieState };
                    if (category === 'condition') {
                        next.condition = val;
                    } else {
                        const currentArr = next[category] || [];
                        next[category] = currentArr.includes(val) ? currentArr.filter(x => x !== val) : [...currentArr, val].slice(0, 2);
                    }
                    onDraftChange(next);
                };

                return (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {/* ACTIONS (LEFT) */}
                        <div className="bg-blue-50/70 p-4 rounded-xl border border-blue-200 space-y-2">
                            <h4 className="font-bold text-xs text-ncsbn-blue uppercase">Actions to Take (Select 2)</h4>
                            {bData.actions.map((act, idx) => {
                                const isChecked = (bowtieState.actions || []).includes(act);
                                return (
                                    <label key={idx} className={`block p-2.5 rounded-lg border text-xs cursor-pointer ${isChecked ? 'bg-blue-600 text-white font-bold' : 'bg-white text-slate-800'}`}>
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => handleBowtieChange('actions', act)} className="hidden"/>
                                        {act}
                                    </label>
                                );
                            })}
                        </div>

                        {/* CONDITION (CENTER) */}
                        <div className="bg-amber-50/70 p-4 rounded-xl border border-amber-200 space-y-2">
                            <h4 className="font-bold text-xs text-amber-900 uppercase">Potential Condition (Select 1)</h4>
                            {bData.conditions.map((cond, idx) => {
                                const isChecked = bowtieState.condition === cond;
                                return (
                                    <label key={idx} className={`block p-2.5 rounded-lg border text-xs cursor-pointer ${isChecked ? 'bg-amber-600 text-white font-bold' : 'bg-white text-slate-800'}`}>
                                        <input type="radio" name="bowtieCond" checked={isChecked} disabled={isSubmitted} onChange={() => handleBowtieChange('condition', cond)} className="hidden"/>
                                        {cond}
                                    </label>
                                );
                            })}
                        </div>

                        {/* MONITORING (RIGHT) */}
                        <div className="bg-emerald-50/70 p-4 rounded-xl border border-emerald-200 space-y-2">
                            <h4 className="font-bold text-xs text-emerald-900 uppercase">Parameters to Monitor (Select 2)</h4>
                            {bData.monitoring.map((mon, idx) => {
                                const isChecked = (bowtieState.monitoring || []).includes(mon);
                                return (
                                    <label key={idx} className={`block p-2.5 rounded-lg border text-xs cursor-pointer ${isChecked ? 'bg-emerald-600 text-white font-bold' : 'bg-white text-slate-800'}`}>
                                        <input type="checkbox" checked={isChecked} disabled={isSubmitted} onChange={() => handleBowtieChange('monitoring', mon)} className="hidden"/>
                                        {mon}
                                    </label>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            return <div className="text-slate-500 text-sm">Interactive NGN Item Loaded.</div>;
        }

        // MOUNT APP
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
